<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Everything runs locally: no network requests, no external scripts, no forms posting anywhere. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="referrer" content="no-referrer" />
    <title>knowledge management</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --panel: #ffffff;
        --panel-alt: #eef3ff;
        --line: #dfe7f5;
        --primary: #4f7cff;
        --primary-dark: #315de8;
        --text: #1e2430;
        --muted: #667085;
        --good: #1f9d55;
        --good-bg: #e6f6ec;
        --warn: #b7791f;
        --warn-bg: #fff4dc;
        --bad: #d64545;
        --bad-bg: #fde8e8;
        --shadow: 0 12px 28px rgba(30, 36, 48, 0.08);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        background: var(--bg);
        color: var(--text);
      }

      body { display: flex; justify-content: center; padding: 24px; }

      .app {
        width: min(1280px, 100%);
        min-height: 760px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        padding: 18px 22px;
        background: linear-gradient(135deg, #eef4ff 0%, #f9fbff 100%);
        border-bottom: 1px solid var(--line);
      }

      .brand { display: flex; align-items: center; gap: 12px; }
      .logo {
        width: 40px; height: 40px; border-radius: 12px; flex: none;
        display: grid; place-items: center;
        background: linear-gradient(135deg, var(--primary) 0%, #7b5cff 100%);
        color: white; font-weight: 800; font-size: 1.2rem;
        box-shadow: 0 6px 14px rgba(79, 124, 255, 0.3);
      }
      .brand-name { display: block; font-weight: 750; font-size: 1.35rem; letter-spacing: -0.03em; line-height: 1.1; }
      .brand-sub { display: block; font-size: 0.78rem; color: var(--muted); margin-top: 2px; }

      .group { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

      button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
        outline: 3px solid rgba(79, 124, 255, 0.45);
        outline-offset: 2px;
      }
      input:focus, select:focus, textarea:focus { border-color: var(--primary); }

      .target-hint { font-size: 0.85rem; color: var(--muted); margin-bottom: 10px; }
      .target-hint strong { color: var(--text); }

      .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0 14px; }
      .stat { background: white; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
      .stat-value { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; }
      .stat-label { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
      .stat.warn .stat-value { color: var(--warn); }
      .stat.bad .stat-value { color: var(--bad); }
      .howto { margin: 8px 0 0; padding-left: 18px; font-size: 0.88rem; }
      .howto li { margin-bottom: 6px; }

      .search {
        flex: 1;
        min-width: 220px;
        max-width: 420px;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 0.95rem;
        background: white;
      }

      .actions { display: flex; gap: 10px; flex-wrap: wrap; }

      button {
        border: none;
        border-radius: 10px;
        font-size: 0.95rem;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }

      button:hover { transform: translateY(-1px); }

      .primary-btn { background: var(--primary); color: white; padding: 10px 16px; font-weight: 700; }
      .secondary-btn { background: #edf2ff; color: var(--text); padding: 10px 16px; font-weight: 600; }
      .danger-btn { background: var(--bad-bg); color: var(--bad); padding: 10px 16px; font-weight: 600; }
      .small-btn { padding: 6px 10px; font-size: 0.82rem; }

      .content { display: grid; grid-template-columns: 240px 1fr 380px; min-height: 700px; }

      .sidebar { background: #f9fbff; border-right: 1px solid var(--line); padding: 18px 16px; }

      .sidebar h3 {
        margin: 18px 0 10px;
        font-size: 0.82rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      .sidebar h3:first-child { margin-top: 0; }

      .nav-list { display: flex; flex-direction: column; gap: 4px; }

      .nav-item {
        padding: 8px 12px;
        border-radius: 10px;
        background: transparent;
        text-align: left;
        font-weight: 600;
        color: var(--text);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .nav-item.sub { font-weight: 400; padding-left: 26px; font-size: 0.9rem; }
      .nav-item.active { background: var(--panel-alt); color: var(--primary-dark); }

      .count {
        background: var(--bad-bg);
        color: var(--bad);
        border-radius: 999px;
        padding: 1px 8px;
        font-size: 0.78rem;
      }

      .main { padding: 20px; min-width: 0; }

      .main-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }

      .breadcrumbs { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; color: var(--muted); font-size: 0.9rem; }
      .crumb { background: transparent; border: none; color: var(--muted); padding: 0; font-size: 0.9rem; cursor: pointer; }
      .crumb.current { color: var(--text); font-weight: 700; cursor: default; }

      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }

      .item-card {
        position: relative;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px 12px 12px;
        text-align: center;
        cursor: pointer;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      .item-card:hover { border-color: #bfd0ff; box-shadow: 0 8px 18px rgba(79, 124, 255, 0.08); }
      .item-card.selected { border-color: var(--primary); }
      .item-card.drop-target { border-color: var(--primary); background: var(--panel-alt); }

      .item-icon { width: 52px; height: 52px; margin: 0 auto 10px; border-radius: 14px; display: grid; place-items: center; font-size: 1.4rem; }
      .folder .item-icon { background: rgba(255, 217, 138, 0.35); }
      .file .item-icon { background: rgba(223, 232, 255, 0.9); }
      .item-name { font-size: 0.92rem; font-weight: 600; word-break: break-word; }
      .item-sub { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }

      .dot { position: absolute; top: 10px; right: 10px; width: 10px; height: 10px; border-radius: 50%; }
      .dot.good { background: var(--good); }
      .dot.warn { background: var(--warn); }
      .dot.bad { background: var(--bad); }

      .badge { display: inline-block; border-radius: 999px; padding: 3px 10px; font-size: 0.78rem; font-weight: 700; }
      .badge.good { background: var(--good-bg); color: var(--good); }
      .badge.warn { background: var(--warn-bg); color: var(--warn); }
      .badge.bad { background: var(--bad-bg); color: var(--bad); }

      .empty-state { border: 1px dashed var(--line); border-radius: 16px; padding: 40px 20px; text-align: center; color: var(--muted); grid-column: 1 / -1; }

      .dropzone-hint { margin-top: 16px; font-size: 0.82rem; color: var(--muted); text-align: center; }
      .main.dragging { outline: 2px dashed var(--primary); outline-offset: -8px; border-radius: 12px; }

      .result-list { display: flex; flex-direction: column; gap: 10px; }
      .result {
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 14px;
        cursor: pointer;
        background: white;
      }
      .result:hover { border-color: #bfd0ff; }
      .result-top { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
      .result-name { font-weight: 700; }
      .result-path { font-size: 0.8rem; color: var(--muted); margin: 3px 0 6px; }
      .result-snippet { font-size: 0.88rem; line-height: 1.45; color: #3a4252; }
      .result-snippet mark { background: #fff1a8; padding: 0 1px; }
      .result-issues { margin: 6px 0 0; padding-left: 18px; font-size: 0.82rem; color: var(--muted); }

      .editor { border-left: 1px solid var(--line); background: #fbfcff; padding: 20px; min-width: 0; }
      .editor-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
      .editor-header h3 { margin: 0; font-size: 1.1rem; word-break: break-word; }
      .editor-path { font-size: 0.8rem; color: var(--muted); margin-bottom: 12px; }

      .editor-placeholder {
        border: 1px dashed var(--line);
        background: white;
        border-radius: 14px;
        padding: 26px 18px;
        color: var(--muted);
        line-height: 1.5;
      }

      .trust-box { border: 1px solid var(--line); background: white; border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; }
      .trust-box ul { margin: 8px 0 0; padding-left: 18px; font-size: 0.85rem; line-height: 1.45; }
      .trust-box li { margin-bottom: 4px; }
      .conflict-quote { display: block; font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
      .link-btn { background: none; padding: 0; color: var(--primary-dark); font-size: inherit; text-decoration: underline; }

      .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
      .meta-grid label { font-size: 0.75rem; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
      .meta-grid input, .meta-grid select {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px 9px;
        font-size: 0.88rem;
        background: white;
        color: var(--text);
      }
      .meta-line { grid-column: 1 / -1; font-size: 0.78rem; color: var(--muted); }

      textarea {
        width: 100%;
        min-height: 340px;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px 16px;
        font: 14px/1.5 "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        background: white;
        color: var(--text);
      }

      .save-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
      .save-row .group { display: flex; gap: 8px; flex-wrap: wrap; }
      .status-msg { font-size: 0.82rem; color: var(--muted); }

      .modal {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(18, 26, 37, 0.42);
        z-index: 20;
      }
      .modal-card {
        width: min(420px, calc(100vw - 32px));
        background: white;
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 22px;
        box-shadow: var(--shadow);
      }
      .modal-card h3 { margin: 0 0 12px; }
      .modal-card p { margin: 0 0 16px; color: var(--muted); line-height: 1.45; }
      .modal-card input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 14px;
        font-size: 1rem;
        margin-bottom: 8px;
      }
      .modal-error { color: var(--bad); font-size: 0.85rem; min-height: 1.2em; margin-bottom: 8px; }
      .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }

      .view-toggle { display: inline-flex; background: #edf2ff; border-radius: 10px; padding: 3px; }
      .view-toggle button { background: transparent; padding: 6px 12px; font-size: 0.85rem; font-weight: 600; color: var(--muted); }
      .view-toggle button.on { background: white; color: var(--primary-dark); box-shadow: 0 1px 3px rgba(30, 36, 48, 0.1); }
      .view-toggle button:hover { transform: none; }
      .header-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

      .content.graph-wide { grid-template-columns: 240px 1fr; }
      .content.graph-wide .editor { display: none; }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
      .chip { font-size: 0.78rem; padding: 4px 10px; border-radius: 999px; background: #edf2ff; color: var(--text); }
      .chip strong { font-weight: 800; }
      .chip.warn { background: var(--warn-bg); color: var(--warn); }
      .chip.bad { background: var(--bad-bg); color: var(--bad); }
      .graph-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
      .zoom { gap: 4px; }
      .zoom .small-btn { min-width: 32px; }
      .zoom-label { font-size: 0.8rem; color: var(--muted); min-width: 44px; text-align: center; font-variant-numeric: tabular-nums; }

      .graph-wrap {
        position: relative;
        overflow: auto;
        min-height: 460px;
        max-height: 68vh;
        border: 1px solid var(--line);
        border-radius: 14px;
        background-color: #fcfdff;
        background-image: radial-gradient(#dfe6f4 1px, transparent 1px);
        background-size: 18px 18px;
      }
      .graph-wrap.animating { overflow: hidden; }
      .graph-sizer { position: relative; margin: 0 auto; }
      .graph-canvas { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
      .graph-lines { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; }
      .graph-lines path { fill: none; stroke: #b3c2e4; stroke-width: 2; stroke-linecap: round; }

      .gnode {
        position: absolute;
        top: 0;
        left: 0;
        width: 184px;
        height: 58px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 14px;
        background: white;
        border: 1px solid var(--line);
        box-shadow: 0 4px 12px rgba(30, 36, 48, 0.06);
        text-align: left;
        color: var(--text);
        will-change: transform, opacity;
        transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
      }
      .gnode:hover { border-color: #bfd0ff; box-shadow: 0 8px 18px rgba(79, 124, 255, 0.12); }
      .gnode.folder { background: #fffaf0; border-color: #f1ddb0; }
      .gnode.folder:hover { border-color: #e6c67c; }
      .gnode.folder.open { background: #fff4dc; }
      .gnode.selected { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 124, 255, 0.2); }
      .gnode.ghost {
        background: transparent;
        border: 1px dashed #c9d4ea;
        box-shadow: none;
        justify-content: center;
        color: var(--muted);
        font-style: italic;
        cursor: default;
      }
      .gnode.ghost .gnode-name { font-weight: 400; font-size: 0.8rem; }
      .gnode-icon { font-size: 1.25rem; flex: none; }
      .gnode-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
      .gnode-name { font-weight: 700; font-size: 0.86rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .gnode-meta { font-size: 0.72rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .gnode-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
      .gnode-dot.good { background: var(--good); }
      .gnode-dot.warn { background: var(--warn); }
      .gnode-dot.bad { background: var(--bad); }
      .gnode-toggle {
        position: absolute;
        left: 50%;
        bottom: -10px;
        width: 20px;
        height: 20px;
        margin-left: -10px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--primary);
        color: white;
        font-size: 0.85rem;
        font-weight: 800;
        line-height: 1;
        box-shadow: 0 2px 6px rgba(79, 124, 255, 0.35);
      }
      .gnode.open .gnode-toggle { background: #8a97b3; box-shadow: none; }
      .gnode.file { width: 196px; height: 44px; padding: 5px 10px; border-radius: 12px; }
      .gnode.file .gnode-icon { font-size: 1.05rem; }
      .gnode.file .gnode-name { font-size: 0.78rem; line-height: 1.2; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; }
      .gnode.file .gnode-meta { font-size: 0.68rem; }
      .gnode.summary { background: #eefaf3; border-color: #bfe5cd; }
      .gnode.summary:hover { border-color: #8fd0a8; box-shadow: 0 8px 18px rgba(31, 157, 85, 0.14); }
      .gnode.summary.open { background: #e2f6ea; }
      .gnode.summary.selected { border-color: var(--good); box-shadow: 0 0 0 3px rgba(31, 157, 85, 0.2); }
      .gnode.summary .gnode-name { white-space: normal; line-height: 1.15; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-size: 0.8rem; }
      .gnode.summary .gnode-toggle { background: var(--good); box-shadow: 0 2px 6px rgba(31, 157, 85, 0.35); cursor: pointer; width: 22px; height: 22px; margin-left: -11px; bottom: -11px; }
      .gnode.summary .gnode-toggle:hover { filter: brightness(1.1); }
      .gnode.summary.open .gnode-toggle { background: #8a97b3; box-shadow: none; }

      .viewer-body.as-card { white-space: normal; font: inherit; background: white; padding: 22px 26px; }
      .policy-title { text-align: center; color: #1f3a5f; font-size: 1.5rem; margin: 0 0 4px; letter-spacing: -0.01em; }
      .policy-sub { text-align: center; color: var(--muted); font-size: 0.85rem; }
      .policy-effective { text-align: center; font-weight: 700; font-size: 0.9rem; margin: 10px 0 4px; padding-top: 10px; border-top: 2px solid #4f7cff; }
      .policy-hint { text-align: center; font-size: 0.75rem; color: var(--muted); margin-bottom: 10px; }
      .policy-section { border-radius: 10px; }
      .policy-head {
        display: flex; flex-direction: column; align-items: flex-start; gap: 1px;
        width: 100%; text-align: left; background: transparent; color: var(--text);
        padding: 7px 10px; border-radius: 10px; font-size: 0.9rem;
      }
      .policy-head:hover, .policy-head.open { background: var(--panel-alt); transform: none; }
      .policy-h { font-weight: 700; font-size: 1rem; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
      .policy-count { font-weight: 400; font-size: 0.72rem; color: var(--primary-dark); }
      .policy-val { font-weight: 700; }
      .policy-det { font-size: 0.8rem; color: #3a4252; padding-left: 14px; }
      .policy-footer { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 10px; font-size: 0.88rem; line-height: 1.6; }
      .policy-compiled { font-size: 0.75rem; color: var(--muted); margin-top: 6px; }
      .considered { margin: 4px 0 10px 14px; padding: 10px 12px; border-left: 3px solid #cfdcff; background: #fbfcff; border-radius: 0 10px 10px 0; }
      .considered-intro { font-size: 0.78rem; color: var(--muted); margin-bottom: 8px; }
      .considered-doc { background: white; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; }
      .considered-doc.used { border-color: #9fd8b5; box-shadow: 0 0 0 2px rgba(31, 157, 85, 0.1); }
      .considered-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 0.86rem; }
      .considered-tag { font-size: 0.72rem; font-weight: 700; border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
      .considered-tag.good { background: var(--good-bg); color: var(--good); }
      .considered-tag.bad { background: var(--bad-bg); color: var(--bad); }
      .considered-tag.muted { background: #eef1f6; color: var(--muted); }
      .considered-meta { font-size: 0.74rem; color: var(--muted); margin-top: 2px; }
      .considered-quote { font-size: 0.8rem; color: #3a4252; margin-top: 4px; font-style: italic; }
      .group-title { margin: 18px 0 8px; font-size: 0.95rem; }
      .group-title:first-of-type { margin-top: 4px; }
      .group-count { font-weight: 400; color: var(--muted); font-size: 0.85rem; }
      .gnode.section { background: #f4f7ff; border-color: #d4def7; }
      .gnode.section.open { background: #e9efff; }
      .gnode.section .gnode-toggle { background: #6f8fe8; }
      .gnode.section.open .gnode-toggle { background: #8a97b3; }

      .cite {
        background: var(--panel-alt);
        color: var(--primary-dark);
        border: 1px solid #cfdcff;
        border-radius: 6px;
        padding: 0 4px;
        margin: 0 1px;
        font: inherit;
        font-size: 0.82em;
        font-weight: 700;
        vertical-align: 1px;
      }
      .cite:hover { background: var(--primary); color: white; transform: none; }
      .source-banner {
        display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
        background: #eefaf3; border: 1px solid #bfe5cd; border-radius: 12px;
        padding: 10px 14px; margin-bottom: 14px; font-size: 0.9rem;
      }
      .item-card.summary { background: #f5fcf8; border-color: #cdebd8; }
      .item-card.summary .item-icon { background: rgba(31, 157, 85, 0.12); }
      li.conflict { margin-bottom: 8px; }
      .nav-item.quiet { font-weight: 400; color: var(--muted); font-size: 0.85rem; }

      .viewer-card { width: min(720px, calc(100vw - 32px)); max-height: calc(100vh - 48px); display: flex; flex-direction: column; }
      .viewer-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
      .viewer-head h3 { margin: 0; word-break: break-word; }
      .viewer-path { font-size: 0.82rem; color: var(--muted); margin: 4px 0 12px; }
      .viewer-body {
        flex: 1;
        overflow: auto;
        margin: 0 0 14px;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fbfcff;
        white-space: pre-wrap;
        word-break: break-word;
        font: 14px/1.5 "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      }
      .viewer-card .trust-box { max-height: 30vh; overflow: auto; }

      .score {
        display: inline-flex;
        align-items: baseline;
        gap: 6px;
        flex: none;
        background: var(--panel-alt);
        color: var(--primary-dark);
        border: 1px solid #cfdcff;
        border-radius: 12px;
        padding: 5px 11px;
        white-space: nowrap;
      }
      .score-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; }
      .score-value { font-size: 1.15rem; font-weight: 800; }
      .editor-header, .viewer-head { align-items: flex-start; }

      .hidden { display: none !important; }

      @media (max-width: 1000px) {
        body { padding: 0; }
        .app { border-radius: 0; }
        .content { grid-template-columns: 1fr; }
        .sidebar, .editor { border: none; border-top: 1px solid var(--line); }
        .sidebar { order: -1; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <div class="brand">
          <span class="logo" aria-hidden="true">K</span>
          <span>
            <span class="brand-name">knowledge management</span>
            <span class="brand-sub">find it · understand it · trust it</span>
          </span>
        </div>
        <input class="search" id="searchInput" type="search" placeholder="Search all notes…  ( / )" aria-label="Search all notes" />
        <div class="actions">
          <button class="secondary-btn" id="importFilesBtn" title="Add .txt files from your computer to the selected folder">Import files</button>
          <button class="secondary-btn" id="importFolderBtn" title="Import a whole folder, keeping its sub-folders">Import folder</button>
          <button class="secondary-btn" id="downloadAllBtn">Download all</button>
          <button class="secondary-btn" id="newFolderBtn">+ Folder</button>
          <button class="primary-btn" id="newFileBtn">+ File</button>
        </div>
        <input type="file" id="fileInput" accept=".txt,text/plain" multiple class="hidden" />
        <input type="file" id="folderInput" webkitdirectory directory multiple class="hidden" />
      </div>

      <div class="content" id="content">
        <aside class="sidebar">
          <h3>Workspace</h3>
          <div class="nav-list" id="navList"></div>
          <h3>Review</h3>
          <div class="nav-list">
            <button class="nav-item" id="attentionNav">Needs attention <span class="count hidden" id="attentionCount"></span></button>
          </div>
          <h3>Demo</h3>
          <div class="nav-list">
            <button class="nav-item quiet" id="resetNav" title="Replace everything with the built-in example documents">Reset demo data</button>
          </div>
        </aside>

        <main class="main" id="main">
          <div class="main-header">
            <div class="breadcrumbs" id="breadcrumbs"></div>
            <div class="header-right">
              <div class="group" id="folderActions"></div>
              <div class="view-toggle" id="viewToggle" role="group" aria-label="Layout">
                <button type="button" data-layout="grid">▦ Folders</button>
                <button type="button" data-layout="graph">◉ Graph</button>
              </div>
            </div>
          </div>
          <div id="mainBody"></div>
          <div class="dropzone-hint" id="dropHint">Tip: drag .txt files here to add them to this folder.</div>
        </main>

        <aside class="editor" id="editor"></aside>
      </div>
    </div>

    <div id="modal" class="modal hidden" aria-modal="true" role="dialog">
      <div class="modal-card">
        <h3 id="modalTitle"></h3>
        <p id="modalText" class="hidden"></p>
        <input id="modalInput" type="text" maxlength="120" />
        <div class="modal-error" id="modalError"></div>
        <div class="modal-actions">
          <button class="secondary-btn" id="modalCancel" type="button">Cancel</button>
          <button class="primary-btn" id="modalConfirm" type="button">OK</button>
        </div>
      </div>
    </div>

    <div id="viewer" class="modal hidden" aria-modal="true" role="dialog" aria-labelledby="viewerTitle">
      <div class="modal-card viewer-card">
        <div class="viewer-head">
          <h3 id="viewerTitle"></h3>
          <span id="viewerScore"></span>
        </div>
        <div class="viewer-path" id="viewerPath"></div>
        <div id="viewerTrust"></div>
        <div class="viewer-body" id="viewerBody"></div>
        <div class="modal-actions">
          <button class="secondary-btn" id="viewerClose" type="button">Close</button>
          <button class="secondary-btn hidden" id="viewerSources" type="button">Open as folder</button>
          <button class="primary-btn" id="viewerEdit" type="button">Edit</button>
        </div>
      </div>
    </div>

    <!-- Built-in example documents (the same files as the company folders on disk). -->
    <script type="application/json" id="seed-data">[{"path": ["Company A", "America", "Employee Working Conditions"], "name": "Employee Handbook - Working Conditions v4.0.txt", "content": "EMPLOYEE WORKING CONDITIONS POLICY\nCompany: Company A (United States)\nPolicy ID: PEO-US-010\nEffective date: 1 January 2026\nVersion: 4.0\nPolicy owner: People Team (US)\nStatus: Approved\n\n1. Purpose and Scope\nThis policy establishes the general working conditions applicable to all regular employees of Company A in the United States, unless otherwise stated in an individual employment agreement, collective labour agreement or legally binding amendment. Where applicable legislation or an individual employment agreement provides more favourable conditions, those conditions shall take precedence.\n\n2. Working Hours\nThe standard schedule is 40 hours per week, Monday to Friday, with core hours from 10:00 to 15:00. Non-exempt employees are paid overtime at 1.5 times their regular rate for hours worked over 40 in a workweek, as required by the Fair Labor Standards Act. Overtime must be approved in advance.\n\n3. Annual Leave\nFull-time employees receive 15 days of paid time off (PTO) per year, accrued each pay period. After 5 years of service this increases to 20 days per year. Up to 5 unused PTO days can be carried over to the next year.\n\n4. Remote Work\nEmployees in hybrid roles may work remotely up to 2 days per week and work from the office on the other days.\n\n5. Sick Leave\nEmployees receive 5 paid sick days per year, or more where state or local law requires it. A doctor's note is required after 3 consecutive days of absence.\n\n6. Meal Vouchers\nCompany A does not offer meal vouchers in the United States. Lunch is provided in the office on office days.\n\n7. Parental and Special Leave\nEmployees receive 12 weeks of paid parental leave after the birth or adoption of a child. Eligible employees are also protected under the Family and Medical Leave Act (FMLA).\n\n8. Policy Administration\nHuman Resources is responsible for the interpretation, implementation and maintenance of this policy. The company may amend this policy where required by changes in legislation, operational requirements or company practices. Any amendment must be formally approved and communicated to affected employees before becoming effective. The latest approved version supersedes all previous versions.\n\nApproved by: Director of Human Resources\nApproval date: 1 December 2025\n"}, {"path": ["Company A", "America", "Employee Working Conditions"], "name": "Employee Handbook - Working Conditions v3.2 (2024).txt", "content": "EMPLOYEE WORKING CONDITIONS POLICY\nCompany: Company A (United States)\nPolicy ID: PEO-US-010\nEffective date: 1 January 2024\nVersion: 3.2\nPolicy owner: People Team (US)\nStatus: Superseded\n\n1. Purpose and Scope\nThis policy establishes the general working conditions applicable to all regular employees of Company A in the United States, unless otherwise stated in an individual employment agreement, collective labour agreement or legally binding amendment. Where applicable legislation or an individual employment agreement provides more favourable conditions, those conditions shall take precedence.\n\n2. Working Hours\nThe standard schedule is 40 hours per week, Monday to Friday. Non-exempt employees are paid overtime at 1.5 times their regular rate for hours worked over 40 in a workweek.\n\n3. Annual Leave\nFull-time employees receive 12 days of paid time off (PTO) per year. Unused days cannot be carried over.\n\n4. Remote Work\nEmployees in hybrid roles may work remotely up to 3 days per week.\n\n5. Sick Leave\nEmployees receive 3 paid sick days per year.\n\n6. Meal Vouchers\nCompany A does not offer meal vouchers in the United States.\n\n7. Parental and Special Leave\nEmployees receive 8 weeks of paid parental leave after the birth or adoption of a child.\n\n8. Policy Administration\nHuman Resources is responsible for the interpretation, implementation and maintenance of this policy. The company may amend this policy where required by changes in legislation, operational requirements or company practices. Any amendment must be formally approved and communicated to affected employees before becoming effective. The latest approved version supersedes all previous versions.\n\nApproved by: Director of Human Resources\nApproval date: 4 December 2023\n"}, {"path": ["Company A", "America", "Employee Working Conditions"], "name": "Email - More paid sick days.txt", "content": "From: People Team (US)\nTo: All US employees\nDate: 2026-04-01\nSubject: More paid sick days from April\n\nHi everyone,\n\nFrom April 2026, every employee receives 7 paid sick days per year instead of 5.\nThe rule for doctor's notes does not change: we need one after 3 consecutive days of absence.\n\nTake care,\nPeople Team\n"}, {"path": ["Company A", "America", "Employee Working Conditions"], "name": "Email - Office days from October.txt", "content": "From: Office of the COO\nTo: All US employees\nDate: 2026-09-10\nSubject: Four office days from October\n\nHi all,\n\nFrom October 2026, hybrid employees work from the office 4 days per week, so remote work is limited to 1 day per week.\nWe will review this arrangement at the end of the year.\n\nThanks for making this work,\nOffice of the COO\n"}, {"path": ["Company A", "America", "Employee Working Conditions"], "name": "Email - PTO carry-over reminder.txt", "content": "From: People Team (US)\nTo: All US employees\nDate: 2026-09-15\nSubject: Reminder: plan your remaining PTO\n\nHi everyone,\n\nA friendly reminder that only 5 unused PTO days can be carried over into 2027.\nAnything above that is lost on December 31, so talk to your manager now if you still have days to plan.\n\nThanks,\nPeople Team\n"}, {"path": ["Company A", "America", "Employee Working Conditions"], "name": "Email - PTO changes for 2023.txt", "content": "From: HR Department\nTo: All US employees\nDate: 2022-11-03\nSubject: PTO changes for 2023\n\nDear colleagues,\n\nStarting next year, full-time employees receive 12 days of paid time off per year.\nCarry-over of unused days will no longer be allowed.\n\nRegards,\nHR Department\n"}, {"path": ["Company A", "America", "Employee Working Conditions"], "name": "Email - Summer Fridays 2026.txt", "content": "From: Office of the COO\nTo: All US employees\nDate: 2026-05-20\nSubject: Summer Fridays are back\n\nHi all,\n\nFrom Memorial Day to Labor Day, our US offices close at 1 pm on Fridays.\nYour weekly hours stay the same, so plan the missing Friday afternoon earlier in the week.\n\nEnjoy the summer!\n"}, {"path": ["Company A", "America", "Employee Working Conditions"], "name": "payrollemail.txt", "content": "Subject: Updated Minimum Wage at Company A\n\nDear Team,\n\nWe are pleased to share that the minimum wage at Company A has been raised to $75,000 per year in the United States.\n\nThis increase reflects our commitment to recognizing the value of our employees and supporting fair compensation across our organization. We believe this adjustment will help ensure our team members are compensated competitively and can continue to thrive in their roles.\n\nThank you for your dedication and hard work. We appreciate everything you do to contribute to the success of Company A.\n\nSincerely,\n[Your Name]\n[Your Title]\nCompany A\n"}, {"path": ["Company A", "America", "Employee Working Conditions"], "name": "SUMMARY.txt", "content": "Employee Working Conditions\nCompany A - America\nCurrent approved policy — Effective 1 January 2026\n\nWorking hours\n40 hours per week\n  Monday to Friday, core hours 10:00 to 15:00\n  Summer Fridays: offices close at 1 pm from Memorial Day to Labor Day\n  Source: Employee Handbook - Working Conditions v4.0.txt; Email - Summer Fridays 2026.txt\n\nOvertime\n1.5 times the regular hourly rate\n  For non-exempt employees, for hours over 40 in a workweek\n  Must be approved in advance\n  Source: Employee Handbook - Working Conditions v4.0.txt\n\nVacation\n15 days of paid time off per year\n  20 days after 5 years of service\n  Up to 5 unused days carry over; the rest is lost on December 31\n  Source: Employee Handbook - Working Conditions v4.0.txt; Email - PTO carry-over reminder.txt\n\nRemote work\nUp to 1 day per week\n  From October 2026: 4 office days per week (announced 10 September 2026); handbook v4.0 says 2 remote days\n  Source: Email - Office days from October.txt\n\nSick leave\n7 paid sick days per year\n  Doctor's note required after 3 consecutive days\n  Since April 2026 (announced 1 April 2026); handbook v4.0 says 5 days\n  Source: Email - More paid sick days.txt\n\nMeal vouchers\nNot offered in the United States\n  Lunch is provided in the office on office days\n  Source: Employee Handbook - Working Conditions v4.0.txt\n\nParental and special leave\n12 weeks of paid parental leave\n  Job protection under the FMLA where eligible\n  Source: Employee Handbook - Working Conditions v4.0.txt\n\nPolicy owner: People Team (US)\nStatus: Approved\nEffective date: 1 January 2026\nVersion: 4.0\nCompiled: 2026-09-30 from 8 source documents\n"}, {"path": ["Company A", "Belgium", "Employee Working Conditions"], "name": "Working Conditions Policy v3.1.txt", "content": "EMPLOYEE WORKING CONDITIONS POLICY\nCompany: Company A (Belgium)\nPolicy ID: HR-BE-004\nEffective date: 1 January 2026\nVersion: 3.1\nPolicy owner: Human Resources Belgium\nStatus: Approved\n\n1. Purpose and Scope\nThis policy establishes the general working conditions applicable to all permanent employees of Company A working under a Belgian employment contract, unless otherwise stated in an individual employment agreement, collective labour agreement or legally binding amendment. Where applicable legislation or an individual employment agreement provides more favourable conditions, those conditions shall take precedence.\n\n2. Working Hours\nThe standard full-time working schedule consists of 38 hours per week, normally distributed across five working days from Monday to Friday. Alternative schedules may be agreed with the employee's manager, subject to applicable working-time rules. Any working time beyond the agreed schedule must receive prior approval. Approved overtime shall be compensated at 150% of the employee's standard hourly rate or, where agreed, through equivalent compensatory time off.\n\n3. Annual Leave\nFull-time employees are entitled to a minimum of 21 paid vacation days per calendar year. After each completed year of continuous employment, employees receive one additional paid vacation day, up to a maximum of 26 paid vacation days per calendar year. Vacation requests must be submitted through the HR platform and are subject to manager approval.\n\n4. Remote Work\nEmployees whose role is suitable for remote work may work remotely for up to 2 days per working week. Remote-working days must be coordinated with the employee's manager and may be restricted where physical presence is required.\n\n5. Sick Leave\nEmployees unable to work due to illness must notify their manager and Human Resources as soon as reasonably possible. A medical certificate is required when an absence exceeds 2 consecutive working days.\n\n6. Meal Vouchers\nEligible employees receive meal vouchers with a total value of €8 per working day. Meal vouchers are provided only for days on which the employee has effectively performed work.\n\n7. Parental and Special Leave\nEmployees may request parental leave, maternity or paternity leave, bereavement leave and other forms of special leave in accordance with applicable Belgian employment legislation and internal HR procedures.\n\n8. Policy Administration\nHuman Resources is responsible for the interpretation, implementation and maintenance of this policy. The company may amend this policy where required by changes in legislation, operational requirements or company practices. Any amendment must be formally approved and communicated to affected employees before becoming effective. The latest approved version supersedes all previous versions.\n\nApproved by: Director of Human Resources\nApproval date: 15 December 2025\n"}, {"path": ["Company A", "Belgium", "Employee Working Conditions"], "name": "Working Conditions Policy v2.4 (2024).txt", "content": "EMPLOYEE WORKING CONDITIONS POLICY\nCompany: Company A (Belgium)\nPolicy ID: HR-BE-004\nEffective date: 1 January 2024\nVersion: 2.4\nPolicy owner: Human Resources Belgium\nStatus: Superseded\n\n1. Purpose and Scope\nThis policy establishes the general working conditions applicable to all permanent employees of Company A working under a Belgian employment contract, unless otherwise stated in an individual employment agreement, collective labour agreement or legally binding amendment. Where applicable legislation or an individual employment agreement provides more favourable conditions, those conditions shall take precedence.\n\n2. Working Hours\nThe standard full-time working schedule consists of 38 hours per week from Monday to Friday. Approved overtime shall be compensated at 150% of the employee's standard hourly rate or through equivalent compensatory time off.\n\n3. Annual Leave\nFull-time employees are entitled to a minimum of 20 paid vacation days per calendar year. After each completed year of continuous employment, employees receive one additional paid vacation day, up to a maximum of 25 paid vacation days per calendar year.\n\n4. Remote Work\nEmployees whose role is suitable for remote work may work remotely for up to 3 days per working week, in agreement with their manager.\n\n5. Sick Leave\nEmployees unable to work due to illness must notify their manager immediately. A medical certificate is required from the first day of absence.\n\n6. Meal Vouchers\nEligible employees receive meal vouchers with a total value of €7 per working day.\n\n7. Parental and Special Leave\nParental and special leave are available in accordance with applicable Belgian employment legislation.\n\n8. Policy Administration\nHuman Resources is responsible for the interpretation, implementation and maintenance of this policy. The company may amend this policy where required by changes in legislation, operational requirements or company practices. Any amendment must be formally approved and communicated to affected employees before becoming effective. The latest approved version supersedes all previous versions.\n\nApproved by: Director of Human Resources\nApproval date: 12 December 2023\n"}, {"path": ["Company A", "Belgium", "Employee Working Conditions"], "name": "Email - Remote work from April 2026.txt", "content": "From: Management Team Belgium\nTo: All employees Belgium\nDate: 2026-03-02\nSubject: Remote work: one day per week from April\n\nDear all,\n\nFrom 1 April 2026, remote work is limited to 1 day per week.\nTuesdays and Thursdays are office days for everyone, so plan your remote day on Monday, Wednesday or Friday.\nThe HR platform will be updated before the start of April.\n\nThe Management Team\n"}, {"path": ["Company A", "Belgium", "Employee Working Conditions"], "name": "Email - Overtime on Sundays and public holidays.txt", "content": "From: Ann Peeters, Payroll Belgium\nTo: All employees Belgium\nDate: 2026-02-10\nSubject: Overtime on Sundays and public holidays\n\nDear colleagues,\n\nA quick reminder on how overtime is paid.\nApproved overtime is paid at 150% of your hourly rate, and at 200% on Sundays and public holidays.\nAlways ask your manager for approval before you work extra hours.\n\nKind regards,\nAnn\n"}, {"path": ["Company A", "Belgium", "Employee Working Conditions"], "name": "Email - Meal vouchers reminder.txt", "content": "From: Ann Peeters, Payroll Belgium\nTo: All employees Belgium\nDate: 2026-05-12\nSubject: Meal vouchers: how they work\n\nDear colleagues,\n\nWe regularly get questions about meal vouchers, so here is a short reminder.\nYou receive a meal voucher worth €8 for every working day you actually worked.\nDays of leave or training outside the office do not count.\n\nKind regards,\nAnn\n"}, {"path": ["Company A", "Belgium", "Employee Working Conditions"], "name": "Email - Sick leave reporting.txt", "content": "From: Pieter Janssens, HR Belgium\nTo: All employees Belgium\nDate: 2026-01-20\nSubject: Reporting sick: the steps\n\nDear all,\n\nIf you are ill, call your manager before 9:00 on your first day of illness and register the absence in the HR platform.\nA medical certificate is needed when you are absent for more than 2 consecutive working days.\n\nGet well soon when it happens,\nPieter\n"}, {"path": ["Company A", "Belgium", "Employee Working Conditions"], "name": "Email - Birth leave.txt", "content": "From: Pieter Janssens, HR Belgium\nTo: All employees Belgium\nDate: 2025-11-04\nSubject: Birth leave for co-parents\n\nDear all,\n\nA reminder for future parents: in Belgium, the co-parent is entitled to 20 days of birth leave, to be taken within four months of the birth.\nPlease let HR know as early as possible so we can plan and inform the payroll team.\n\nPieter\n"}, {"path": ["Company A", "Belgium", "Employee Working Conditions"], "name": "SUMMARY.txt", "content": "Employee Working Conditions\nCompany A - Belgium\nCurrent approved policy — Effective 1 January 2026\n\nWorking hours\n38 hours per week\n  Monday to Friday\n  Source: Working Conditions Policy v3.1.txt\n\nOvertime\n150% of normal hourly rate\n  or equivalent compensatory time off\n  200% on Sundays and public holidays\n  Source: Email - Overtime on Sundays and public holidays.txt; Working Conditions Policy v3.1.txt\n\nVacation\n21 days per year\n  +1 additional day for every completed year of employment\n  Maximum: 26 days\n  Source: Working Conditions Policy v3.1.txt\n\nRemote work\nUp to 1 day per week\n  Since 1 April 2026 (announced 2 March 2026); policy v3.1 still says 2 days\n  Tuesdays and Thursdays are office days for everyone\n  Source: Email - Remote work from April 2026.txt\n\nSick leave\nMedical certificate required after 2 consecutive working days\n  Call your manager before 9:00 on the first day of illness\n  Source: Email - Sick leave reporting.txt; Working Conditions Policy v3.1.txt\n\nMeal vouchers\n€8 per working day\n  Only for days actually worked\n  Source: Email - Meal vouchers reminder.txt; Working Conditions Policy v3.1.txt\n\nParental and special leave\nAvailable according to Belgian employment law and company procedures.\n  Birth leave for the co-parent: 20 days\n  Source: Working Conditions Policy v3.1.txt; Email - Birth leave.txt\n\nPolicy owner: Human Resources Belgium\nStatus: Approved\nEffective date: 1 January 2026\nVersion: 3.1\nCompiled: 2026-09-30 from 7 source documents\n"}, {"path": ["Company A", "France", "Employee Working Conditions"], "name": "Politique conditions de travail v2.0.txt", "content": "EMPLOYEE WORKING CONDITIONS POLICY\nCompany: Company A (France)\nPolicy ID: RH-FR-002\nEffective date: 1 January 2025\nVersion: 2.0\nPolicy owner: RH France (Julien Bernard)\nStatus: Approved\n\n1. Purpose and Scope\nThis policy establishes the general working conditions applicable to all permanent employees of Company A working under a French employment contract, unless otherwise stated in an individual employment agreement, collective labour agreement or legally binding amendment. Where applicable legislation or an individual employment agreement provides more favourable conditions, those conditions shall take precedence.\n\n2. Working Hours\nThe standard full-time schedule consists of 37 hours per week from Monday to Friday. Because the legal working week in France is 35 hours, the extra hours are compensated with 10 RTT days per year. Overtime must be approved in advance and is paid at +25% for the first 8 overtime hours per week and at +50% beyond that.\n\n3. Annual Leave\nEmployees receive 25 working days of paid leave (congés payés) per year, i.e. five weeks. At least 12 consecutive days must be taken between 1 May and 31 October.\n\n4. Remote Work\nTélétravail is possible up to 2 days per week, agreed with the employee's manager and recorded in the HR tool.\n\n5. Sick Leave\nEmployees who are ill must send their sick note (arrêt de travail) to Human Resources within 48 hours.\n\n6. Meal Vouchers\nEmployees receive titres-restaurant with a face value of €9 per working day. Company A pays 60% of the face value.\n\n7. Parental and Special Leave\nParental, maternity, paternity and special leave are granted in accordance with French employment law. Paternity leave is 25 days.\n\n8. Policy Administration\nHuman Resources is responsible for the interpretation, implementation and maintenance of this policy. The company may amend this policy where required by changes in legislation, operational requirements or company practices. Any amendment must be formally approved and communicated to affected employees before becoming effective. The latest approved version supersedes all previous versions.\n\nApproved by: Director of Human Resources\nApproval date: 10 December 2024\n"}, {"path": ["Company A", "France", "Employee Working Conditions"], "name": "Politique conditions de travail v1.3 (2022).txt", "content": "EMPLOYEE WORKING CONDITIONS POLICY\nCompany: Company A (France)\nPolicy ID: RH-FR-002\nEffective date: 1 January 2022\nVersion: 1.3\nPolicy owner: RH France\nStatus: Superseded\n\n1. Purpose and Scope\nThis policy establishes the general working conditions applicable to all permanent employees of Company A working under a French employment contract, unless otherwise stated in an individual employment agreement, collective labour agreement or legally binding amendment. Where applicable legislation or an individual employment agreement provides more favourable conditions, those conditions shall take precedence.\n\n2. Working Hours\nThe standard full-time schedule consists of 39 hours per week. The extra hours above the legal 35 hours are compensated with 20 RTT days per year.\n\n3. Annual Leave\nEmployees receive 25 working days of paid leave (congés payés) per year.\n\n4. Remote Work\nTélétravail is possible up to 1 day per week.\n\n5. Sick Leave\nEmployees who are ill must send their sick note (arrêt de travail) within 48 hours.\n\n6. Meal Vouchers\nEmployees receive titres-restaurant with a face value of €8 per working day.\n\n7. Parental and Special Leave\nParental and special leave are granted in accordance with French employment law.\n\n8. Policy Administration\nHuman Resources is responsible for the interpretation, implementation and maintenance of this policy. The company may amend this policy where required by changes in legislation, operational requirements or company practices. Any amendment must be formally approved and communicated to affected employees before becoming effective. The latest approved version supersedes all previous versions.\n\nApproved by: Director of Human Resources\nApproval date: 6 December 2021\n"}, {"path": ["Company A", "France", "Employee Working Conditions"], "name": "Email - RTT days 2026.txt", "content": "From: Julien Bernard, RH France\nTo: Tous les salariés / All employees France\nDate: 2026-01-05\nSubject: Vos jours de RTT 2026 / Your RTT days for 2026\n\nBonjour,\n\nIn 2026, full-time employees on the 37-hour schedule have their extra hours compensated with 11 RTT days.\nFive of them are fixed by the company (see the calendar); you choose the others yourself.\n\nJulien\n"}, {"path": ["Company A", "France", "Employee Working Conditions"], "name": "Email - Titres-restaurant from March 2026.txt", "content": "From: Claire Martin, Paie France\nTo: Tous les salariés / All employees France\nDate: 2026-02-02\nSubject: Titres-restaurant : nouvelle valeur / new value\n\nBonjour à tous,\n\nGood news: from 1 March 2026, the face value of your titres-restaurant rises to €10 per working day.\nCompany A keeps paying 60% of the value.\n\nClaire\n"}, {"path": ["Company A", "France", "Employee Working Conditions"], "name": "Email - Right to disconnect.txt", "content": "From: Direction France\nTo: Tous les salariés / All employees France\nDate: 2025-06-18\nSubject: Droit à la déconnexion / Right to disconnect\n\nBonjour à tous,\n\nA reminder of our right-to-disconnect agreement: outside working hours nobody is expected to read or answer work messages,\nin particular between 20:00 and 08:00, at weekends or during leave. Please schedule emails instead of sending them late.\n\nLa Direction\n"}, {"path": ["Company A", "France", "Employee Working Conditions"], "name": "Email - Summer leave requests.txt", "content": "From: Julien Bernard, RH France\nTo: Tous les salariés / All employees France\nDate: 2026-02-16\nSubject: Congés d'été / Summer leave requests\n\nBonjour,\n\nPlease submit your summer leave requests in the HR tool before 31 March.\nManagers will confirm all requests by mid-April.\n\nJulien\n"}, {"path": ["Company A", "France", "Employee Working Conditions"], "name": "Email - Teletravail reminder.txt", "content": "From: Julien Bernard, RH France\nTo: Tous les salariés / All employees France\nDate: 2026-06-03\nSubject: Télétravail : rappel / reminder\n\nBonjour,\n\nA reminder that télétravail is possible up to 2 days per week, agreed with your manager and recorded in the HR tool.\nMondays are team days in the office.\n\nJulien\n"}, {"path": ["Company A", "France", "Employee Working Conditions"], "name": "SUMMARY.txt", "content": "Employee Working Conditions\nCompany A - France\nCurrent approved policy — Effective 1 January 2025\n\nWorking hours\n37 hours per week\n  11 RTT days in 2026 for the hours above 35 (announced 5 January 2026); policy v2.0 says 10\n  Outside working hours, no one is expected to answer work messages (20:00 to 08:00)\n  Source: Email - RTT days 2026.txt; Politique conditions de travail v2.0.txt\n\nOvertime\n+25% for the first 8 overtime hours per week\n  +50% after that\n  Must be approved in advance\n  Source: Politique conditions de travail v2.0.txt\n\nVacation\n25 working days per year\n  Five weeks of congés payés\n  At least 12 consecutive days between 1 May and 31 October\n  Summer requests before 31 March\n  Source: Politique conditions de travail v2.0.txt; Email - Summer leave requests.txt\n\nRemote work\nUp to 2 days per week\n  Agreed with your manager; Mondays are team days in the office\n  Source: Email - Teletravail reminder.txt; Politique conditions de travail v2.0.txt\n\nSick leave\nSend your sick note (arrêt de travail) within 48 hours\n  Source: Politique conditions de travail v2.0.txt\n\nMeal vouchers\n€10 per working day\n  Titres-restaurant; Company A pays 60%\n  Since 1 March 2026 (announced 2 February 2026); policy v2.0 says €9\n  Source: Email - Titres-restaurant from March 2026.txt\n\nParental and special leave\nAvailable according to French employment law and company procedures.\n  Paternity leave: 25 days\n  Source: Politique conditions de travail v2.0.txt\n\nPolicy owner: RH France (Julien Bernard)\nStatus: Approved\nEffective date: 1 January 2025\nVersion: 2.0\nCompiled: 2026-09-30 from 7 source documents\n"}, {"path": ["Company B", "America", "Employee Working Conditions"], "name": "Working Conditions Handbook v2.1.txt", "content": "WORKING CONDITIONS HANDBOOK\nCompany: Company B (United States)\nPolicy ID: POPS-US-02\nEffective date: 15 March 2025\nVersion: 2.1\nPolicy owner: People Ops (Jasmine Ortiz)\nStatus: Approved\n\n1. Purpose and Scope\nThis policy establishes the general working conditions applicable to all regular employees of Company B in the United States, unless otherwise stated in an individual employment agreement, collective labour agreement or legally binding amendment. Where applicable legislation or an individual employment agreement provides more favourable conditions, those conditions shall take precedence.\n\n2. Working Hours\nThe standard working time is 40 hours per week. Non-exempt employees are paid overtime at 1.5 times their regular rate for hours worked over 40 in a workweek.\n\n3. Annual Leave\nCompany B offers flexible paid time off (PTO) agreed with your manager. Employees are expected to take at least 10 days off per year, including one full week in a row. Company B also observes 11 paid holidays.\n\n4. Remote Work\nEmployees in hybrid roles work from the office 3 days per week and may work remotely up to 2 days per week.\n\n5. Sick Leave\nEmployees receive 5 paid sick days per year, or more where state law requires it. A doctor's note is required after 5 consecutive days of absence.\n\n6. Meal Vouchers\nCompany B does not offer meal vouchers. Employees receive a $15 meal stipend for every day they work from the office.\n\n7. Parental and Special Leave\nBirthing parents receive 16 weeks of paid parental leave; other parents receive 8 weeks.\n\n8. Policy Administration\nHuman Resources is responsible for the interpretation, implementation and maintenance of this policy. The company may amend this policy where required by changes in legislation, operational requirements or company practices. Any amendment must be formally approved and communicated to affected employees before becoming effective. The latest approved version supersedes all previous versions.\n\nApproved by: Director of Human Resources\nApproval date: 1 March 2025\n"}, {"path": ["Company B", "America", "Employee Working Conditions"], "name": "Email - Office days from October.txt", "content": "From: Office of the CEO\nTo: All US employees\nDate: 2026-09-10\nSubject: More time together in the office\n\nHi all,\n\nFrom October 2026, employees in hybrid roles work from the office 4 days per week, Monday to Thursday,\nso remote work is limited to 1 day per week (Friday).\n\nThanks for making this work,\nThe CEO office\n"}, {"path": ["Company B", "America", "Employee Working Conditions"], "name": "Email - Parental leave for all parents.txt", "content": "From: Jasmine Ortiz, People Ops\nTo: All US employees\nDate: 2026-07-01\nSubject: Equal parental leave for all parents\n\nHi everyone,\n\nFrom July 2026, all parents receive 16 weeks of paid parental leave, whether they gave birth or not.\nIf you are currently on parental leave, People Ops will contact you about the extension.\n\nJasmine\n"}, {"path": ["Company B", "America", "Employee Working Conditions"], "name": "Email - 2026 holiday calendar.txt", "content": "From: Jasmine Ortiz, People Ops\nTo: All US employees\nDate: 2025-12-01\nSubject: 2026 holiday calendar\n\nHi everyone,\n\nCompany B observes 11 paid holidays in 2026. The full list, including the floating holiday you can pick yourself,\nis in the people portal.\n\nJasmine\n"}, {"path": ["Company B", "America", "Employee Working Conditions"], "name": "DRAFT - Time off policy update.txt", "content": "COMPANY B - TIME OFF (US) - PROPOSED UPDATE\nDocument owner: People Ops (Jasmine Ortiz)\nStatus: Draft\nLast updated: 2026-08-28\n\nProposal, not yet approved: employees would be expected to take at least 15 days of paid time off per year,\nincluding one full week in a row.\n"}, {"path": ["Company B", "America", "Employee Working Conditions"], "name": "Email - New payroll provider.txt", "content": "From: Derek Chen, Finance\nTo: All US employees\nDate: 2026-08-19\nSubject: We are moving to a new payroll provider\n\nHi team,\n\nStarting with the October 15 payroll, Company B will use a new payroll provider.\nYou will get an invitation to create your account in the week of September 28.\nYour pay schedule does not change.\n\nDerek\n"}, {"path": ["Company B", "America", "Employee Working Conditions"], "name": "SUMMARY.txt", "content": "Employee Working Conditions\nCompany B - America\nCurrent approved policy — Effective 15 March 2025\n\nWorking hours\n40 hours per week\n  Source: Working Conditions Handbook v2.1.txt\n\nOvertime\n1.5 times the regular hourly rate\n  For non-exempt employees, for hours over 40 in a workweek\n  Source: Working Conditions Handbook v2.1.txt\n\nVacation\nFlexible PTO, at least 10 days per year\n  Including one full week in a row\n  Plus 11 paid holidays in 2026\n  A proposed minimum of 15 days is still a draft and not in force\n  Source: Working Conditions Handbook v2.1.txt; Email - 2026 holiday calendar.txt\n\nRemote work\nUp to 1 day per week\n  From October 2026: 4 office days, Monday to Thursday (announced 10 September 2026); handbook v2.1 says 2 remote days\n  Source: Email - Office days from October.txt\n\nSick leave\n5 paid sick days per year\n  Or more where state law requires it\n  Doctor's note required after 5 consecutive days\n  Source: Working Conditions Handbook v2.1.txt\n\nMeal vouchers\n$15 meal stipend per office day\n  No meal vouchers in the United States\n  Source: Working Conditions Handbook v2.1.txt\n\nParental and special leave\n16 weeks of paid parental leave for all parents\n  Since July 2026 (announced 1 July 2026); handbook v2.1 gives other parents 8 weeks\n  Source: Email - Parental leave for all parents.txt\n\nPolicy owner: People Ops (Jasmine Ortiz)\nStatus: Approved\nEffective date: 15 March 2025\nVersion: 2.1\nCompiled: 2026-09-30 from 6 source documents\n"}, {"path": ["Company B", "Belgium", "Employee Working Conditions"], "name": "Working Conditions Policy v1.2.txt", "content": "EMPLOYEE WORKING CONDITIONS POLICY\nCompany: Company B (Belgium)\nPolicy ID: HR-B-BE-01\nEffective date: 1 September 2025\nVersion: 1.2\nPolicy owner: Human Resources Belgium (Sofie Maes)\nStatus: Approved\n\n1. Purpose and Scope\nThis policy establishes the general working conditions applicable to all permanent employees of Company B working under a Belgian employment contract, unless otherwise stated in an individual employment agreement, collective labour agreement or legally binding amendment. Where applicable legislation or an individual employment agreement provides more favourable conditions, those conditions shall take precedence.\n\n2. Working Hours\nThe full-time working week is 40 hours, Monday to Friday. To bring the average back to 38 hours per week, employees receive 12 ADV days per year. Approved overtime is paid at 150% of the standard hourly rate, and at 200% on Sundays and public holidays.\n\n3. Annual Leave\nFull-time employees are entitled to 20 legal vacation days per calendar year, based on the days worked in the previous year. The 12 ADV days come on top of this.\n\n4. Remote Work\nEmployees may work from home up to 2 days per week, agreed with their manager.\n\n5. Sick Leave\nEmployees who are ill must inform their manager before the start of the working day. A medical certificate is required from the first day of illness.\n\n6. Meal Vouchers\nEmployees receive meal vouchers worth €7 per working day actually worked.\n\n7. Parental and Special Leave\nParental, birth, adoption and special leave are granted in accordance with Belgian employment legislation.\n\n8. Policy Administration\nHuman Resources is responsible for the interpretation, implementation and maintenance of this policy. The company may amend this policy where required by changes in legislation, operational requirements or company practices. Any amendment must be formally approved and communicated to affected employees before becoming effective. The latest approved version supersedes all previous versions.\n\nApproved by: Director of Human Resources\nApproval date: 20 August 2025\n"}, {"path": ["Company B", "Belgium", "Employee Working Conditions"], "name": "Email - Meal vouchers go up in July.txt", "content": "From: Sofie Maes, Payroll Belgium\nTo: All employees Belgium\nDate: 2026-06-01\nSubject: Meal vouchers go up in July\n\nHi all,\n\nGood news: from 1 July 2026, meal vouchers increase to €8 per working day.\nThe new amount will be loaded onto your card with the July salary.\n\nSofie\n"}, {"path": ["Company B", "Belgium", "Employee Working Conditions"], "name": "Email - Sick leave without certificate.txt", "content": "From: Sofie Maes, HR Belgium\nTo: All employees Belgium\nDate: 2026-01-15\nSubject: Sick leave: no certificate needed for the first day\n\nHi all,\n\nFrom 1 February 2026, you no longer need a medical certificate for the first day of illness, up to 3 times per calendar year.\nFrom the second day of illness, a medical certificate is still required.\nPlease keep informing your manager before the start of the working day.\n\nSofie\n"}, {"path": ["Company B", "Belgium", "Employee Working Conditions"], "name": "Email - Collective closure summer 2026.txt", "content": "From: Sofie Maes, HR Belgium\nTo: All employees Belgium\nDate: 2026-03-05\nSubject: Collective closure this summer\n\nHi all,\n\nOur Belgian offices close from Monday 20 July to Friday 31 July 2026.\n21 July is a public holiday, so the closure uses nine of your vacation days.\n\nSofie\n"}, {"path": ["Company B", "Belgium", "Employee Working Conditions"], "name": "Email - Overtime approval.txt", "content": "From: Operations Belgium\nTo: All employees Belgium\nDate: 2025-11-12\nSubject: Overtime: approve it first\n\nHi all,\n\nOvertime must be approved in advance in the time-tracking tool.\nApproved overtime is paid at 150% of your hourly rate; overtime that was not approved cannot be paid.\n\nOperations Belgium\n"}, {"path": ["Company B", "Belgium", "Employee Working Conditions"], "name": "DRAFT - four-day week proposal.txt", "content": "COMPANY B BELGIUM - FOUR-DAY WEEK (PROPOSAL)\nDocument owner: HR Belgium (Sofie Maes)\nStatus: Draft\nLast updated: 2026-08-25\n\nProposal, not yet approved: employees could choose to work their full-time hours in a four-day week instead of five.\nThis needs a change to the work rules and approval from the works council before it can start.\n"}, {"path": ["Company B", "Belgium", "Employee Working Conditions"], "name": "SUMMARY.txt", "content": "Employee Working Conditions\nCompany B - Belgium\nCurrent approved policy — Effective 1 September 2025\n\nWorking hours\n40 hours per week\n  12 ADV days per year bring the average back to 38 hours\n  A four-day week is only a draft proposal and is not in force\n  Source: Working Conditions Policy v1.2.txt\n\nOvertime\n150% of normal hourly rate\n  200% on Sundays and public holidays\n  Approve it in advance in the time-tracking tool\n  Source: Working Conditions Policy v1.2.txt; Email - Overtime approval.txt\n\nVacation\n20 days per year\n  Plus 12 ADV days\n  Collective closure 20 to 31 July 2026 uses 9 vacation days\n  Source: Working Conditions Policy v1.2.txt; Email - Collective closure summer 2026.txt\n\nRemote work\nUp to 2 days per week\n  Agreed with your manager\n  Source: Working Conditions Policy v1.2.txt\n\nSick leave\nMedical certificate required from the second day of illness\n  No certificate for the first day, up to 3 times per year\n  Since 1 February 2026 (announced 15 January 2026); policy v1.2 still says from the first day\n  Source: Email - Sick leave without certificate.txt\n\nMeal vouchers\n€8 per working day\n  Since 1 July 2026 (announced 1 June 2026); policy v1.2 says €7\n  Source: Email - Meal vouchers go up in July.txt\n\nParental and special leave\nAvailable according to Belgian employment law and company procedures.\n  Source: Working Conditions Policy v1.2.txt\n\nPolicy owner: Human Resources Belgium (Sofie Maes)\nStatus: Approved\nEffective date: 1 September 2025\nVersion: 1.2\nCompiled: 2026-09-30 from 6 source documents\n"}, {"path": ["Company B", "France", "Employee Working Conditions"], "name": "Politique conditions de travail v3.0.txt", "content": "EMPLOYEE WORKING CONDITIONS POLICY\nCompany: Company B (France)\nPolicy ID: RH-B-FR-03\nEffective date: 1 June 2025\nVersion: 3.0\nPolicy owner: RH France (Élodie Petit)\nStatus: Approved\n\n1. Purpose and Scope\nThis policy establishes the general working conditions applicable to all permanent employees of Company B working under a French employment contract, unless otherwise stated in an individual employment agreement, collective labour agreement or legally binding amendment. Where applicable legislation or an individual employment agreement provides more favourable conditions, those conditions shall take precedence.\n\n2. Working Hours\nThe working week is 35 hours. Hours above 35 per week are overtime: the first 8 overtime hours are paid at +25% and further hours at +50%. Overtime must be requested by the manager.\n\n3. Annual Leave\nEmployees earn 2.5 days of paid leave (jours ouvrables) per month worked, i.e. 30 jours ouvrables or five weeks per year. The reference period runs from 1 June to 31 May.\n\n4. Remote Work\nTélétravail is possible up to 3 days per week, agreed with the employee's manager.\n\n5. Sick Leave\nEmployees who are ill must send their sick note (arrêt de travail) to Human Resources within 48 hours.\n\n6. Meal Vouchers\nEmployees receive titres-restaurant with a face value of €8.50 per working day. Company B pays 50% of the face value.\n\n7. Parental and Special Leave\nParental, maternity, paternity and special leave are granted in accordance with French employment law. Company B keeps paying the full salary during the 25 days of paternity leave.\n\n8. Policy Administration\nHuman Resources is responsible for the interpretation, implementation and maintenance of this policy. The company may amend this policy where required by changes in legislation, operational requirements or company practices. Any amendment must be formally approved and communicated to affected employees before becoming effective. The latest approved version supersedes all previous versions.\n\nApproved by: Director of Human Resources\nApproval date: 15 May 2025\n"}, {"path": ["Company B", "France", "Employee Working Conditions"], "name": "Working hours France (2019).txt", "content": "COMPANY B FRANCE - WORKING HOURS\nDocument owner: RH France\nStatus: Superseded\nLast updated: 2019-03-01\nLast reviewed: 2019-03-01\n\nThe working week is 39 hours, compensated with RTT days.\n"}, {"path": ["Company B", "France", "Employee Working Conditions"], "name": "Email - Teletravail from May 2026.txt", "content": "From: Élodie Petit, RH France\nTo: Tous les salariés / All employees France\nDate: 2026-04-20\nSubject: Télétravail : 2 jours par semaine / 2 days per week\n\nBonjour à tous,\n\nFrom May 2026, télétravail is limited to 2 days per week (it used to be up to 3).\nTuesdays and Thursdays are office days for all teams.\n\nÉlodie\n"}, {"path": ["Company B", "France", "Employee Working Conditions"], "name": "Email - Titres-restaurant employer share.txt", "content": "From: Élodie Petit, Paie France\nTo: Tous les salariés / All employees France\nDate: 2026-01-08\nSubject: Titres-restaurant : participation employeur / employer share\n\nBonjour à tous,\n\nFrom January 2026, Company B pays 60% of your titres-restaurant (it was 50%).\nThe face value stays €8.50 per working day.\n\nÉlodie\n"}, {"path": ["Company B", "France", "Employee Working Conditions"], "name": "Email - Leave request deadline.txt", "content": "From: Élodie Petit, RH France\nTo: Tous les salariés / All employees France\nDate: 2026-02-02\nSubject: Summer leave: requests before 15 March\n\nBonjour,\n\nPlease enter your summer leave requests in the HR tool before 15 March so we can plan the team rotas.\n\nÉlodie\n"}, {"path": ["Company B", "France", "Employee Working Conditions"], "name": "SUMMARY.txt", "content": "Employee Working Conditions\nCompany B - France\nCurrent approved policy — Effective 1 June 2025\n\nWorking hours\n35 hours per week\n  Source: Politique conditions de travail v3.0.txt\n\nOvertime\n+25% for the first 8 overtime hours per week\n  +50% after that\n  Requested by your manager\n  Source: Politique conditions de travail v3.0.txt\n\nVacation\n30 days per year\n  2.5 days (jours ouvrables) per month worked, i.e. five weeks\n  Reference period 1 June to 31 May; summer requests before 15 March\n  Source: Politique conditions de travail v3.0.txt; Email - Leave request deadline.txt\n\nRemote work\nUp to 2 days per week\n  Since May 2026 (announced 20 April 2026); policy v3.0 still says 3 days\n  Tuesdays and Thursdays are office days\n  Source: Email - Teletravail from May 2026.txt\n\nSick leave\nSend your sick note (arrêt de travail) within 48 hours\n  Source: Politique conditions de travail v3.0.txt\n\nMeal vouchers\n€8.50 per working day\n  Titres-restaurant; Company B pays 60% since January 2026 (policy v3.0 says 50%)\n  Source: Email - Titres-restaurant employer share.txt; Politique conditions de travail v3.0.txt\n\nParental and special leave\nAvailable according to French employment law and company procedures.\n  Full salary during the 25 days of paternity leave\n  Source: Politique conditions de travail v3.0.txt\n\nPolicy owner: RH France (Élodie Petit)\nStatus: Approved\nEffective date: 1 June 2025\nVersion: 3.0\nCompiled: 2026-09-30 from 5 source documents\n"}]</script>

    <script>
      'use strict';

      /* ---------- Storage & data model ---------- */

      // v4: one "Employee Working Conditions" summary per company and country (see the seed-data block above).
      const STORAGE_KEY = 'knowledge-management-drive-v4';
      const STALE_DAYS = 180;
      const MAX_IMPORT_BYTES = 2 * 1024 * 1024;

      const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2));
      const now = () => new Date().toISOString();

      function folder(name, children = []) {
        return { id: uid(), type: 'folder', name, children };
      }

      function file(name, content = '', extra = {}) {
        const t = now();
        return {
          id: uid(),
          type: 'file',
          name,
          content,
          owner: '',
          status: 'draft',        // draft | verified | outdated
          createdAt: t,
          updatedAt: t,
          reviewedAt: null,
          changedAt: null,        // set when added or edited in the app (used to spot stale summaries)
          ...extra
        };
      }

      // A summary is a folder that carries its own summary text (SUMMARY.txt on disk).
      // It is shown as one document; its children are the source documents it summarises.
      const isSummary = (n) => !!n && n.type === 'folder' && typeof n.summary === 'string';
      const isDoc = (n) => !!n && (n.type === 'file' || isSummary(n));
      const docText = (n) => (n.type === 'file' ? n.content : n.summary || '');
      const docTitle = (n) => (isSummary(n) ? n.name + ' — summary' : n.name);

      const MONTH_NAMES = ['january', 'february', 'march', 'april', 'may', 'june', 'july', 'august', 'september', 'october', 'november', 'december'];

      // "2026-01-05" or "1 January 2026" → ISO timestamp (noon UTC, so the day never shifts with time zones).
      function toIso(value) {
        const v = String(value);
        let m = v.match(/(\d{4})-(\d{2})-(\d{2})/);
        if (m) return new Date(Date.UTC(+m[1], +m[2] - 1, +m[3], 12)).toISOString();
        m = v.match(/(\d{1,2})\s+([a-zé]+)\s+(\d{4})/i);
        if (m && MONTH_NAMES.includes(m[2].toLowerCase())) return new Date(Date.UTC(+m[3], MONTH_NAMES.indexOf(m[2].toLowerCase()), +m[1], 12)).toISOString();
        return null;
      }

      // Reads document header / footer lines: "Document owner:" / "Policy owner:", "From:", "Status:",
      // "Last updated:" / "Date:" / "Effective date:", "Last reviewed:" / "Approval date:" and a summary's "Compiled:".
      function parseDocMeta(text) {
        const meta = {};
        const lines = text.split(/\r?\n/);
        const scan = [...lines.slice(0, 15), ...lines.slice(Math.max(15, lines.length - 10))];
        scan.forEach((line) => {
          let m;
          if ((m = line.match(/^\s*(?:document owner|policy owner|owner)\s*:\s*(.+)$/i))) meta.owner = m[1].trim().slice(0, 80);
          else if ((m = line.match(/^\s*from\s*:\s*(.+)$/i))) { if (!meta.owner) meta.owner = m[1].replace(/<[^>]*>/g, '').trim().slice(0, 80); }
          else if ((m = line.match(/^\s*status\s*:\s*([a-z]+)/i))) {
            const st = m[1].toLowerCase();
            meta.status = /^(approved|verified|final|current)$/.test(st) ? 'verified'
              : /^(superseded|outdated|obsolete|archived|expired)$/.test(st) ? 'outdated' : 'draft';
            meta.proposal = /^(draft|proposal|proposed)$/.test(st);   // an explicit draft, never used in a summary
          } else if ((m = line.match(/^\s*(?:last reviewed|approval date)\s*:\s*(.+)$/i))) { const t = toIso(m[1]); if (t) meta.reviewedAt = t; }
          else if ((m = line.match(/^\s*compiled\s*:\s*(.+)$/i))) { const t = toIso(m[1]); if (t) { meta.updatedAt = t; meta.createdAt = t; meta.reviewedAt = meta.reviewedAt || t; } }
          else if ((m = line.match(/^\s*(?:last updated|date|effective date)\s*:\s*(.+)$/i))) { const t = toIso(m[1]); if (t && !meta.updatedAt) { meta.updatedAt = t; meta.createdAt = t; } }
        });
        return meta;
      }

      /* ---------- Summary template ---------- */

      // The sections of the "Employee Working Conditions" summary template, and how to recognise a source
      // document that talks about each one. A document can belong to several sections (a full policy covers all).
      const SECTIONS = [
        { key: 'hours', title: 'Working hours', re: /working hours|hours per week|hours a week|working week|workweek|work week|weekly hours|-hour schedule|full-time schedule|core hours|\bRTT\b|\bADV\b|four-day week/i },
        { key: 'overtime', title: 'Overtime', re: /overtime/i },
        { key: 'vacation', title: 'Vacation', re: /vacation|paid time off|\bPTO\b|annual leave|paid leave|congés|paid holidays|holiday calendar|collective closure|leave requests?/i },
        { key: 'remote', title: 'Remote work', re: /remote|home working|work from home|working from home|télétravail|teletravail|hybrid|office days/i },
        { key: 'sick', title: 'Sick leave', re: /\bsick\b|illness|\bill\b|medical certificate|doctor's note|arrêt de travail/i },
        { key: 'meal', title: 'Meal vouchers', re: /meal voucher|meal stipend|titres?-restaurant|\blunch\b/i },
        { key: 'parental', title: 'Parental and special leave', re: /parental|maternity|paternity|birth leave|birthing|adoption|bereavement|special leave/i }
      ];
      const OTHER_SECTION = { key: 'other', title: 'Other documents' };
      const FOOTER_LABELS = /^(policy owner|document owner|status|effective date|version|compiled)\s*:/i;

      function docSectionKeys(fileNode) {
        const keys = SECTIONS.filter((sec) => sec.re.test(fileNode.content)).map((sec) => sec.key);
        return keys.length ? keys : ['other'];
      }

      // Source documents of a summary, grouped per template section (newest first).
      function sectionGroups(summaryNode) {
        const groups = new Map([...SECTIONS, OTHER_SECTION].map((sec) => [sec.key, []]));
        const files = [];
        walk(summaryNode, (n) => { if (n.type === 'file') files.push(n); });
        files.forEach((f) => docSectionKeys(f).forEach((k) => groups.get(k).push(f)));
        const time = (f) => (f.updatedAt ? Date.parse(f.updatedAt) : 0);
        groups.forEach((list) => list.sort((a, b) => time(b) - time(a) || a.name.localeCompare(b.name)));
        return groups;
      }

      // Parses a SUMMARY.txt written in the template format.
      function parseSummary(text) {
        const lines = text.split(/\r?\n/);
        const out = { title: '', subtitle: '', effective: '', sections: [], footer: [], extra: [] };
        const head = [];
        let i = 0;
        for (; i < lines.length; i++) {
          const t = lines[i].trim();
          if (!t) { if (head.length) break; continue; }
          head.push(t);
        }
        out.title = head[0] || '';
        head.slice(1).forEach((h) => { if (/^current|effective/i.test(h)) out.effective = h; else out.subtitle = out.subtitle ? out.subtitle + ' · ' + h : h; });
        let cur = null;
        for (; i < lines.length; i++) {
          const raw = lines[i];
          const t = raw.trim();
          if (!t) { cur = null; continue; }
          if (FOOTER_LABELS.test(t)) {
            const [label, ...rest] = t.split(':');
            out.footer.push({ label: label.trim(), value: rest.join(':').trim() });
