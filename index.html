<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Everything runs locally: no network requests, no external scripts, no forms posting anywhere. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="referrer" content="no-referrer" />
    <title>knowledge management</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --panel: #ffffff;
        --panel-alt: #eef3ff;
        --line: #dfe7f5;
        --primary: #4f7cff;
        --primary-dark: #315de8;
        --text: #1e2430;
        --muted: #667085;
        --good: #1f9d55;
        --good-bg: #e6f6ec;
        --warn: #b7791f;
        --warn-bg: #fff4dc;
        --bad: #d64545;
        --bad-bg: #fde8e8;
        --shadow: 0 12px 28px rgba(30, 36, 48, 0.08);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        background: var(--bg);
        color: var(--text);
      }

      body { display: flex; justify-content: center; padding: 24px; }

      .app {
        width: min(1280px, 100%);
        min-height: 760px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        padding: 18px 22px;
        background: linear-gradient(135deg, #eef4ff 0%, #f9fbff 100%);
        border-bottom: 1px solid var(--line);
      }

      .brand { display: flex; align-items: center; gap: 12px; }
      .logo {
        width: 40px; height: 40px; border-radius: 12px; flex: none;
        display: grid; place-items: center;
        background: linear-gradient(135deg, var(--primary) 0%, #7b5cff 100%);
        color: white; font-weight: 800; font-size: 1.2rem;
        box-shadow: 0 6px 14px rgba(79, 124, 255, 0.3);
      }
      .brand-name { display: block; font-weight: 750; font-size: 1.35rem; letter-spacing: -0.03em; line-height: 1.1; }
      .brand-sub { display: block; font-size: 0.78rem; color: var(--muted); margin-top: 2px; }

      .group { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

      button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
        outline: 3px solid rgba(79, 124, 255, 0.45);
        outline-offset: 2px;
      }
      input:focus, select:focus, textarea:focus { border-color: var(--primary); }

      .target-hint { font-size: 0.85rem; color: var(--muted); margin-bottom: 10px; }
      .target-hint strong { color: var(--text); }

      .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0 14px; }
      .stat { background: white; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
      .stat-value { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; }
      .stat-label { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
      .stat.warn .stat-value { color: var(--warn); }
      .stat.bad .stat-value { color: var(--bad); }
      .howto { margin: 8px 0 0; padding-left: 18px; font-size: 0.88rem; }
      .howto li { margin-bottom: 6px; }

      .search {
        flex: 1;
        min-width: 220px;
        max-width: 420px;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 0.95rem;
        background: white;
      }

      .actions { display: flex; gap: 10px; flex-wrap: wrap; }

      button {
        border: none;
        border-radius: 10px;
        font-size: 0.95rem;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }

      button:hover { transform: translateY(-1px); }

      .primary-btn { background: var(--primary); color: white; padding: 10px 16px; font-weight: 700; }
      .secondary-btn { background: #edf2ff; color: var(--text); padding: 10px 16px; font-weight: 600; }
      .danger-btn { background: var(--bad-bg); color: var(--bad); padding: 10px 16px; font-weight: 600; }
      .small-btn { padding: 6px 10px; font-size: 0.82rem; }

      .content { display: grid; grid-template-columns: 240px 1fr 380px; min-height: 700px; }

      .sidebar { background: #f9fbff; border-right: 1px solid var(--line); padding: 18px 16px; }

      .sidebar h3 {
        margin: 18px 0 10px;
        font-size: 0.82rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      .sidebar h3:first-child { margin-top: 0; }

      .nav-list { display: flex; flex-direction: column; gap: 4px; }

      .nav-item {
        padding: 8px 12px;
        border-radius: 10px;
        background: transparent;
        text-align: left;
        font-weight: 600;
        color: var(--text);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .nav-item.sub { font-weight: 400; padding-left: 26px; font-size: 0.9rem; }
      .nav-item.active { background: var(--panel-alt); color: var(--primary-dark); }

      .count {
        background: var(--bad-bg);
        color: var(--bad);
        border-radius: 999px;
        padding: 1px 8px;
        font-size: 0.78rem;
      }

      .main { padding: 20px; min-width: 0; }

      .main-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }

      .breadcrumbs { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; color: var(--muted); font-size: 0.9rem; }
      .crumb { background: transparent; border: none; color: var(--muted); padding: 0; font-size: 0.9rem; cursor: pointer; }
      .crumb.current { color: var(--text); font-weight: 700; cursor: default; }

      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }

      .item-card {
        position: relative;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px 12px 12px;
        text-align: center;
        cursor: pointer;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      .item-card:hover { border-color: #bfd0ff; box-shadow: 0 8px 18px rgba(79, 124, 255, 0.08); }
      .item-card.selected { border-color: var(--primary); }
      .item-card.drop-target { border-color: var(--primary); background: var(--panel-alt); }

      .item-icon { width: 52px; height: 52px; margin: 0 auto 10px; border-radius: 14px; display: grid; place-items: center; font-size: 1.4rem; }
      .folder .item-icon { background: rgba(255, 217, 138, 0.35); }
      .file .item-icon { background: rgba(223, 232, 255, 0.9); }
      .item-name { font-size: 0.92rem; font-weight: 600; word-break: break-word; }
      .item-sub { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }

      .dot { position: absolute; top: 10px; right: 10px; width: 10px; height: 10px; border-radius: 50%; }
      .dot.good { background: var(--good); }
      .dot.warn { background: var(--warn); }
      .dot.bad { background: var(--bad); }

      .badge { display: inline-block; border-radius: 999px; padding: 3px 10px; font-size: 0.78rem; font-weight: 700; }
      .badge.good { background: var(--good-bg); color: var(--good); }
      .badge.warn { background: var(--warn-bg); color: var(--warn); }
      .badge.bad { background: var(--bad-bg); color: var(--bad); }

      .empty-state { border: 1px dashed var(--line); border-radius: 16px; padding: 40px 20px; text-align: center; color: var(--muted); grid-column: 1 / -1; }

      .dropzone-hint { margin-top: 16px; font-size: 0.82rem; color: var(--muted); text-align: center; }
      .main.dragging { outline: 2px dashed var(--primary); outline-offset: -8px; border-radius: 12px; }

      .result-list { display: flex; flex-direction: column; gap: 10px; }
      .result {
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 14px;
        cursor: pointer;
        background: white;
      }
      .result:hover { border-color: #bfd0ff; }
      .result-top { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
      .result-name { font-weight: 700; }
      .result-path { font-size: 0.8rem; color: var(--muted); margin: 3px 0 6px; }
      .result-snippet { font-size: 0.88rem; line-height: 1.45; color: #3a4252; }
      .result-snippet mark { background: #fff1a8; padding: 0 1px; }
      .result-issues { margin: 6px 0 0; padding-left: 18px; font-size: 0.82rem; color: var(--muted); }

      .editor { border-left: 1px solid var(--line); background: #fbfcff; padding: 20px; min-width: 0; }
      .editor-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
      .editor-header h3 { margin: 0; font-size: 1.1rem; word-break: break-word; }
      .editor-path { font-size: 0.8rem; color: var(--muted); margin-bottom: 12px; }

      .editor-placeholder {
        border: 1px dashed var(--line);
        background: white;
        border-radius: 14px;
        padding: 26px 18px;
        color: var(--muted);
        line-height: 1.5;
      }

      .trust-box { border: 1px solid var(--line); background: white; border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; }
      .trust-box ul { margin: 8px 0 0; padding-left: 18px; font-size: 0.85rem; line-height: 1.45; }
      .trust-box li { margin-bottom: 4px; }
      .conflict-quote { display: block; font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
      .link-btn { background: none; padding: 0; color: var(--primary-dark); font-size: inherit; text-decoration: underline; }

      .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
      .meta-grid label { font-size: 0.75rem; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
      .meta-grid input, .meta-grid select {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px 9px;
        font-size: 0.88rem;
        background: white;
        color: var(--text);
      }
      .meta-line { grid-column: 1 / -1; font-size: 0.78rem; color: var(--muted); }

      textarea {
        width: 100%;
        min-height: 340px;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px 16px;
        font: 14px/1.5 "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        background: white;
        color: var(--text);
      }

      .save-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
      .save-row .group { display: flex; gap: 8px; flex-wrap: wrap; }
      .status-msg { font-size: 0.82rem; color: var(--muted); }

      .modal {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(18, 26, 37, 0.42);
        z-index: 20;
      }
      .modal-card {
        width: min(420px, calc(100vw - 32px));
        background: white;
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 22px;
        box-shadow: var(--shadow);
      }
      .modal-card h3 { margin: 0 0 12px; }
      .modal-card p { margin: 0 0 16px; color: var(--muted); line-height: 1.45; }
      .modal-card input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 14px;
        font-size: 1rem;
        margin-bottom: 8px;
      }
      .modal-error { color: var(--bad); font-size: 0.85rem; min-height: 1.2em; margin-bottom: 8px; }
      .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }

      .view-toggle { display: inline-flex; background: #edf2ff; border-radius: 10px; padding: 3px; }
      .view-toggle button { background: transparent; padding: 6px 12px; font-size: 0.85rem; font-weight: 600; color: var(--muted); }
      .view-toggle button.on { background: white; color: var(--primary-dark); box-shadow: 0 1px 3px rgba(30, 36, 48, 0.1); }
      .view-toggle button:hover { transform: none; }
      .header-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

      .content.graph-wide { grid-template-columns: 240px 1fr; }
      .content.graph-wide .editor { display: none; }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
      .chip { font-size: 0.78rem; padding: 4px 10px; border-radius: 999px; background: #edf2ff; color: var(--text); }
      .chip strong { font-weight: 800; }
      .chip.warn { background: var(--warn-bg); color: var(--warn); }
      .chip.bad { background: var(--bad-bg); color: var(--bad); }
      .graph-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
      .zoom { gap: 4px; }
      .zoom .small-btn { min-width: 32px; }
      .zoom-label { font-size: 0.8rem; color: var(--muted); min-width: 44px; text-align: center; font-variant-numeric: tabular-nums; }

      .graph-wrap {
        position: relative;
        overflow: auto;
        min-height: 460px;
        max-height: 68vh;
        border: 1px solid var(--line);
        border-radius: 14px;
        background-color: #fcfdff;
        background-image: radial-gradient(#dfe6f4 1px, transparent 1px);
        background-size: 18px 18px;
      }
      .graph-wrap.animating { overflow: hidden; }
      .graph-sizer { position: relative; margin: 0 auto; }
      .graph-canvas { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
      .graph-lines { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; }
      .graph-lines path { fill: none; stroke: #b3c2e4; stroke-width: 2; stroke-linecap: round; }

      .gnode {
        position: absolute;
        top: 0;
        left: 0;
        width: 184px;
        height: 58px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 14px;
        background: white;
        border: 1px solid var(--line);
        box-shadow: 0 4px 12px rgba(30, 36, 48, 0.06);
        text-align: left;
        color: var(--text);
        will-change: transform, opacity;
        transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
      }
      .gnode:hover { border-color: #bfd0ff; box-shadow: 0 8px 18px rgba(79, 124, 255, 0.12); }
      .gnode.folder { background: #fffaf0; border-color: #f1ddb0; }
      .gnode.folder:hover { border-color: #e6c67c; }
      .gnode.folder.open { background: #fff4dc; }
      .gnode.selected { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 124, 255, 0.2); }
      .gnode.ghost {
        background: transparent;
        border: 1px dashed #c9d4ea;
        box-shadow: none;
        justify-content: center;
        color: var(--muted);
        font-style: italic;
        cursor: default;
      }
      .gnode.ghost .gnode-name { font-weight: 400; font-size: 0.8rem; }
      .gnode-icon { font-size: 1.25rem; flex: none; }
      .gnode-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
      .gnode-name { font-weight: 700; font-size: 0.86rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .gnode-meta { font-size: 0.72rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .gnode-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
      .gnode-dot.good { background: var(--good); }
      .gnode-dot.warn { background: var(--warn); }
      .gnode-dot.bad { background: var(--bad); }
      .gnode-toggle {
        position: absolute;
        left: 50%;
        bottom: -10px;
        width: 20px;
        height: 20px;
        margin-left: -10px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--primary);
        color: white;
        font-size: 0.85rem;
        font-weight: 800;
        line-height: 1;
        box-shadow: 0 2px 6px rgba(79, 124, 255, 0.35);
      }
      .gnode.open .gnode-toggle { background: #8a97b3; box-shadow: none; }
      .gnode.file { width: 196px; height: 44px; padding: 5px 10px; border-radius: 12px; }
      .gnode.file .gnode-icon { font-size: 1.05rem; }
      .gnode.file .gnode-name { font-size: 0.78rem; line-height: 1.2; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; }
      .gnode.file .gnode-meta { font-size: 0.68rem; }
      .gnode.summary { background: #eefaf3; border-color: #bfe5cd; }
      .gnode.summary:hover { border-color: #8fd0a8; box-shadow: 0 8px 18px rgba(31, 157, 85, 0.14); }
      .gnode.summary.open { background: #e2f6ea; }
      .gnode.summary.selected { border-color: var(--good); box-shadow: 0 0 0 3px rgba(31, 157, 85, 0.2); }
      .gnode.summary .gnode-toggle { background: var(--good); box-shadow: 0 2px 6px rgba(31, 157, 85, 0.35); cursor: pointer; width: 22px; height: 22px; margin-left: -11px; bottom: -11px; }
      .gnode.summary .gnode-toggle:hover { filter: brightness(1.1); }
      .gnode.summary.open .gnode-toggle { background: #8a97b3; box-shadow: none; }

      .cite {
        background: var(--panel-alt);
        color: var(--primary-dark);
        border: 1px solid #cfdcff;
        border-radius: 6px;
        padding: 0 4px;
        margin: 0 1px;
        font: inherit;
        font-size: 0.82em;
        font-weight: 700;
        vertical-align: 1px;
      }
      .cite:hover { background: var(--primary); color: white; transform: none; }
      .source-banner {
        display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
        background: #eefaf3; border: 1px solid #bfe5cd; border-radius: 12px;
        padding: 10px 14px; margin-bottom: 14px; font-size: 0.9rem;
      }
      .item-card.summary { background: #f5fcf8; border-color: #cdebd8; }
      .item-card.summary .item-icon { background: rgba(31, 157, 85, 0.12); }
      li.conflict { margin-bottom: 8px; }
      .nav-item.quiet { font-weight: 400; color: var(--muted); font-size: 0.85rem; }

      .viewer-card { width: min(720px, calc(100vw - 32px)); max-height: calc(100vh - 48px); display: flex; flex-direction: column; }
      .viewer-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
      .viewer-head h3 { margin: 0; word-break: break-word; }
      .viewer-path { font-size: 0.82rem; color: var(--muted); margin: 4px 0 12px; }
      .viewer-body {
        flex: 1;
        overflow: auto;
        margin: 0 0 14px;
        padding: 24px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #eef1f6;
        word-break: break-word;
      }
      .viewer-card { width: min(940px, calc(100vw - 32px)); }
      .doc-paper {
        width: min(100%, 760px);
        min-height: 760px;
        margin: 0 auto;
        padding: 54px 62px 64px;
        background: white;
        border: 1px solid #e2e6ee;
        box-shadow: 0 10px 30px rgba(30, 36, 48, 0.10);
        color: #20242c;
        font-family: Calibri, Aptos, "Segoe UI", Arial, sans-serif;
        line-height: 1.55;
      }
      .doc-title {
        margin: 0 0 8px;
        font-size: 1.65rem;
        line-height: 1.15;
        letter-spacing: -0.02em;
        color: #1b315b;
      }
      .doc-subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 24px; }
      .doc-meta {
        display: grid;
        grid-template-columns: 150px 1fr;
        gap: 5px 14px;
        padding: 14px 16px;
        margin: 18px 0 26px;
        background: #f7f9fc;
        border: 1px solid #e5eaf2;
        border-radius: 8px;
        font-size: 0.88rem;
      }
      .doc-meta-key { color: var(--muted); font-weight: 600; }
      .doc-meta-value { color: var(--text); }
      .doc-section { margin: 24px 0 8px; font-size: 1.08rem; color: #1b315b; }
      .doc-paragraph { margin: 8px 0 12px; font-size: 0.95rem; }
      .doc-bullet { margin: 5px 0 5px 20px; font-size: 0.95rem; }
      .doc-callout {
        margin: 18px 0;
        padding: 12px 14px;
        border-left: 4px solid var(--warn);
        background: var(--warn-bg);
        border-radius: 6px;
        font-size: 0.92rem;
      }
      .doc-sources-title { margin-top: 24px; padding-top: 16px; border-top: 1px solid #e5eaf2; font-weight: 700; color: #1b315b; }
      @media (max-width: 700px) { .doc-paper { padding: 32px 24px 42px; min-height: 0; } .viewer-body { padding: 10px; } }
      .viewer-card .trust-box { max-height: 30vh; overflow: auto; }

      .score {
        display: inline-flex;
        align-items: baseline;
        gap: 6px;
        flex: none;
        background: var(--panel-alt);
        color: var(--primary-dark);
        border: 1px solid #cfdcff;
        border-radius: 12px;
        padding: 5px 11px;
        white-space: nowrap;
      }
      .score-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; }
      .score-value { font-size: 1.15rem; font-weight: 800; }
      .editor-header, .viewer-head { align-items: flex-start; }


      .policy-view-toggle {
        display: flex;
        justify-content: center;
        gap: 4px;
        margin: 0 0 12px;
        padding: 4px;
        width: fit-content;
        align-self: center;
        background: #edf2ff;
        border-radius: 11px;
      }
      .policy-view-toggle button {
        padding: 7px 14px;
        background: transparent;
        color: var(--muted);
        font-weight: 700;
        font-size: 0.84rem;
      }
      .policy-view-toggle button.on {
        background: white;
        color: var(--primary-dark);
        box-shadow: 0 1px 4px rgba(30,36,48,.12);
      }
      .resolved-note {
        display: flex; align-items: center; gap: 8px;
        background: #eefaf3; border: 1px solid #bfe5cd; color: #246b3d;
        border-radius: 10px; padding: 9px 12px; margin: 0 0 18px;
        font-size: .84rem; font-weight: 650;
      }
      .trust-pill {
        display: inline-flex; align-items: center; gap: 4px;
        margin-left: 5px; padding: 2px 7px; border-radius: 999px;
        background: #e6f6ec; color: #187744; border: 1px solid #bfe5cd;
        font-size: .72rem; font-weight: 800; white-space: nowrap; vertical-align: .12em;
      }
      .trust-pill.mid { background: #fff4dc; color: #9a6517; border-color: #f1d49b; }
      .policy-summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
      .policy-summary-card { border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; background: #fbfcff; }
      .policy-summary-label { font-size: .76rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
      .policy-summary-value { font-size: 1.02rem; font-weight: 800; margin-top: 5px; line-height: 1.35; }
      .policy-summary-detail { font-size: .8rem; color: var(--muted); margin-top: 4px; line-height: 1.4; }
      .trusted-inline { font-weight: 800; color: #172033; background: #f0f5ff; padding: 0 3px; border-radius: 4px; }
      @media (max-width: 700px) { .policy-summary-grid { grid-template-columns: 1fr; } }

      .hidden { display: none !important; }

      @media (max-width: 1000px) {
        body { padding: 0; }
        .app { border-radius: 0; }
        .content { grid-template-columns: 1fr; }
        .sidebar, .editor { border: none; border-top: 1px solid var(--line); }
        .sidebar { order: -1; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <div class="brand">
          <span class="logo" aria-hidden="true">K</span>
          <span>
            <span class="brand-name">knowledge management</span>
            <span class="brand-sub">find it · understand it · trust it</span>
          </span>
        </div>
        <input class="search" id="searchInput" type="search" placeholder="Search all notes…  ( / )" aria-label="Search all notes" />
        <div class="actions">
          <button class="secondary-btn" id="importFilesBtn" title="Add .txt files from your computer to the selected folder">Import files</button>
          <button class="secondary-btn" id="importFolderBtn" title="Import a whole folder, keeping its sub-folders">Import folder</button>
          <button class="secondary-btn" id="downloadAllBtn">Download all</button>
          <button class="secondary-btn" id="newFolderBtn">+ Folder</button>
          <button class="primary-btn" id="newFileBtn">+ File</button>
        </div>
        <input type="file" id="fileInput" accept=".txt,text/plain" multiple class="hidden" />
        <input type="file" id="folderInput" webkitdirectory directory multiple class="hidden" />
      </div>

      <div class="content" id="content">
        <aside class="sidebar">
          <h3>Workspace</h3>
          <div class="nav-list" id="navList"></div>
          <h3>Review</h3>
          <div class="nav-list">
            <button class="nav-item" id="attentionNav">Needs attention <span class="count hidden" id="attentionCount"></span></button>
          </div>
          <h3>Demo</h3>
          <div class="nav-list">
            <button class="nav-item quiet" id="resetNav" title="Replace everything with the built-in example documents">Reset demo data</button>
          </div>
        </aside>

        <main class="main" id="main">
          <div class="main-header">
            <div class="breadcrumbs" id="breadcrumbs"></div>
            <div class="header-right">
              <div class="group" id="folderActions"></div>
              <div class="view-toggle" id="viewToggle" role="group" aria-label="Layout">
                <button type="button" data-layout="grid">▦ Folders</button>
                <button type="button" data-layout="graph">◉ Graph</button>
              </div>
            </div>
          </div>
          <div id="mainBody"></div>
          <div class="dropzone-hint" id="dropHint">Tip: drag .txt files here to add them to this folder.</div>
        </main>

        <aside class="editor" id="editor"></aside>
      </div>
    </div>

    <div id="modal" class="modal hidden" aria-modal="true" role="dialog">
      <div class="modal-card">
        <h3 id="modalTitle"></h3>
        <p id="modalText" class="hidden"></p>
        <input id="modalInput" type="text" maxlength="120" />
        <div class="modal-error" id="modalError"></div>
        <div class="modal-actions">
          <button class="secondary-btn" id="modalCancel" type="button">Cancel</button>
          <button class="primary-btn" id="modalConfirm" type="button">OK</button>
        </div>
      </div>
    </div>

    <div id="viewer" class="modal hidden" aria-modal="true" role="dialog" aria-labelledby="viewerTitle">
      <div class="modal-card viewer-card">
        <div class="viewer-head">
          <h3 id="viewerTitle"></h3>
          <span id="viewerScore"></span>
        </div>
        <div class="viewer-path" id="viewerPath"></div>
        <div id="viewerTrust"></div>
        <div class="policy-view-toggle hidden" id="policyViewToggle" role="group" aria-label="Policy view">
          <button type="button" data-policy-view="full" class="on">Original structured</button>
          <button type="button" data-policy-view="summary">Summary</button>
        </div>
        <div class="viewer-body" id="viewerBody"></div>
        <div class="modal-actions">
          <button class="secondary-btn" id="viewerClose" type="button">Close</button>
          <button class="secondary-btn hidden" id="viewerSources" type="button">Open as folder</button>
          <button class="primary-btn" id="viewerEdit" type="button">Edit</button>
        </div>
      </div>
    </div>

    <!-- Built-in example documents (the same files as the company folders on disk). -->
    <script type="application/json" id="seed-data">[{"path": ["Company A", "America", "Payroll"], "name": "US Payroll Policy.txt", "content": "COMPANY A - US PAYROLL POLICY\nDocument owner: Payroll Operations (US)\nStatus: Approved\nLast updated: 2026-01-12\nLast reviewed: 2026-05-04\nApplies to: all Company A employees in the United States\n\n1. Pay frequency\nEmployees are paid biweekly, every other Friday, by direct deposit.\n\n2. Minimum pay\nThe minimum wage at Company A is $48,000 per year for full-time employees in the United States.\nHourly employees are paid at least the applicable federal, state or local minimum wage, whichever is highest.\n\n3. Payroll corrections\nReport missing or incorrect pay to the payroll team within 5 business days of payday.\nCorrections are paid in the next regular payroll.\n\n4. Tax forms\nW-2 forms are available in the employee portal by January 31 each year.\n"}, {"path": ["Company A", "America", "Payroll"], "name": "Email - 2026 payroll calendar.txt", "content": "From: Maria Lopez, Payroll Operations (US)\nTo: All US employees\nDate: 2025-12-15\nSubject: 2026 payroll calendar\n\nHi all,\n\nThe 2026 payroll calendar is now in the employee portal. There are 26 paydays in 2026.\nWhen a payday falls on a bank holiday, you will be paid on the business day before.\n\nTimesheets for hourly staff are due by noon on the Monday before each payday.\n\nBest,\nMaria\n"}, {"path": ["Company A", "America", "Payroll"], "name": "payrollemail.txt", "content": "Subject: Updated Minimum Wage at Company A\n\nDear Team,\n\nWe are pleased to share that the minimum wage at Company A has been raised to $75,000 per year in the United States.\n\nThis increase reflects our commitment to recognizing the value of our employees and supporting fair compensation across our organization. We believe this adjustment will help ensure our team members are compensated competitively and can continue to thrive in their roles.\n\nThank you for your dedication and hard work. We appreciate everything you do to contribute to the success of Company A.\n\nSincerely,\n[Your Name]\n[Your Title]\nCompany A\n"}, {"path": ["Company A", "America", "Payroll"], "name": "SUMMARY.txt", "content": "PAYROLL - COMPANY A - AMERICA\nSummary of 3 source documents - click a [number] to open that source.\n\nDocument owner: Knowledge team\nStatus: Verified\nLast updated: 2026-09-30\nLast reviewed: 2026-09-30\n\n- Pay schedule: biweekly, every other Friday, by direct deposit; 26 paydays in 2026. [1][2]\n- Payday on a bank holiday: you are paid the business day before. [2]\n- Hourly staff: timesheets are due by noon on the Monday before each payday. [2]\n- Pay errors: report them within 5 business days of payday; they are fixed in the next payroll. [1]\n- W-2 forms: in the employee portal by January 31. [1]\n\n⚠ CONFLICT - minimum wage\n  The approved payroll policy (reviewed May 2026) sets the minimum wage at $48,000 a year for full-time staff. [1]\n  An undated email with no named sender says the minimum wage was raised to $75,000 a year. [3]\n  Until Payroll Operations (US) confirms the raise, rely on the policy.\n\nSources\n[1] US Payroll Policy.txt\n[2] Email - 2026 payroll calendar.txt\n[3] payrollemail.txt\n"}, {"path": ["Company A", "America", "Vacation days"], "name": "US Paid Time Off Policy.txt", "content": "COMPANY A - PAID TIME OFF (US)\nDocument owner: People Team (US)\nStatus: Approved\nLast updated: 2025-11-03\nLast reviewed: 2026-02-20\n\nFull-time employees receive 15 days of paid time off (PTO) per year, accrued each pay period.\nAfter five years of service this increases to 20 days per year.\n\nCarry-over: up to 5 unused days can be carried over to the next year and must be used by March 31.\n\nHolidays: Company A also observes 10 paid holidays; see the holiday calendar in the portal.\n\nNote: US federal law does not require paid vacation. This policy is a Company A benefit.\n"}, {"path": ["Company A", "America", "Vacation days"], "name": "Email - PTO carry-over reminder.txt", "content": "From: People Team (US)\nTo: All US employees\nDate: 2026-09-15\nSubject: Reminder: plan your remaining PTO\n\nHi everyone,\n\nA friendly reminder that only 5 unused days can be carried over into 2027.\nAnything above that is lost on December 31, so talk to your manager now if you still have days to plan.\n\nThanks,\nPeople Team\n"}, {"path": ["Company A", "America", "Vacation days"], "name": "Email - PTO changes for 2023.txt", "content": "From: HR Department\nTo: All US employees\nDate: 2022-11-03\nSubject: PTO changes for 2023\n\nDear colleagues,\n\nStarting next year, full-time employees receive 12 days of paid time off per year.\nCarry-over of unused days will no longer be allowed.\n\nRegards,\nHR Department\n"}, {"path": ["Company A", "America", "Vacation days"], "name": "SUMMARY.txt", "content": "VACATION DAYS - COMPANY A - AMERICA\nSummary of 3 source documents - click a [number] to open that source.\n\nDocument owner: Knowledge team\nStatus: Verified\nLast updated: 2026-09-30\nLast reviewed: 2026-09-30\n\n- Paid time off: 15 days a year for full-time employees, accrued each pay period; 20 days after five years of service. [1]\n- Paid holidays: 10 a year, on top of PTO. [1]\n- Carry-over: at most 5 unused days move to the next year and must be used by March 31;\n  anything above that is lost on December 31. [1][2]\n- US law does not require paid vacation; this is a company benefit. [1]\n\n⚠ OUTDATED SOURCE\n  A 2022 email says 12 days of PTO and no carry-over. [3]\n  The current policy (reviewed February 2026) replaces it.\n\nSources\n[1] US Paid Time Off Policy.txt\n[2] Email - PTO carry-over reminder.txt\n[3] Email - PTO changes for 2023.txt\n"}, {"path": ["Company A", "America", "Working hours"], "name": "Working Hours and Overtime Policy (US).txt", "content": "COMPANY A - WORKING HOURS AND OVERTIME (US)\nDocument owner: People Team (US)\nStatus: Approved\nLast updated: 2024-10-01\nLast reviewed: 2025-03-11\n\nStandard schedule: 40 hours per week, Monday to Friday.\nCore hours are 10:00 to 15:00; outside core hours you can plan your day with your manager.\n\nOvertime: non-exempt employees are paid 1.5 times their regular rate for hours worked over 40 in a workweek,\nas required by the Fair Labor Standards Act. Overtime must be approved in advance by your manager.\n"}, {"path": ["Company A", "America", "Working hours"], "name": "Email - Summer Fridays 2026.txt", "content": "From: Office of the COO\nTo: All US employees\nDate: 2026-05-20\nSubject: Summer Fridays are back\n\nHi all,\n\nFrom Memorial Day to Labor Day, our US offices close at 1 pm on Fridays.\nYour weekly hours stay the same, so plan the missing Friday afternoon earlier in the week.\nHourly employees: record your actual hours as usual.\n\nEnjoy the summer!\n"}, {"path": ["Company A", "America", "Working hours"], "name": "SUMMARY.txt", "content": "WORKING HOURS - COMPANY A - AMERICA\nSummary of 2 source documents - click a [number] to open that source.\n\nDocument owner: Knowledge team\nStatus: Verified\nLast updated: 2026-09-30\nLast reviewed: 2026-09-30\n\n- Standard week: 40 hours, Monday to Friday; core hours 10:00 to 15:00. [1]\n- Overtime: non-exempt employees get 1.5 times their regular rate for hours over 40 in a week\n  (Fair Labor Standards Act); overtime needs your manager's approval in advance. [1]\n- Summer Fridays: from Memorial Day to Labor Day, offices close at 1 pm on Fridays; weekly hours stay the same. [2]\n\n⚠ REVIEW DUE\n  The working hours policy was last reviewed in March 2025, more than 18 months ago. [1]\n  Ask the People Team (US) to confirm it is still current.\n\nSources\n[1] Working Hours and Overtime Policy (US).txt\n[2] Email - Summer Fridays 2026.txt\n"}, {"path": ["Company A", "Belgium", "Payroll"], "name": "Payroll policy Belgium.txt", "content": "COMPANY A BELGIUM - PAYROLL POLICY (LOONBELEID)\nDocument owner: Payroll Belgium (Ann Peeters)\nStatus: Approved\nLast updated: 2026-01-05\nLast reviewed: 2026-04-02\n\n- Salaries are paid monthly, on the last working day of the month.\n- Double holiday pay (dubbel vakantiegeld) of 92% of the gross monthly salary is paid with the May salary.\n- An end-of-year bonus equal to one monthly salary is paid in December.\n- Salaries are indexed every January in line with the index for our joint committee.\n- Meal vouchers are worth €8 per working day; the employee share is €1.09.\n"}, {"path": ["Company A", "Belgium", "Payroll"], "name": "Email - Salary indexation January 2026.txt", "content": "From: Ann Peeters, Payroll Belgium\nTo: All employees Belgium\nDate: 2026-01-08\nSubject: Salary indexation January 2026 / Loonindexering januari 2026\n\nDear colleagues,\n\nAs every year, salaries in Belgium were indexed in January.\nFor our joint committee the indexation is 2.2%, which you will see on your January payslip.\n\nQuestions? Just reply to this email.\nAnn\n"}, {"path": ["Company A", "Belgium", "Payroll"], "name": "Email - Double holiday pay 2026.txt", "content": "From: Ann Peeters, Payroll Belgium\nTo: All employees Belgium\nDate: 2026-05-12\nSubject: Double holiday pay with your May salary\n\nDear colleagues,\n\nYour double holiday pay will be paid together with your May salary at the end of this month.\nIt is calculated on your gross monthly salary and is taxed at a special rate, so the net amount is lower than you might expect.\n\nKind regards,\nAnn\n"}, {"path": ["Company A", "Belgium", "Payroll"], "name": "SUMMARY.txt", "content": "PAYROLL - COMPANY A - BELGIUM\nSummary of 3 source documents - click a [number] to open that source.\n\nDocument owner: Knowledge team\nStatus: Verified\nLast updated: 2026-09-30\nLast reviewed: 2026-09-30\n\n- Salary: paid monthly, on the last working day of the month. [1]\n- Double holiday pay: 92% of your gross monthly salary, paid with the May salary;\n  it is taxed at a special rate, so the net amount is lower. [1][3]\n- End-of-year bonus: one monthly salary, paid in December. [1]\n- Indexation: every January, following the joint committee index; +2.2% in January 2026. [1][2]\n- Meal vouchers: €8 per working day, of which you pay €1.09. [1]\n\nNo conflicts found between these sources.\n\nSources\n[1] Payroll policy Belgium.txt\n[2] Email - Salary indexation January 2026.txt\n[3] Email - Double holiday pay 2026.txt\n"}, {"path": ["Company A", "Belgium", "Vacation days"], "name": "Vacation policy Belgium.txt", "content": "COMPANY A BELGIUM - VACATION POLICY\nDocument owner: HR Belgium (Pieter Janssens)\nStatus: Approved\nLast updated: 2025-12-18\nLast reviewed: 2026-01-15\n\nLegal vacation: employees with a full-time five-day week are entitled to 20 legal vacation days,\nbased on the days worked in the previous calendar year.\n\nCompany days: Company A Belgium adds 6 extra vacation days, for a total of 26 vacation days per year.\n\nRequests: submit vacation requests in the HR portal at least two weeks in advance for absences of a week or more.\n"}, {"path": ["Company A", "Belgium", "Vacation days"], "name": "Vacation policy Belgium (2023).txt", "content": "COMPANY A BELGIUM - VACATION POLICY\nDocument owner: HR Belgium\nStatus: Superseded\nLast updated: 2023-01-10\nLast reviewed: 2023-02-01\n\nEmployees are entitled to 20 legal vacation days.\nCompany days: Company A Belgium adds 4 extra vacation days, for a total of 24 vacation days per year.\n"}, {"path": ["Company A", "Belgium", "Vacation days"], "name": "Email - Bridge day 2026.txt", "content": "From: Pieter Janssens, HR Belgium\nTo: All employees Belgium\nDate: 2026-01-20\nSubject: Collective bridge day on Friday 15 May\n\nDear all,\n\nFriday 15 May 2026, the day after Ascension, is a collective bridge day: the office is closed.\nOne vacation day will be deducted automatically, so you do not need to request it.\n\nPieter\n"}, {"path": ["Company A", "Belgium", "Vacation days"], "name": "SUMMARY.txt", "content": "VACATION DAYS - COMPANY A - BELGIUM\nSummary of 3 source documents - click a [number] to open that source.\n\nDocument owner: Knowledge team\nStatus: Verified\nLast updated: 2026-09-30\nLast reviewed: 2026-09-30\n\n- Total: 26 vacation days a year = 20 legal days + 6 extra company days (full-time, five-day week). [1]\n- Legal days depend on the days you worked in the previous calendar year. [1]\n- Requests: in the HR portal, at least two weeks ahead for absences of a week or more. [1]\n- Friday 15 May 2026 is a collective bridge day; one vacation day is deducted automatically. [3]\n\n⚠ OUTDATED SOURCE\n  The 2023 policy (4 extra days, 24 in total) is marked superseded. [2]\n  Use the current policy: 6 extra days, 26 in total. [1]\n\nSources\n[1] Vacation policy Belgium.txt\n[2] Vacation policy Belgium (2023).txt\n[3] Email - Bridge day 2026.txt\n"}, {"path": ["Company A", "Belgium", "Working hours"], "name": "Work rules - working hours Belgium.txt", "content": "COMPANY A BELGIUM - WORK RULES (ARBEIDSREGLEMENT): WORKING HOURS\nDocument owner: HR Belgium (Pieter Janssens)\nStatus: Approved\nLast updated: 2025-09-01\nLast reviewed: 2025-11-20\n\nFull-time employees work 38 hours per week, 7 hours 36 minutes per day, Monday to Friday.\nFlexible start between 07:30 and 09:30; core hours are 09:30 to 15:30.\nOvertime is only worked at the request of your manager and is compensated with recovery time.\n"}, {"path": ["Company A", "Belgium", "Working hours"], "name": "Email - Home working update.txt", "content": "From: Management Team Belgium\nTo: All employees Belgium\nDate: 2026-03-02\nSubject: Home working: two days per week from April\n\nDear all,\n\nFrom April onwards you can work from home on two days per week (it used to be three).\nTuesdays and Thursdays are office days for everyone.\nThe home working allowance is €150 per month.\n\nThe Management Team\n"}, {"path": ["Company A", "Belgium", "Working hours"], "name": "Home working policy (2021).txt", "content": "COMPANY A BELGIUM - HOME WORKING POLICY\nDocument owner: HR Belgium\nStatus: Superseded\nLast updated: 2021-06-01\nLast reviewed: 2021-06-01\n\nEmployees may work from home up to three days per week, in agreement with their manager.\nThe home working allowance is €129.48 per month.\n"}, {"path": ["Company A", "Belgium", "Working hours"], "name": "SUMMARY.txt", "content": "WORKING HOURS - COMPANY A - BELGIUM\nSummary of 3 source documents - click a [number] to open that source.\n\nDocument owner: Knowledge team\nStatus: Verified\nLast updated: 2026-09-30\nLast reviewed: 2026-09-30\n\n- Full-time week: 38 hours, 7 h 36 min a day, Monday to Friday. [1]\n- Flexible start between 07:30 and 09:30; core hours 09:30 to 15:30. [1]\n- Overtime only at your manager's request, compensated with recovery time. [1]\n- Home working: two days a week since April 2026; Tuesdays and Thursdays are office days for everyone. [2]\n- Home working allowance: €150 a month. [2]\n\n⚠ OUTDATED SOURCE\n  The 2021 home working policy (up to three days, €129.48 a month) was replaced by the March 2026 update. [3][2]\n\nSources\n[1] Work rules - working hours Belgium.txt\n[2] Email - Home working update.txt\n[3] Home working policy (2021).txt\n"}, {"path": ["Company A", "France", "Payroll"], "name": "Politique de paie France.txt", "content": "COMPANY A FRANCE - POLITIQUE DE PAIE / PAYROLL POLICY\nDocument owner: Paie France (Claire Martin)\nStatus: Approved\nLast updated: 2024-11-15\nLast reviewed: 2026-06-10\n\nSalaries are paid monthly on the 28th, or on the previous working day.\nA 13th-month bonus is paid with the December salary.\nPayslips (bulletins de paie) are issued electronically and kept in your digital safe for 50 years.\n"}, {"path": ["Company A", "France", "Payroll"], "name": "Email - New payday from January.txt", "content": "From: Claire Martin, Paie France\nTo: Tous les salariés / All employees France\nDate: 2025-12-01\nSubject: Nouvelle date de paie / New payday from January\n\nBonjour à tous,\n\nFrom January 2026, salaries are paid monthly on the 25th.\nThis gives everyone a few extra days before the end of the month.\n\nClaire\n"}, {"path": ["Company A", "France", "Payroll"], "name": "Email - Payslips going digital.txt", "content": "From: Claire Martin, Paie France\nTo: Tous les salariés / All employees France\nDate: 2025-10-01\nSubject: Your payslips are going digital\n\nBonjour à tous,\n\nFrom November, payslips will only be available in your digital safe.\nIf you prefer to keep receiving a paper payslip, let us know before the end of October.\n\nClaire\n"}, {"path": ["Company A", "France", "Payroll"], "name": "SUMMARY.txt", "content": "PAYROLL - COMPANY A - FRANCE\nSummary of 3 source documents - click a [number] to open that source.\n\nDocument owner: Knowledge team\nStatus: Verified\nLast updated: 2026-09-30\nLast reviewed: 2026-09-30\n\n- 13th-month bonus: paid with the December salary. [1]\n- Payslips: digital only since November 2025 (paper only if you asked before the end of October 2025),\n  kept in your digital safe for 50 years. [1][3]\n\n⚠ CONFLICT - payday\n  The payroll policy says salaries are paid on the 28th. [1]\n  An email from Paie France (December 2025) says payday is the 25th from January 2026. [2]\n  The policy text dates from November 2024 and was re-approved in June 2026 without being corrected,\n  so the 25th is probably right. Confirm with Claire Martin (Paie France).\n\nSources\n[1] Politique de paie France.txt\n[2] Email - New payday from January.txt\n[3] Email - Payslips going digital.txt\n"}, {"path": ["Company A", "France", "Vacation days"], "name": "Conges payes - paid leave policy.txt", "content": "COMPANY A FRANCE - CONGÉS PAYÉS ET RTT / PAID LEAVE AND RTT\nDocument owner: RH France (Julien Bernard)\nStatus: Approved\nLast updated: 2024-06-01\nLast reviewed: 2024-09-02\n\nPaid leave: employees receive 25 working days of paid leave (five weeks) per year.\nRTT: full-time employees on the 37-hour schedule receive 10 RTT days per year.\nMain leave: take at least 12 consecutive days of leave between 1 May and 31 October.\n"}, {"path": ["Company A", "France", "Vacation days"], "name": "Email - RTT days 2026.txt", "content": "From: Julien Bernard, RH France\nTo: Tous les salariés / All employees France\nDate: 2026-01-05\nSubject: Vos jours de RTT 2026 / Your RTT days for 2026\n\nBonjour,\n\nIn 2026, full-time employees on the 37-hour schedule receive 11 RTT days.\nFive of them are fixed by the company (see the calendar); you choose the others yourself.\n\nJulien\n"}, {"path": ["Company A", "France", "Vacation days"], "name": "Email - Summer leave requests.txt", "content": "From: Julien Bernard, RH France\nTo: Tous les salariés / All employees France\nDate: 2026-02-16\nSubject: Congés d'été / Summer leave requests\n\nBonjour,\n\nPlease submit your summer leave requests in the HR portal before 31 March.\nManagers will confirm all requests by mid-April.\n\nJulien\n"}, {"path": ["Company A", "France", "Vacation days"], "name": "SUMMARY.txt", "content": "VACATION DAYS - COMPANY A - FRANCE\nSummary of 3 source documents - click a [number] to open that source.\n\nDocument owner: Knowledge team\nStatus: Verified\nLast updated: 2026-09-30\nLast reviewed: 2026-09-30\n\n- Paid leave: 25 working days (five weeks) a year. [1]\n- Main leave: at least 12 consecutive days between 1 May and 31 October. [1]\n- Summer requests: in the HR portal before 31 March; managers confirm by mid-April. [3]\n- RTT (37-hour schedule): five RTT days are fixed by the company, you choose the others. [2]\n\n⚠ CONFLICT - number of RTT days\n  The paid leave policy says 10 RTT days a year. [1]\n  The January 2026 email says 11 RTT days in 2026. [2]\n  RTT days can change from year to year, so the email is probably right for 2026.\n  The policy was last reviewed in September 2024 and is overdue for review.\n\nSources\n[1] Conges payes - paid leave policy.txt\n[2] Email - RTT days 2026.txt\n[3] Email - Summer leave requests.txt\n"}, {"path": ["Company A", "France", "Working hours"], "name": "Working time agreement France.txt", "content": "COMPANY A FRANCE - ACCORD SUR LE TEMPS DE TRAVAIL / WORKING TIME AGREEMENT\nDocument owner: RH France (Julien Bernard)\nStatus: Approved\nLast updated: 2025-12-10\nLast reviewed: 2026-02-11\n\nThe legal working week in France is 35 hours.\nCompany A France works a 37-hour schedule; the extra hours are compensated with RTT days.\nManagers on a \"forfait jours\" contract work 218 days per year and do not count their hours.\n"}, {"path": ["Company A", "France", "Working hours"], "name": "Email - Right to disconnect.txt", "content": "From: Direction France\nTo: Tous les salariés / All employees France\nDate: 2025-06-18\nSubject: Droit à la déconnexion / Right to disconnect\n\nBonjour à tous,\n\nA reminder of our right-to-disconnect agreement: nobody is expected to read or answer work messages\nbetween 20:00 and 08:00, at weekends or during leave. Please schedule emails instead of sending them late.\n\nLa Direction\n"}, {"path": ["Company A", "France", "Working hours"], "name": "SUMMARY.txt", "content": "WORKING HOURS - COMPANY A - FRANCE\nSummary of 2 source documents - click a [number] to open that source.\n\nDocument owner: Knowledge team\nStatus: Verified\nLast updated: 2026-09-30\nLast reviewed: 2026-09-30\n\n- The legal working week in France is 35 hours; Company A France works 37 hours and the extra hours become RTT days. [1]\n- Managers on a \"forfait jours\" contract: 218 days a year, hours are not counted. [1]\n- Right to disconnect: nobody is expected to read or answer work messages between 20:00 and 08:00,\n  at weekends or on leave. [2]\n\nNo conflicts found between these sources.\n\nSources\n[1] Working time agreement France.txt\n[2] Email - Right to disconnect.txt\n"}, {"path": ["Company B", "America", "Payroll"], "name": "Payroll handbook (US).txt", "content": "COMPANY B - PAYROLL HANDBOOK (US)\nDocument owner: Finance - Payroll (Derek Chen)\nStatus: Approved\nLast updated: 2026-06-20\nLast reviewed: 2026-07-01\n\nPay schedule: semi-monthly, on the 15th and on the last day of the month.\nDirect deposit is mandatory. Bank detail changes must be made at least ten days before a payday.\nExpense reimbursements are paid with the next regular payroll.\n"}, {"path": ["Company B", "America", "Payroll"], "name": "Email - New payroll provider.txt", "content": "From: Derek Chen, Finance\nTo: All US employees\nDate: 2026-08-19\nSubject: We are moving to a new payroll provider\n\nHi team,\n\nStarting with the October 15 payroll, Company B will use a new payroll provider.\nYou will get an invitation to create your account in the week of September 28.\nYour pay schedule does not change.\n\nPlease check your bank details in the new portal before October 5.\n\nDerek\n"}, {"path": ["Company B", "America", "Payroll"], "name": "SUMMARY.txt", "content": "PAYROLL - COMPANY B - AMERICA\nSummary of 2 source documents - click a [number] to open that source.\n\nDocument owner: Knowledge team\nStatus: Verified\nLast updated: 2026-09-30\nLast reviewed: 2026-09-30\n\n- Pay schedule: semi-monthly, on the 15th and on the last day of the month; the new provider does not change it. [1][2]\n- Direct deposit is mandatory; bank detail changes at least ten days before a payday. [1]\n- Expenses are reimbursed with the next regular payroll. [1]\n- New payroll provider from the October 15, 2026 payroll: accept the invitation (week of September 28)\n  and check your bank details in the new portal before October 5. [2]\n\nⓘ The same provider email is also filed under Working hours (\"FW New payroll provider\").\n\nSources\n[1] Payroll handbook (US).txt\n[2] Email - New payroll provider.txt\n"}, {"path": ["Company B", "America", "Vacation days"], "name": "Time off policy (US).txt", "content": "COMPANY B - TIME OFF (US)\nDocument owner: People Ops (Jasmine Ortiz)\nStatus: Draft\nLast updated: 2026-08-28\n\nCompany B offers flexible (unlimited) paid time off, agreed with your manager.\nE double holiday pay?\n92% of your gross monthly salary, paid with your June salary.\n\nDo I get meal vouchers?\nYes, meal vouchers are worth €7 per day worked.\n"}, {"path": ["Company B", "Belgium", "Payroll"], "name": "Email - Payroll cut-off.txt", "content": "From: Sofie Maes, Payroll Belgium\nTo: All employees Belgium\nDate: 2026-02-03\nSubject: Payroll cut-off date\n\nHi all,\n\nChanges such as a new bank account, a new address or a change in your family situation must reach payroll\nbefore the 20th of the month to be included in that month's payroll. Later changes move to the next month.\n\nSofie\n"}, {"path": ["Company B", "Belgium", "Payroll"], "name": "SUMMARY.txt", "content": "PAYROLL - COMPANY B - BELGIUM\nSummary of 2 source documents - click a [number] to open that source.\n\nDocument owner: Knowledge team\nStatus: Verified\nLast updated: 2026-09-30\nLast reviewed: 2026-09-30\n\n- Salary: paid on the first working day of the following month. [1]\n- Double holiday pay: 92% of your gross monthly salary, paid with the June salary. [1]\n- Meal vouchers: €7 per day worked. [1]\n- Cut-off: changes (bank account, address, family situation) must reach payroll before the 20th\n  to count for that month. [2]\n\nNo conflicts found between these sources.\n\nSources\n[1] Payroll FAQ Belgium.txt\n[2] Email - Payroll cut-off.txt\n"}, {"path": ["Company B", "Belgium", "Vacation days"], "name": "Holiday policy Belgium.txt", "content": "COMPANY B BELGIUM - HOLIDAY POLICY\nDocument owner: HR Belgium (Sofie Maes)\nStatus: Approved\nLast updated: 2025-12-20\nLast reviewed: 2026-01-09\n\nFull-time employees receive 20 legal vacation days per year.\nBecause our working week is 40 hours instead of 38, you also receive 12 ADV days (arbeidsduurvermindering) per year.\n"}, {"path": ["Company B", "Belgium", "Vacation days"], "name": "Email - Collective closure summer 2026.txt", "content": "From: Sofie Maes, HR Belgium\nTo: All employees Belgium\nDate: 2026-03-05\nSubject: Collective pen that source.\n\nDocument owner: Knowledge team\nStatus: Verified\nLast updated: 2026-09-30\nLast reviewed: 2026-09-30\n\n- Working week: 40 hours, Monday to Friday, eight hours a day. [1]\n- 12 ADV days a year bring the average back to 38 hours a week. [1]\n\nⓘ PROPOSAL ONLY\n  A four-day week (full-time hours in four longer days) is being discussed but is not approved;\n  it needs a change to the work rules and works council approval. [2]\n\nSources\n[1] Working hours Belgium.txt\n[2] DRAFT - four-day week proposal.txt\n"}, {"path": ["Company B", "France", "Payroll"], "name": "Payroll policy France.txt", "content": "COMPANY B FRANCE - PAYROLL POLICY\nDocument owner: Paie France (Élodie Petit)\nStatus: Approved\nLast updated: 2024-12-01\nLast reviewed: 2025-02-14\n\nSalaries are paid on the last working day of the month.\nCompany B covers 50% of the mutuelle (complementary health insurance) contribution.\n"}, {"path": ["Company B", "France", "Payroll"], "name": "Email - Mutuelle contribution 2026.txt", "content": "From: Élodie Petit, Paie France\nTo: Tous les salariés / All employees France\nDate: 2025-12-12\nSubject: Mutuelle : nouvelle participation / New mutuelle contribution\n\nBonjour à tous,\n\nGood news: from January 2026, Company B covers 60% of the mutuelle contribution.\nYou will see the change on your January payslip.\n\nÉlodie\n"}, {"path": ["Company B", "France", "Payroll"], "name": "SUMMARY.txt", "content": "PAYROLL - COMPANY B - FRANCE\nSummary of 2 source documents - click a [number] to open that source.\n\nDocument owner: Knowledge team\nStatus: Verified\nLast updated: 2026-09-30\nLast reviewed: 2026-09-30\n\n- Salary: paid on the last working day of the month. [1]\n- Mutuelle: Company B pays 60% of the contribution since January 2026. [2]\n\n⚠ CONFLICT - mutuelle contribution\n  The payroll policy says 50%; it was last reviewed in February 2025. [1]\n  The December 2025 email raises it to 60% from January 2026. [2]\n  The email is newer; the policy needs updating.\n\nSources\n[1] Payroll policy France.txt\n[2] Email - Mutuelle contribution 2026.txt\n"}, {"path": ["Company B", "France", "Vacation days"], "name": "Paid leave France.txt", "content": "COMPANY B FRANCE - CONGÉS PAYÉS / PAID LEAVE\nDocument owner: RH France (Élodie Petit)\nStatus: Approved\nLast updated: 2025-05-20\nLast reviewed: 2026-05-02\n\nYou earn 2.5 days of paid leave (jours ouvrables) per month worked, i.e. five weeks per year.\nThe reference period runs from 1 June to 31 May.\n"}, {"path": ["Company B", "France", "Vacation days"], "name": "Email - Leave request deadline.txt", "content": "From: Élodie Petit, RH France\nTo: Tous les salariés / All employees France\nDate: 2026-02-02\nSubject: Summer leave: requests before 15 March\n\nBonjour,\n\nPlease enter your summer leave requests in the HR tool before 15 March so we can plan the team rotas.\n\nÉlodie\n"}, {"path": ["Company B", "France", "Vacation days"], "name": "SUMMARY.txt", "content": "VACATION DAYS - COMPANY B - FRANCE\nSummary of 2 source documents - click a [number] to open that source.\n\nDocument owner: Knowledge team\nStatus: Verified\nLast updated: 2026-09-30\nLast reviewed: 2026-09-30\n\n- Paid leave: 2.5 days (jours ouvrables) per month worked, five weeks a year. [1]\n- Reference period: 1 June to 31 May. [1]\n- Summer leave: enter your requests in the HR tool before 15 March. [2]\n\nNo conflicts found between these sources.\n\nSources\n[1] Paid leave France.txt\n[2] Email - Leave request deadline.txt\n"}, {"path": ["Company B", "France", "Working hours"], "name": "Working hours France.txt", "content": "COMPANY B FRANCE - WORKING HOURS\nDocument owner: RH France (Élodie Petit)\nStatus: Approved\nLast updated: 2025-09-01\nLast reviewed: 2026-04-14\n\nThe working week is 35 hours.\nHours above 35 per week are overtime: the first eight overtime hours are paid at +25%, further hours at +50%.\n"}, {"path": ["Company B", "France", "Working hours"], "name": "Working hours France (2019).txt", "content": "COMPANY B FRANCE - WORKING HOURS\nDocument owner: RH France\nStatus: Superseded\nLast updated: 2019-03-01\nLast reviewed: 2019-03-01\n\nThe working week is 39 hours, compensated with RTT days.\n"}, {"path": ["Company B", "France", "Working hours"], "name": "SUMMARY.txt", "content": "WORKING HOURS - COMPANY B - FRANCE\nSummary of 2 source documents - click a [number] to open that source.\n\nDocument owner: Knowledge team\nStatus: Verified\nLast updated: 2026-09-30\nLast reviewed: 2026-09-30\n\n- Working week: 35 hours. [1]\n- Overtime: the first eight overtime hours a week are paid at +25%, further hours at +50%. [1]\n\n⚠ OUTDATED SOURCE\n  The 2019 version (39 hours with RTT days) is superseded. [2]\n\nSources\n[1] Working hours France.txt\n[2] Working hours France (2019).txt\n"}]</script>

    <script>
      'use strict';

      /* ---------- Storage & data model ---------- */

      // v3: the knowledge base ships with sample documents and summaries (see the seed-data block above).
      const STORAGE_KEY = 'knowledge-management-drive-v4-policy-demo';
      const STALE_DAYS = 180;
      const MAX_IMPORT_BYTES = 2 * 1024 * 1024;

      const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2));
      const now = () => new Date().toISOString();

      function folder(name, children = []) {
        return { id: uid(), type: 'folder', name, children };
      }

      function file(name, content = '', extra = {}) {
        const t = now();
        return {
          id: uid(),
          type: 'file',
          name,
          content,
          owner: '',
          status: 'draft',        // draft | verified | outdated
          createdAt: t,
          updatedAt: t,
          reviewedAt: null,
          changedAt: null,        // set when added or edited in the app (used to spot stale summaries)
          ...extra
        };
      }

      // A summary is a folder that carries its own summary text (SUMMARY.txt on disk).
      // It is shown as one document; its children are the source documents it summarises.
      const isSummary = (n) => !!n && n.type === 'folder' && typeof n.summary === 'string';
      const isDoc = (n) => !!n && (n.type === 'file' || isSummary(n));
      const docText = (n) => (n.type === 'file' ? n.content : n.summary || '');
      const docTitle = (n) => (n && n.trustedPolicy ? n.name + ' — trusted version' : isSummary(n) ? n.name + ' — summary' : n.name);

      // Reads "Document owner:", "Status:", "Last updated:", "Last reviewed:", "From:" and "Date:" header lines.
      function parseDocMeta(text) {
        const meta = {};
        const toIso = (v) => {
          const m = String(v).match(/\d{4}-\d{2}-\d{2}/);
          if (!m) return null;
          const t = Date.parse(m[0] + 'T12:00:00Z');
          return isNaN(t) ? null : new Date(t).toISOString();
        };
        text.split(/\r?\n/).slice(0, 15).forEach((line) => {
          let m;
          if ((m = line.match(/^\s*(?:document owner|owner)\s*:\s*(.+)$/i))) meta.owner = m[1].trim().slice(0, 80);
          else if ((m = line.match(/^\s*from\s*:\s*(.+)$/i))) { if (!meta.owner) meta.owner = m[1].replace(/<[^>]*>/g, '').trim().slice(0, 80); }
          else if ((m = line.match(/^\s*status\s*:\s*([a-z]+)/i))) {
            const s = m[1].toLowerCase();
            meta.status = /^(approved|verified|final|current)$/.test(s) ? 'verified'
              : /^(superseded|outdated|obsolete|archived|expired)$/.test(s) ? 'outdated' : 'draft';
          } else if ((m = line.match(/^\s*last reviewed\s*:\s*(.+)$/i))) { const t = toIso(m[1]); if (t) meta.reviewedAt = t; }
          else if ((m = line.match(/^\s*(?:last updated|date)\s*:\s*(.+)$/i))) { const t = toIso(m[1]); if (t) { meta.updatedAt = t; meta.createdAt = t; } }
        });
        return meta;
      }

      function setSummary(folderNode, text, extra = {}) {
        const t = now();
        Object.assign(folderNode, { summary: text, owner: '', status: 'draft', createdAt: t, updatedAt: t, reviewedAt: null }, extra, parseDocMeta(text));
      }

      // Adds a text file to a folder. A file called SUMMARY.txt turns its folder into a summary document instead.
      function addTextFile(parent, name, content, { allowSummary = true, extra = {} } = {}) {
        if (allowSummary && name.toLowerCase() === 'summary.txt') {
          setSummary(parent, content, extra);
          return { kind: 'summary', node: parent };
        }
        const f = file(uniqueName(parent, name), content, { ...extra, ...parseDocMeta(content) });
        parent.children.push(f);
        return { kind: 'file', node: f };
      }

      function ensureFolderPath(root, names) {
        let parent = root;
        for (const name of names) {
          let next = parent.children.find((c) => c.type === 'folder' && c.name.toLowerCase() === name.toLowerCase());
          if (!next) { next = folder(name); parent.children.push(next); }
          parent = next;
        }
        return parent;
      }

      function readSeed() {
        try {
          const seed = JSON.parse(document.getElementById('seed-data').textContent);
          return Array.isArray(seed) ? seed : [];
        } catch (error) {
          console.warn('Could not read the built-in documents.', error);
          return [];
        }
      }

      function addCompanyPolicyDemo(root) {
        const america = ensureFolderPath(root, ['Company A', 'America']);
        america.children = america.children.filter((c) => !(c.type === 'folder' && c.name.toLowerCase() === 'company policies'));
        const policies = folder('Company Policies');
        america.children.push(policies);

        const v14 = `EMPLOYEE WORKING CONDITIONS POLICY
Document owner: Human Resources Department
Approved by: Director of Human Resources
Status: Approved
Version: 1.4
Effective date: 2024-01-01
Approval date: 2023-12-12

1. Purpose and Scope
This policy establishes the general working conditions applicable to permanent employees of Company A in America, unless otherwise stated in an individual employment agreement or formally approved amendment. Where a binding agreement provides different conditions, that agreement takes precedence.

2. Working Hours
