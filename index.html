            cur = null;
            continue;
          }
          const sec = SECTIONS.find((s2) => s2.title.toLowerCase() === t.toLowerCase());
          if (sec && !cur) {
            cur = { key: sec.key, title: sec.title, value: '', details: [], sources: [] };
            out.sections.push(cur);
            continue;
          }
          if (cur) {
            const src = t.match(/^source\s*:\s*(.+)$/i);
            if (src) cur.sources.push(...src[1].split(';').map((x) => x.trim()).filter(Boolean));
            else if (!cur.value) cur.value = t;
            else cur.details.push(t);
          } else out.extra.push(t);
        }
        return out;
      }

      function setSummary(folderNode, text, extra = {}) {
        const t = now();
        Object.assign(folderNode, { summary: text, owner: '', status: 'draft', createdAt: t, updatedAt: t, reviewedAt: null }, extra, parseDocMeta(text));
      }

      // Adds a text file to a folder. A file called SUMMARY.txt turns its folder into a summary document instead.
      function addTextFile(parent, name, content, { allowSummary = true, extra = {} } = {}) {
        if (allowSummary && name.toLowerCase() === 'summary.txt') {
          setSummary(parent, content, extra);
          return { kind: 'summary', node: parent };
        }
        const f = file(uniqueName(parent, name), content, { ...extra, ...parseDocMeta(content) });
        parent.children.push(f);
        return { kind: 'file', node: f };
      }

      function ensureFolderPath(root, names) {
        let parent = root;
        for (const name of names) {
          let next = parent.children.find((c) => c.type === 'folder' && c.name.toLowerCase() === name.toLowerCase());
          if (!next) { next = folder(name); parent.children.push(next); }
          parent = next;
        }
        return parent;
      }

      function readSeed() {
        try {
          const seed = JSON.parse(document.getElementById('seed-data').textContent);
          return Array.isArray(seed) ? seed : [];
        } catch (error) {
          console.warn('Could not read the built-in documents.', error);
          return [];
        }
      }

      function buildInitialData() {
        const root = folder('My Drive');
        ['Company A', 'Company B'].forEach((c) => ['America', 'Belgium', 'France'].forEach((l) => ensureFolderPath(root, [c, l])));
        readSeed().forEach((item) => {
          if (!item || !Array.isArray(item.path) || typeof item.name !== 'string' || typeof item.content !== 'string') return;
          const parent = ensureFolderPath(root, item.path.map(String));
          // Documents without a Date / Last updated line stay undated rather than pretending to be new.
          addTextFile(parent, item.name, item.content, { allowSummary: parent !== root, extra: { createdAt: null, updatedAt: null } });
        });
        return root;
      }

      function isValidNode(node) {
        if (!node || typeof node !== 'object' || typeof node.name !== 'string' || typeof node.id !== 'string') return false;
        if (node.type === 'folder') {
          return Array.isArray(node.children) && (node.summary === undefined || typeof node.summary === 'string') && node.children.every(isValidNode);
        }
        if (node.type === 'file') return typeof node.content === 'string';
        return false;
      }

      function loadState() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed && parsed.type === 'folder' && isValidNode(parsed)) return parsed;
          }
        } catch (error) {
          console.warn('Could not read saved data, starting fresh.', error);
        }
        return buildInitialData();
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state.root));
          return true;
        } catch (error) {
          console.warn('Could not save.', error);
          return false;
        }
      }

      const state = {
        root: loadState(),
        currentFolderId: null,     // null = root
        activeFileId: null,        // id of the open document (a file or a summary)
        view: 'folder',            // folder | search | attention
        query: '',
        dirty: false,
        layout: 'graph',           // graph | grid
        expanded: new Set()        // folder / summary ids opened in the graph
      };
      state.currentFolderId = state.root.id;

      const UI_KEY = 'knowledge-management-ui-v4';
      function saveUiPrefs() {
        try { localStorage.setItem(UI_KEY, JSON.stringify({ layout: state.layout, expanded: [...state.expanded] })); } catch (e) { /* optional */ }
      }
      (function loadUiPrefs() {
        let prefs = null;
        try { prefs = JSON.parse(localStorage.getItem(UI_KEY) || 'null'); } catch (e) { /* ignore */ }
        if (prefs && (prefs.layout === 'graph' || prefs.layout === 'grid')) state.layout = prefs.layout;
        if (prefs && Array.isArray(prefs.expanded)) state.expanded = new Set(prefs.expanded.filter((x) => typeof x === 'string'));
      })();

      /* ---------- Tree helpers ---------- */

      function walk(node, fn, path = []) {
        fn(node, path);
        if (node.type === 'folder') node.children.forEach((c) => walk(c, fn, [...path, node]));
      }

      function findById(id) {
        let found = null;
        walk(state.root, (n, path) => { if (n.id === id) found = { node: n, path }; });
        return found;
      }

      // Source documents (plain files).
      function allFiles() {
        const out = [];
        walk(state.root, (n, path) => { if (n.type === 'file') out.push({ node: n, path }); });
        return out;
      }

      // Everything a person can open and read: source files and summaries.
      function allDocs() {
        const out = [];
        walk(state.root, (n, path) => { if (isDoc(n)) out.push({ node: n, path }); });
        return out;
      }

      function pathLabel(path) {
        return path.map((p) => p.name).join(' / ');
      }

      function currentFolder() {
        const f = findById(state.currentFolderId);
        return f && f.node.type === 'folder' ? f.node : state.root;
      }

      function nameTaken(parent, name, exceptId) {
        const lower = name.toLowerCase();
        return parent.children.some((c) => c.id !== exceptId && c.name.toLowerCase() === lower);
      }

      function uniqueName(parent, name) {
        if (!nameTaken(parent, name)) return name;
        const dot = name.lastIndexOf('.');
        const base = dot > 0 ? name.slice(0, dot) : name;
        const ext = dot > 0 ? name.slice(dot) : '';
        let i = 2;
        while (nameTaken(parent, `${base} (${i})${ext}`)) i++;
        return `${base} (${i})${ext}`;
      }

      function validateName(name) {
        if (!name) return 'Please enter a name.';
        if (/[\/\\]/.test(name)) return 'Names cannot contain / or \\.';
        if (name === '.' || name === '..') return 'That name is not allowed.';
        return '';
      }

      /* ---------- Trust analysis ---------- */

      const STOP = new Set(('the a an and or of to in on at for by with from is are was were be been has have had this that these those it its as our your their we you they '
        + 'per each all any not no will can may please share pleased dear team hi hello thanks regards sincerely about into than then also more most very just only '
        + 'new updated update since every until before after least up still stays now there here which who what when where how').split(' '));

      const MONTHS = 'january|february|march|april|may|june|july|august|september|october|november|december|jan|feb|mar|apr|jun|jul|aug|sept|sep|oct|nov|dec';
      // Dates, times, e-mail addresses and links are not "facts" to compare, so they are removed first.
      const IGNORE_RE = new RegExp([
        '\\b\\d{4}-\\d{2}-\\d{2}\\b',
        '\\b\\d{1,2}/\\d{1,2}/\\d{2,4}\\b',
        `\\b\\d{1,2}(?:st|nd|rd|th)?\\s+(?:${MONTHS})\\b(?:\\s+\\d{4})?`,
        `\\b(?:${MONTHS})\\s+\\d{1,2}(?:st|nd|rd|th)?\\b(?:,?\\s+\\d{4})?`,
        `\\b(?:${MONTHS})\\s+\\d{4}\\b`,
        '\\b\\d{1,2}[:h]\\d{2}\\b',
        '\\S+@\\S+',
        'https?://\\S+'
      ].join('|'), 'gi');
      const HEADER_LINE = /^\s*(document owner|policy owner|owner|status|last updated|last reviewed|date|from|to|cc|applies to|company|policy id|effective date|version|approved by|approval date|compiled|source)\s*:/i;
      const NUM_RE = /([$€£])?\s?(\d+(?:[.,]\d+)*)\s?(%)?/g;
      const UNIT_WORDS = { day: 'day', days: 'day', hour: 'hour', hours: 'hour', week: 'week', weeks: 'week', month: 'month', months: 'month',
        year: 'year', years: 'year', minute: 'minute', minutes: 'minute', times: 'times', percent: '%', paydays: 'payday', holidays: 'holiday' };
      const PERIOD_WORDS = { year: 'year', annually: 'year', yearly: 'year', month: 'month', monthly: 'month', week: 'week', weekly: 'week',
        workweek: 'week', day: 'day', daily: 'day', hour: 'hour', hourly: 'hour' };

      function tokens(text) {
        return text.toLowerCase().match(/[a-zà-ÿ]+/g) || [];
      }

      function numValue(s) {
        if (/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) return parseFloat(s.replace(/,/g, ''));
        if (/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) return parseFloat(s.replace(/\./g, '').replace(',', '.'));
        return parseFloat(s.replace(',', '.'));
      }

      // What a number counts: money, %, days, hours… plus an optional period ("per year", "a month").
      function unitOf(m, after) {
        const words = (after.toLowerCase().match(/[a-z]+/g) || []).slice(0, 5);
        let base = m[1] ? 'money' : m[3] ? '%' : '';
        if (!base) for (const w of words.slice(0, 3)) if (UNIT_WORDS[w]) { base = UNIT_WORDS[w]; break; }
        let period = '';
        for (let i = 0; i < words.length - 1; i++) {
          if ((words[i] === 'per' || words[i] === 'a' || words[i] === 'each') && PERIOD_WORDS[words[i + 1]]) { period = PERIOD_WORDS[words[i + 1]]; break; }
        }
        if (!period) for (const w of words) if (/^(annually|yearly|monthly|weekly|daily|hourly)$/.test(w)) { period = PERIOD_WORDS[w]; break; }
        return { base, period };
      }

      const unitsMatch = (a, b) => a.base === b.base && (!a.period || !b.period || a.period === b.period);

      function factLabel(f) {
        const unit = f.unit.base && !['money', '%'].includes(f.unit.base) ? ` ${f.unit.base}${f.value === 1 ? '' : 's'}` : '';
        return f.raw + unit + (f.unit.period && f.unit.period !== f.unit.base ? ` per ${f.unit.period}` : '');
      }

      // Numbers stated in a document, with what they are about: the words before the number ("minimum wage"),
      // the words right after it ("paid sick days"), the kind of unit, and the template section of the paragraph.
      function extractFacts(text) {
        const facts = [];
        text.split(/\r?\n/).forEach((line) => {
          if (HEADER_LINE.test(line)) return;
          const secs = new Set(SECTIONS.filter((sec) => sec.re.test(line)).map((sec) => sec.key));
          if (!secs.size) secs.add('other');
          line.split(/(?<=[.!?])\s+/).forEach((sentence) => {
            const shown = sentence.trim();
            if (!shown) return;
            const s = shown.replace(IGNORE_RE, ' ');
            let m, last = 0;
            NUM_RE.lastIndex = 0;
            while ((m = NUM_RE.exec(s))) {
              if (!m[0].trim()) { NUM_RE.lastIndex++; continue; }
              const context = tokens(s.slice(last, m.index)).filter((w) => w.length > 2 && !STOP.has(w)).slice(-5);
              last = m.index + m[0].length;
              if (!m[1] && !m[3] && /^(19|20)\d\d$/.test(m[2])) continue; // a bare year
              const before = new Set();
              for (let i = 0; i < context.length - 1; i++) before.add(context[i] + ' ' + context[i + 1]);
              const afterWords = tokens(s.slice(last, last + 60).split(/\d/)[0])
                .filter((w) => w.length > 2 && !STOP.has(w) && !UNIT_WORDS[w] && !PERIOD_WORDS[w]).slice(0, 2);
              const after = afterWords.length === 2 ? afterWords.join(' ') : '';
              if (!before.size && !after) continue;
              facts.push({
                before, after, secs,
                value: numValue(m[2]),
                raw: (m[1] || '') + m[2] + (m[3] || ''),
                unit: unitOf(m, s.slice(last)),
                sentence: shown.length > 170 ? shown.slice(0, 167) + '…' : shown
              });
            }
          });
        });
        return facts;
      }

      // How well two numbers are about the same thing (0 = not comparable).
      function factMatch(fa, fb) {
        if (!unitsMatch(fa.unit, fb.unit)) return 0;
        if (![...fa.secs].some((k) => fb.secs.has(k))) return 0;
        const shared = [...fa.before].filter((t) => fb.before.has(t)).length;
        const afterHit = fa.after && fa.after === fb.after ? 1 : 0;
        return shared ? shared * 2 + afterHit : afterHit;
      }

      function daysSince(iso) {
        if (!iso) return Infinity;
        return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
      }

      function metaIssues(node, r) {
        let score = 0;
        if (node.status === 'outdated') { r.issues.push('Marked as outdated / superseded.'); score += 2; }
        if (node.status === 'draft') { r.issues.push('Not verified yet (draft or unconfirmed).'); score += 1; }
        if (!node.owner) { r.issues.push('No owner or sender — nobody to ask about this.'); score += 1; }
        const age = daysSince(node.reviewedAt);
        if (age === Infinity) { r.issues.push('Never reviewed.'); score += 1; }
        else if (age > STALE_DAYS) { r.issues.push(`Last reviewed ${age} days ago.`); score += 1; }
        if (!docText(node).trim()) { r.issues.push('Document is empty.'); score += 1; }
        if (node.type === 'file' && !node.updatedAt) { r.issues.push('No date — you cannot tell how current it is.'); score += 1; }
        return score;
      }

      function analyzeAll() {
        const files = allFiles();
        const result = new Map();
        const facts = new Map();
        const scope = new Map();
        const contentIndex = new Map();

        files.forEach(({ node, path }) => {
          facts.set(node.id, extractFacts(node.content));
          // Company / country the document belongs to: Belgium and France may legitimately differ.
          scope.set(node.id, path.slice(1, 3).map((p) => p.id).join('/'));
          const key = node.content.trim().replace(/\s+/g, ' ').toLowerCase();
          if (key.length > 20) {
            if (!contentIndex.has(key)) contentIndex.set(key, []);
            contentIndex.get(key).push(node.id);
          }
          result.set(node.id, { issues: [], conflicts: [], duplicates: [], level: 'good' });
        });

        const comparable = (s1, s2) => !s1 || !s2 || s1 === s2 || s1.startsWith(s2 + '/') || s2.startsWith(s1 + '/');

        // Conflicts: two documents of the same company & country state a different number for the same thing.
        // Each number is compared with its best-matching number in the other document only.
        for (let i = 0; i < files.length; i++) {
          for (let j = i + 1; j < files.length; j++) {
            const a = files[i].node, b = files[j].node;
            if (!comparable(scope.get(a.id), scope.get(b.id))) continue;
            const seen = new Set();
            const record = (fa, fb) => {
              const key = fa.sentence + '|' + fa.raw + '|' + fb.sentence + '|' + fb.raw;
              if (seen.has(key)) return;
              seen.add(key);
              result.get(a.id).conflicts.push({ otherId: b.id, mine: fa.sentence, theirs: fb.sentence, mineValue: factLabel(fa), theirValue: factLabel(fb) });
              result.get(b.id).conflicts.push({ otherId: a.id, mine: fb.sentence, theirs: fa.sentence, mineValue: factLabel(fb), theirValue: factLabel(fa) });
            };
            const best = (f, pool) => pool.reduce((acc, g) => { const sc = factMatch(f, g); return sc > acc.sc ? { g, sc } : acc; }, { g: null, sc: 0 }).g;
            facts.get(a.id).forEach((fa) => { const fb = best(fa, facts.get(b.id)); if (fb && fb.value !== fa.value) record(fa, fb); });
            facts.get(b.id).forEach((fb) => { const fa = best(fb, facts.get(a.id)); if (fa && fa.value !== fb.value) record(fa, fb); });
          }
        }

        contentIndex.forEach((ids) => {
          if (ids.length < 2) return;
          ids.forEach((id) => { result.get(id).duplicates = ids.filter((x) => x !== id); });
        });

        files.forEach(({ node }) => {
          const r = result.get(node.id);
          let score = metaIssues(node, r);
          if (r.duplicates.length) { r.issues.push(`Same text as ${r.duplicates.length} other document${r.duplicates.length === 1 ? '' : 's'}.`); score += 1; }
          // red = contradicted or explicitly outdated; amber = something still to check; green = all good
          r.level = node.status === 'outdated' || r.conflicts.length ? 'bad' : score > 0 ? 'warn' : 'good';
        });

        // Summaries: their own metadata, plus what is going on in the sources they are built from.
        walk(state.root, (node) => {
          if (!isSummary(node)) return;
          const r = { issues: [], conflicts: [], duplicates: [], level: 'good' };
          let score = metaIssues(node, r);
          const sources = node.children.filter((c) => c.type === 'file');
          const conflicted = sources.filter((s) => result.get(s.id).conflicts.length).length;
          const outdated = sources.filter((s) => s.status === 'outdated').length;
          const changed = sources.filter((s) => s.changedAt && (!node.updatedAt || s.changedAt > node.updatedAt)).length;
          if (!sources.length) { r.issues.push('Has no source documents.'); score += 1; }
          if (changed) r.issues.push(`${changed} source${changed === 1 ? ' was' : 's were'} added or edited after this summary was written — it may be out of date.`);
          // Per template section: was the most recent (non-draft, non-outdated) document the one used?
          const parsed = parseSummary(node.summary);
          const groups = sectionGroups(node);
          const time = (f) => (f.updatedAt ? Date.parse(f.updatedAt) : 0);
          let newerUnused = 0;
          parsed.sections.forEach((sec) => {
            const docs = groups.get(sec.key) || [];
            const isUsed = (f) => sec.sources.some((n) => n.toLowerCase() === f.name.toLowerCase());
            const used = docs.filter(isUsed);
            sec.sources.filter((n) => !docs.some((f) => f.name.toLowerCase() === n.toLowerCase()))
              .forEach((n) => { r.issues.push(`${sec.title}: the source “${n}” is missing.`); score += 1; });
            const newestUsed = used.reduce((m, f) => Math.max(m, time(f)), 0);
            docs.filter((f) => !isUsed(f) && f.status !== 'outdated' && !f.proposal && time(f) > newestUsed).forEach((f) => {
              r.issues.push(`${sec.title}: “${f.name}” is newer than the document used — check that the summary is still right.`);
              newerUnused += 1;
            });
          });
          if (conflicted) r.issues.push(`${conflicted} of its ${sources.length} sources disagree with another source; the summary uses the most recent one — click a section to compare.`);
          if (outdated) r.issues.push(`${outdated} source${outdated === 1 ? ' is' : 's are'} marked outdated and not used.`);
          r.level = changed || newerUnused || node.status === 'outdated' ? 'bad' : score > 0 ? 'warn' : 'good';
          r.sourceCount = sources.length;
          result.set(node.id, r);
        });

        return result;
      }

      // Used only for tooltips and the "Needs attention" list; the score shown to users is trustScore().
      const LEVEL_LABEL = { good: 'No open issues', warn: 'Something to check', bad: 'Several things to check' };

      // Trustworthiness score shown on every opened document.
      // Placeholder: every document is 6/10 until the real scoring algorithm is written.
      function trustScore(fileNode) {
        return 6;
      }

      function scoreBadge(fileNode) {
        return el('span', { class: 'score', title: 'Trustworthiness score (placeholder — same for every document for now)' }, [
          el('span', { class: 'score-label', text: 'Trust' }),
          el('span', { class: 'score-value', text: `${trustScore(fileNode)}/10` })
        ]);
      }

      /* ---------- Rendering ---------- */

      const $ = (id) => document.getElementById(id);
      let analysis = analyzeAll();

      function el(tag, props = {}, children = []) {
        const e = document.createElement(tag);
        Object.entries(props).forEach(([k, v]) => {
          if (k === 'class') e.className = v;
          else if (k === 'text') e.textContent = v;
          else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
          else e.setAttribute(k, v);
        });
        [].concat(children).forEach((c) => c != null && e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c));
        return e;
      }

      function render() {
        analysis = analyzeAll();
        renderNav();
        renderMain();
        renderEditor();
      }

      function renderNav() {
        const nav = $('navList');
        nav.innerHTML = '';
        const inFolder = state.view === 'folder';
        nav.appendChild(el('button', {
          class: 'nav-item' + (inFolder && state.currentFolderId === state.root.id ? ' active' : ''),
          text: 'My Drive',
          onclick: () => openFolder(state.root.id)
        }));
        state.root.children.filter((c) => c.type === 'folder').forEach((f) => {
          nav.appendChild(el('button', {
            class: 'nav-item sub' + (inFolder && state.currentFolderId === f.id ? ' active' : ''),
            text: '📁 ' + f.name,
            onclick: () => openFolder(f.id)
          }));
        });

        const needing = allDocs().filter(({ node }) => analysis.get(node.id).level === 'bad').length;
        $('attentionNav').classList.toggle('active', state.view === 'attention');
        $('attentionCount').textContent = needing;
        $('attentionCount').classList.toggle('hidden', needing === 0);
      }

      function renderBreadcrumbs() {
        const bc = $('breadcrumbs');
        bc.innerHTML = '';
        if (state.view === 'search') { bc.appendChild(el('span', { class: 'crumb current', text: `Search results for “${state.query}”` })); return; }
        if (state.view === 'attention') { bc.appendChild(el('span', { class: 'crumb current', text: 'Needs attention' })); return; }
        if (state.layout === 'graph') { bc.appendChild(el('span', { class: 'crumb current', text: 'All files' })); return; }

        const found = findById(state.currentFolderId);
        const chain = found ? [...found.path, found.node] : [state.root];
        chain.forEach((f, i) => {
          const last = i === chain.length - 1;
          bc.appendChild(el('button', { class: 'crumb' + (last ? ' current' : ''), type: 'button', text: f.name, onclick: last ? null : () => openFolder(f.id) }));
          if (!last) bc.appendChild(document.createTextNode('/'));
        });
      }

      function renderFolderActions() {
        const box = $('folderActions');
        box.innerHTML = '';
        if (state.view !== 'folder' || state.currentFolderId === state.root.id) return;
        const cur = currentFolder();
        const kind = isSummary(cur) ? 'summary' : 'folder';
        if (state.layout === 'graph') box.appendChild(el('span', { class: 'status-msg', text: `Selected: ${cur.name}${isSummary(cur) ? ' (summary)' : ''}` }));
        if (isSummary(cur) && state.layout === 'grid') box.appendChild(el('button', { class: 'primary-btn small-btn', text: 'Read summary', onclick: () => openFile(cur.id) }));
        box.appendChild(el('button', { class: 'secondary-btn small-btn', text: `Rename ${kind}`, onclick: () => renameItem(state.currentFolderId) }));
        box.appendChild(el('button', { class: 'danger-btn small-btn', text: `Delete ${kind}`, onclick: () => deleteItem(state.currentFolderId) }));
      }

      // In the graph view the right-hand panel only appears while a document is open for editing,
      // so the graph gets the full width.
      function updateLayoutClass() {
        const wide = state.layout === 'graph' && state.view === 'folder' && !state.activeFileId;
        const content = $('content');
        if (content.classList.contains('graph-wide') === wide) return;
        content.classList.toggle('graph-wide', wide);
        if (graph.wrap && graph.wrap.isConnected && graph.autoFit) setZoom(fitZoom(graph.width));
      }

      function renderMain() {
        updateLayoutClass();
        renderBreadcrumbs();
        renderFolderActions();
        const body = $('mainBody');
        const keepScroll = graph.wrap && graph.wrap.isConnected ? [graph.wrap.scrollLeft, graph.wrap.scrollTop] : null;
        body.innerHTML = '';
        $('dropHint').classList.toggle('hidden', state.view !== 'folder' || state.layout === 'graph');
        $('viewToggle').querySelectorAll('button').forEach((b) => b.classList.toggle('on', state.view === 'folder' && b.dataset.layout === state.layout));

        if (state.view === 'search') return renderResults(body, searchFiles(state.query), 'No documents match your search.');
        if (state.view === 'attention') {
          // Only real problems: contradicted, superseded, or summaries whose sources changed since.
          const list = allDocs()
            .filter(({ node }) => analysis.get(node.id).level === 'bad')
            .sort((a, b) => (isSummary(b.node) - isSummary(a.node)) || pathLabel(a.path).localeCompare(pathLabel(b.path)))
            .map((f) => ({ ...f, snippet: null }));
          body.appendChild(el('p', { class: 'target-hint', text: 'Documents that contradict another document, are marked outdated, or summaries whose sources changed after they were written.' }));
          return renderResults(body, list, 'Nothing needs attention — no conflicts, outdated documents or stale summaries.');
        }

        if (state.layout === 'graph') return renderGraph(body, keepScroll);

        const folderNode = currentFolder();
        const gridCard = (item) => {
          const summary = isSummary(item);
          const card = el('div', { class: `item-card ${summary ? 'summary' : item.type}` + (item.id === state.activeFileId ? ' selected' : ''), tabindex: '0' });
          if (isDoc(item)) {
            const a = analysis.get(item.id);
            card.appendChild(el('span', { class: `dot ${a.level}`, title: LEVEL_LABEL[a.level] }));
          }
          card.appendChild(el('div', { class: 'item-icon', text: summary ? '📋' : item.type === 'folder' ? '📁' : '📄' }));
          card.appendChild(el('div', { class: 'item-name', text: item.name }));
          if (summary) {
            const n = item.children.length;
            card.appendChild(el('div', { class: 'item-sub', text: `summary · ${n} source${n === 1 ? '' : 's'}` }));
          } else if (item.type === 'folder') {
            let n = 0; walk(item, (x) => { if (isDoc(x)) n++; });
            card.appendChild(el('div', { class: 'item-sub', text: `${n} document${n === 1 ? '' : 's'}` }));
          } else {
            card.appendChild(el('div', { class: 'item-sub', text: item.updatedAt ? fmtDate(item.updatedAt) : item.owner || 'no date' }));
          }
          const open = () => (isDoc(item) ? openFile(item.id) : openFolder(item.id));
          card.addEventListener('click', open);
          card.addEventListener('keydown', (e) => { if (e.key === 'Enter') open(); });
          if (item.type === 'folder') addFolderDropTarget(card, item.id);
          return card;
        };

        if (isSummary(folderNode)) {
          // Inside a summary: one folder per template section, holding the documents considered for it.
          body.appendChild(el('div', { class: 'source-banner' }, [
            el('span', { text: `📋 The ${folderNode.children.length} source document${folderNode.children.length === 1 ? '' : 's'} behind this summary, sorted into its sections (a document can appear in several).` }),
            el('button', { class: 'link-btn', type: 'button', text: 'Read the summary', onclick: () => openFile(folderNode.id) })
          ]));
          const groups = sectionGroups(folderNode);
          [...SECTIONS, OTHER_SECTION].forEach((sec) => {
            const docs = groups.get(sec.key);
            if (sec.key === 'other' && !docs.length) return;
            body.appendChild(el('h4', { class: 'group-title' }, ['📁 ' + sec.title, el('span', { class: 'group-count', text: ` · ${docs.length} document${docs.length === 1 ? '' : 's'}` })]));
            const grid = el('div', { class: 'grid' });
            if (!docs.length) grid.appendChild(el('div', { class: 'empty-state', text: 'No source document mentions this section.' }));
            docs.forEach((f) => grid.appendChild(gridCard(f)));
            body.appendChild(grid);
          });
          return;
        }

        const grid = el('div', { class: 'grid' });
        if (!folderNode.children.length) {
          grid.appendChild(el('div', { class: 'empty-state', text: 'This folder is empty. Create a file, import .txt files, or drag them here.' }));
        }
        sortedChildren(folderNode).forEach((item) => grid.appendChild(gridCard(item)));
        body.appendChild(grid);
      }

      function renderResults(body, list, emptyText) {
        if (!list.length) { body.appendChild(el('div', { class: 'empty-state', text: emptyText })); return; }
        const wrap = el('div', { class: 'result-list' });
        list.forEach(({ node, path, snippet }) => {
          const a = analysis.get(node.id);
          const card = el('div', { class: 'result', tabindex: '0', onclick: () => openFile(node.id) });
          card.appendChild(el('div', { class: 'result-top' }, [
            el('span', { class: 'result-name', text: (isSummary(node) ? '📋 ' : '📄 ') + docTitle(node) }),
            scoreBadge(node)
          ]));
          card.appendChild(el('div', { class: 'result-path', text: pathLabel(path) + (node.owner ? ` · owner: ${node.owner}` : '') }));
          if (snippet) card.appendChild(snippet);
          const issues = [...a.issues, ...a.conflicts.map((c) => `Says ${c.mineValue}, but ${fileLabel(c.otherId)} says ${c.theirValue}.`)];
          if (issues.length) card.appendChild(el('ul', { class: 'result-issues' }, issues.slice(0, 4).map((t) => el('li', { text: t }))));
          card.addEventListener('keydown', (e) => { if (e.key === 'Enter') openFile(node.id); });
          wrap.appendChild(card);
        });
        body.appendChild(wrap);
      }

      function fileLabel(id) {
        const f = findById(id);
        return f ? `${f.node.name} (${pathLabel(f.path.slice(1)) || 'My Drive'})` : 'another file';
      }

      function stat(value, label, tone = '') {
        return el('div', { class: 'stat' + (tone ? ' ' + tone : '') }, [
          el('div', { class: 'stat-value', text: String(value) }),
          el('div', { class: 'stat-label', text: label })
        ]);
      }

      function buildTrustBox(a, onOpenOther) {
        const items = a.issues.map((t) => el('li', { text: t }));
        a.conflicts.forEach((c) => {
          const other = findById(c.otherId);
          const o = other && other.node;
          const otherInfo = o ? [o.status === 'outdated' ? 'marked outdated' : o.status === 'verified' ? 'verified' : 'unverified',
            o.updatedAt ? 'dated ' + new Date(o.updatedAt).toLocaleDateString() : null].filter(Boolean).join(', ') : '';
          items.push(el('li', { class: 'conflict' }, [
            el('strong', { text: `Says ${c.mineValue}, ` }),
            'but ',
            el('button', { class: 'link-btn', type: 'button', text: fileLabel(c.otherId), onclick: () => onOpenOther(c.otherId) }),
            otherInfo ? ` (${otherInfo})` : '',
            el('strong', { text: ` says ${c.theirValue}.` }),
            el('span', { class: 'conflict-quote', text: 'Here: “' + c.mine + '”' }),
            el('span', { class: 'conflict-quote', text: 'There: “' + c.theirs + '”' })
          ]));
        });
        const trust = el('div', { class: 'trust-box' }, [el('strong', { text: items.length ? 'Things to check' : 'Verified, owned and recently reviewed.' })]);
        if (items.length) trust.appendChild(el('ul', {}, items));
        return trust;
      }

      /* ---------- Graph view & file pop-up ---------- */

      // Layout constants (px). Each visible leaf gets one horizontal slot; parents sit centred above their children.
      const G = { SLOT: 212, NODE_W: 184, NODE_H: 58, FILE_W: 196, FILE_H: 44, FILE_GAP: 52, INDENT: 12, LEVEL: 118, PAD: 28, DURATION: 420 };
      const SVG_NS = 'http://www.w3.org/2000/svg';

      const graph = {
        wrap: null, sizer: null, canvas: null, svg: null,
        nodes: new Map(),   // id -> { el, path, parentId, x, y, o, from*, to*, leaving }
        targets: new Map(),
        zoom: 1, autoFit: true, fitMin: 0.65, width: 0, height: 0, anim: 0, focusId: null
      };

      // Folders first, then summaries, then loose documents; alphabetical within each group.
      function sortedChildren(folderNode) {
        const rank = (n) => (n.type === 'file' ? 2 : isSummary(n) ? 1 : 0);
        return [...folderNode.children].sort((a, b) => rank(a) - rank(b) || a.name.localeCompare(b.name));
      }

      function initGraph() {
        if (graph.wrap) return;
        graph.svg = document.createElementNS(SVG_NS, 'svg');
        graph.svg.setAttribute('class', 'graph-lines');
        graph.svg.setAttribute('aria-hidden', 'true');
        graph.canvas = el('div', { class: 'graph-canvas' });
        graph.canvas.appendChild(graph.svg);
        graph.sizer = el('div', { class: 'graph-sizer' }, graph.canvas);
        graph.wrap = el('div', { class: 'graph-wrap', role: 'tree', 'aria-label': 'Folders and documents as a graph' }, graph.sizer);
      }

      // Folders and summaries spread out sideways; the documents inside an opened folder or summary
      // are stacked in one column under it, so the graph stays readable as it grows.
      function layoutGraph() {
        const items = [];
        const widthOf = new Map();
        const partsOf = (n) => {
          if (!state.expanded.has(n.id)) return { branches: [], files: [] };
          // A section of a summary: the documents considered for it (the same document can sit in several sections).
          if (n.type === 'section') {
            return n.docs.length
              ? { branches: [], files: n.docs.map((f) => ({ id: n.id + '::' + f.id, type: 'file', ref: f, name: f.name })) }
              : { branches: [{ id: n.id + ':empty', type: 'ghost', name: 'no documents' }], files: [] };
          }
          // A summary opens into one folder per template section.
          if (isSummary(n)) {
            const groups = sectionGroups(n);
            const secs = [...SECTIONS, OTHER_SECTION].filter((sec) => sec.key !== 'other' || groups.get('other').length);
            return { branches: secs.map((sec) => ({ id: n.id + '::' + sec.key, type: 'section', name: sec.title, key: sec.key, summary: n, docs: groups.get(sec.key) })), files: [] };
          }
          if (n.type !== 'folder') return { branches: [], files: [] };
          const kids = sortedChildren(n);
          const branches = kids.filter((k) => k.type === 'folder');
          const files = kids.filter((k) => k.type === 'file');
          if (!kids.length) branches.push({ id: n.id + ':empty', type: 'ghost', name: 'empty folder' });
          return { branches, files };
        };
        const measure = (n) => {
          const { branches, files } = partsOf(n);
          const w = Math.max(1, branches.reduce((sum, c) => sum + measure(c), 0) + (files.length ? 1 : 0));
          widthOf.set(n.id, w);
          return w;
        };
        const column = (files, x, depth, parentId) => {
          const left = G.PAD + (x + 0.5) * G.SLOT - G.NODE_W / 2 + G.INDENT;
          files.forEach((f, i) => items.push({
            id: f.id, node: f, parentId, depth, stacked: true,
            tx: left, ty: G.PAD + depth * G.LEVEL + i * G.FILE_GAP, w: G.FILE_W, h: G.FILE_H
          }));
        };
        const place = (n, x0, depth, parentId) => {
          const w = widthOf.get(n.id);
          items.push({
            id: n.id, node: n, parentId, depth, stacked: false,
            tx: G.PAD + (x0 + w / 2) * G.SLOT - G.NODE_W / 2, ty: G.PAD + depth * G.LEVEL, w: G.NODE_W, h: G.NODE_H
          });
          const { branches, files } = partsOf(n);
          let x = x0;
          branches.forEach((c) => { place(c, x, depth + 1, n.id); x += widthOf.get(c.id); });
          if (files.length) column(files, x, depth + 1, n.id);
        };
        const top = sortedChildren(state.root);
        let x = 0;
        top.filter((n) => n.type === 'folder').forEach((n) => { measure(n); place(n, x, 0, null); x += widthOf.get(n.id); });
        const looseFiles = top.filter((n) => n.type === 'file');
        if (looseFiles.length) { column(looseFiles, x, 0, null); x += 1; }
        const bottom = items.reduce((m, it) => Math.max(m, it.ty + it.h), 0);
        return { items, width: 2 * G.PAD + Math.max(x, 1) * G.SLOT - (G.SLOT - G.NODE_W), height: bottom + G.PAD + 12 };
      }

      function createNodeEl() {
        const b = document.createElement('button');
        b.type = 'button';
        b.addEventListener('click', () => onGraphNodeClick(b.dataset.id, b.dataset.ref));
        return b;
      }

      function fillNodeEl(b, n) {
        b.dataset.id = n.id;
        if (n.ref) b.dataset.ref = n.ref.id; else delete b.dataset.ref;
        b.style.pointerEvents = '';
        b.removeAttribute('aria-hidden');
        b.replaceChildren();
        b.setAttribute('role', 'treeitem');
        if (n.type === 'ghost') {
          b.className = 'gnode ghost';
          b.disabled = true;
          b.tabIndex = -1;
          b.removeAttribute('aria-expanded');
          b.appendChild(el('span', { class: 'gnode-name', text: n.name }));
          return;
        }
        b.disabled = false;
        b.tabIndex = 0;
        if (n.type === 'section') {
          const open = state.expanded.has(n.id);
          const count = n.docs.length;
          b.className = 'gnode section' + (open ? ' open' : '');
          b.setAttribute('aria-expanded', String(open));
          b.title = `${n.name}: the ${count} document${count === 1 ? '' : 's'} considered for this part of the summary — click to ${open ? 'fold in' : 'show them'}.`;
          b.append(
            el('span', { class: 'gnode-icon', text: open ? '📂' : '📁' }),
            el('span', { class: 'gnode-text' }, [
              el('span', { class: 'gnode-name', text: n.name }),
              el('span', { class: 'gnode-meta', text: `${count} document${count === 1 ? '' : 's'}` })
            ]),
            el('span', { class: 'gnode-toggle', text: open ? '−' : '+' })
          );
        } else if (isSummary(n)) {
          const open = state.expanded.has(n.id);
          const a = analysis.get(n.id);
          const count = n.children.length;
          b.className = 'gnode summary' + (open ? ' open' : '') + (state.activeFileId === n.id ? ' selected' : '');
          b.setAttribute('aria-expanded', String(open));
          b.title = `${n.name} summary — click to read it; use ${open ? '−' : '+'} to ${open ? 'hide' : 'show'} its sections and ${count} source documents.`;
          const toggle = el('span', { class: 'gnode-toggle', title: `${open ? 'Hide' : 'Show'} the sections and their source documents`, text: open ? '−' : '+' });
          toggle.addEventListener('click', (e) => { e.stopPropagation(); toggleGraphNode(n.id); });
          b.append(
            el('span', { class: 'gnode-icon', text: '📋' }),
            el('span', { class: 'gnode-text' }, [
              el('span', { class: 'gnode-name', text: n.name }),
              el('span', { class: 'gnode-meta', text: `summary · ${count} source${count === 1 ? '' : 's'}` })
            ]),
            el('span', { class: `gnode-dot ${a.level}` }),
            toggle
          );
        } else if (n.type === 'folder') {
          const open = state.expanded.has(n.id);
          let files = 0; walk(n, (x) => { if (isDoc(x)) files++; });
          const items = n.children.length;
          b.className = 'gnode folder' + (open ? ' open' : '') + (state.currentFolderId === n.id ? ' selected' : '');
          b.setAttribute('aria-expanded', String(open));
          b.title = `${n.name} — click to ${open ? 'fold in' : 'open'}`;
          b.append(
            el('span', { class: 'gnode-icon', text: open ? '📂' : '📁' }),
            el('span', { class: 'gnode-text' }, [
              el('span', { class: 'gnode-name', text: n.name }),
              el('span', { class: 'gnode-meta', text: `${items} item${items === 1 ? '' : 's'} · ${files} document${files === 1 ? '' : 's'}` })
            ]),
            el('span', { class: 'gnode-toggle', text: open ? '−' : '+' })
          );
        } else {
          const f = n.ref || n;           // a document shown inside a section points at the real file
          const a = analysis.get(f.id);
          b.className = 'gnode file' + (state.activeFileId === f.id ? ' selected' : '');
          b.removeAttribute('aria-expanded');
          const when = f.updatedAt ? ' · ' + new Date(f.updatedAt).toLocaleDateString() : '';
          b.title = `${f.name}${f.owner ? ' · ' + f.owner : ''}${when} — ${LEVEL_LABEL[a.level]}. Click to read.`;
          b.append(
            el('span', { class: 'gnode-icon', text: '📄' }),
            el('span', { class: 'gnode-text' }, [
              el('span', { class: 'gnode-name', text: f.name.replace(/\.txt$/i, '') })
            ]),
            el('span', { class: `gnode-dot ${a.level}` })
          );
        }
      }

      function onGraphNodeClick(id, ref) {
        if (ref) return openViewer(ref);                 // a document inside a section
        if (id.includes('::')) return toggleGraphNode(id); // a section folder
        const found = findById(id);
        if (!found) return;
        if (isDoc(found.node)) return openViewer(id);   // documents and summaries open in the pop-up
        toggleGraphNode(id);
      }

      // Folds a node and everything below it (including the section folders of summaries inside it).
      function collapseGraphNode(id) {
        if (id.includes('::')) {
          [...state.expanded].forEach((e) => { if (e === id || e.startsWith(id + '::')) state.expanded.delete(e); });
          return;
        }
        const found = findById(id);
        if (!found) { state.expanded.delete(id); return; }
        const ids = new Set();
        walk(found.node, (x) => { if (x.type === 'folder') ids.add(x.id); });
        [...state.expanded].forEach((e) => { if (ids.has(e.split('::')[0])) state.expanded.delete(e); });
      }

      // Opens or folds a folder, summary or section in the graph and makes its folder the target for new files.
      function toggleGraphNode(id) {
        const baseId = id.split('::')[0];
        const found = findById(baseId);
        if (!found || found.node.type !== 'folder') return;
        if (state.expanded.has(id)) collapseGraphNode(id);
        else { state.expanded.add(id); graph.focusId = id; }
        state.currentFolderId = baseId;
        saveUiPrefs();
        renderNav();
        renderMain();
      }

      function setGraphSize(w, h) {
        graph.width = w;
        graph.height = h;
        graph.canvas.style.width = w + 'px';
        graph.canvas.style.height = h + 'px';
        graph.svg.setAttribute('width', w);
        graph.svg.setAttribute('height', h);
        applyZoom();
      }

      function applyZoom() {
        graph.canvas.style.transform = `scale(${graph.zoom})`;
        graph.sizer.style.width = graph.width * graph.zoom + 'px';
        graph.sizer.style.height = graph.height * graph.zoom + 'px';
        const label = document.getElementById('zoomLabel');
        if (label) label.textContent = Math.round(graph.zoom * 100) + '%';
      }

      function setZoom(z) {
        graph.zoom = Math.min(1.6, Math.max(0.3, Math.round(z * 100) / 100));
        applyZoom();
      }

      // Zoom that makes the whole graph fit the panel width (never above 100%, never below 65% so text stays readable).
      function fitZoom(width) {
        const avail = graph.wrap.clientWidth - 16;
        if (avail <= 0) return graph.zoom;
        return Math.min(1, Math.max(graph.fitMin, avail / Math.max(1, width)));
      }

      function drawGraphFrame() {
        graph.nodes.forEach((g) => {
          g.el.style.transform = `translate(${g.x}px, ${g.y}px)`;
          g.el.style.opacity = g.o;
        });
        graph.nodes.forEach((g) => {
          if (!g.path) return;
          const p = graph.nodes.get(g.parentId);
          if (!p) { g.path.setAttribute('d', ''); return; }
          const x1 = p.x + p.w / 2, y1 = p.y + p.h;
          if (g.stacked) {
            // Elbow: down from the parent, across to the column's spine, down, then into the document.
            const bus = y1 + (G.LEVEL - G.NODE_H) / 2;
            const spine = g.x - G.INDENT / 2 - 2;
            const cy = g.y + g.h / 2;
            g.path.setAttribute('d', `M${x1},${y1} V${bus} H${spine} V${cy} H${g.x}`);
          } else {
            const x2 = g.x + g.w / 2, y2 = g.y;
            const my = (y1 + y2) / 2;
            g.path.setAttribute('d', `M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`);
          }
          g.path.style.opacity = Math.min(g.o, p.o);
        });
      }

      function updateGraph() {
        const { items, width, height } = layoutGraph();
        const seen = new Set();
        graph.targets = new Map(items.map((it) => [it.id, it]));

        items.forEach((it) => {
          let g = graph.nodes.get(it.id);
          if (!g) {
            // New nodes spawn from their parent's current position.
            const parent = it.parentId && graph.nodes.get(it.parentId);
            g = { el: createNodeEl(), path: null, x: parent ? parent.x : it.tx, y: parent ? parent.y : it.ty, o: 0, w: it.w, h: it.h };
            graph.canvas.appendChild(g.el);
            graph.nodes.set(it.id, g);
          }
          g.leaving = false;
          g.parentId = it.parentId;
          g.stacked = it.stacked;
          g.w = it.w;
          g.h = it.h;
          if (g.parentId && !g.path) {
            g.path = document.createElementNS(SVG_NS, 'path');
            graph.svg.appendChild(g.path);
          } else if (!g.parentId && g.path) {
            g.path.remove();
            g.path = null;
          }
          Object.assign(g, { fromX: g.x, fromY: g.y, fromO: g.o, toX: it.tx, toY: it.ty, toO: 1 });
          fillNodeEl(g.el, it.node);
          seen.add(it.id);
        });

        // Nodes that disappear slide back into their nearest visible ancestor and fade out.
        graph.nodes.forEach((g, id) => {
          if (seen.has(id)) return;
          g.leaving = true;
          let anc = g.parentId;
          while (anc && !seen.has(anc)) { const a = graph.nodes.get(anc); anc = a ? a.parentId : null; }
          const t = anc ? graph.targets.get(anc) : null;
          Object.assign(g, { fromX: g.x, fromY: g.y, fromO: g.o, toX: t ? t.tx : g.x, toY: t ? t.ty : g.y, toO: 0 });
          g.el.tabIndex = -1;
          g.el.setAttribute('aria-hidden', 'true');
          g.el.style.pointerEvents = 'none';
        });

        setGraphSize(Math.max(width, graph.width), Math.max(height, graph.height));
        const fromZoom = graph.zoom;
        const toZoom = graph.autoFit ? fitZoom(width) : graph.zoom;
        graph.wrap.classList.add('animating');

        cancelAnimationFrame(graph.anim);
        const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const start = performance.now();
        const step = (now) => {
          const p = reduce ? 1 : Math.min(1, Math.max(0, now - start) / G.DURATION);
          const e = 1 - Math.pow(1 - p, 3);
          graph.nodes.forEach((g) => {
            g.x = g.fromX + (g.toX - g.fromX) * e;
            g.y = g.fromY + (g.toY - g.fromY) * e;
            g.o = g.fromO + (g.toO - g.fromO) * e;
          });
          graph.zoom = fromZoom + (toZoom - fromZoom) * e;
          applyZoom();
          drawGraphFrame();
          if (p < 1) { graph.anim = requestAnimationFrame(step); return; }
          graph.nodes.forEach((g, id) => {
            if (!g.leaving) return;
            g.el.remove();
            if (g.path) g.path.remove();
            graph.nodes.delete(id);
          });
          setGraphSize(width, height);
          graph.wrap.classList.remove('animating');
          ensureFocusVisible();
        };
        graph.anim = requestAnimationFrame(step);
      }

      // After opening a folder, scroll so the folder and its new children are in view.
      function ensureFocusVisible() {
        const id = graph.focusId;
        graph.focusId = null;
        if (!id || !graph.targets.has(id)) return;
        const group = [...graph.targets.values()].filter((t) => t.id === id || t.parentId === id);
        const z = graph.zoom;
        const left = Math.min(...group.map((t) => t.tx)) * z - 12;
        const right = Math.max(...group.map((t) => t.tx + t.w)) * z + 12;
        const bottom = Math.max(...group.map((t) => t.ty + t.h)) * z + 24;
        const w = graph.wrap;
        const offset = Math.max(0, (w.clientWidth - graph.width * z) / 2);
        let sl = w.scrollLeft, st = w.scrollTop;
        if (right + offset > sl + w.clientWidth) sl = right + offset - w.clientWidth;
        if (left + offset < sl) sl = left + offset;
        if (bottom > st + w.clientHeight) st = bottom - w.clientHeight;
        w.scrollTo({ left: sl, top: st, behavior: 'smooth' });
      }

      function renderGraph(body, keepScroll) {
        initGraph();
        const target = findById(state.currentFolderId);
        body.appendChild(el('div', { class: 'target-hint' }, [
          'New files & imports go to ',
          el('strong', { text: target && target.node.id !== state.root.id ? pathLabel([...target.path.slice(1), target.node]) : 'My Drive (top level)' }),
          ' — click a folder to open it and choose it.'
        ]));
        const files = allFiles();
        const docs = allDocs();
        const attention = docs.filter(({ node }) => analysis.get(node.id).level === 'bad').length;
        const conflicts = files.filter(({ node }) => analysis.get(node.id).conflicts.length).length;
        const chip = (n, label, tone) => el('span', { class: 'chip' + (tone ? ' ' + tone : '') }, [el('strong', { text: String(n) }), ' ' + label]);
        body.appendChild(el('div', { class: 'chips' }, [
          chip(docs.length - files.length, 'summaries'),
          chip(files.length, 'source documents'),
          chip(attention, 'need attention', attention ? 'warn' : ''),
          chip(conflicts, 'sources in conflict', conflicts ? 'bad' : '')
        ]));
        const zoomBtn = (text, title, fn) => el('button', { class: 'secondary-btn small-btn', type: 'button', title, text, onclick: fn });
        body.appendChild(el('div', { class: 'graph-toolbar' }, [
          el('div', { class: 'group' }, [
            zoomBtn('Open all', 'Open every folder', () => { walk(state.root, (x) => { if (x.type === 'folder' && x !== state.root) state.expanded.add(x.id); }); saveUiPrefs(); renderMain(); }),
            zoomBtn('Fold all', 'Fold every folder', () => { state.expanded.clear(); saveUiPrefs(); renderMain(); })
          ]),
          el('div', { class: 'group zoom' }, [
            zoomBtn('−', 'Zoom out', () => { graph.autoFit = false; graph.fitMin = 0.65; setZoom(graph.zoom - 0.1); }),
            el('span', { class: 'zoom-label', id: 'zoomLabel', text: Math.round(graph.zoom * 100) + '%' }),
            zoomBtn('+', 'Zoom in', () => { graph.autoFit = false; graph.fitMin = 0.65; setZoom(graph.zoom + 0.1); }),
            zoomBtn('Fit', 'Zoom out until the whole graph fits (and keep fitting as it grows)', () => { graph.autoFit = true; graph.fitMin = 0.4; setZoom(fitZoom(graph.width)); })
          ])
        ]));
        body.appendChild(graph.wrap);
        if (keepScroll) { graph.wrap.scrollLeft = keepScroll[0]; graph.wrap.scrollTop = keepScroll[1]; }
        updateGraph();
      }

      // Shows a document. A summary is laid out like the template; clicking a section lists the documents considered.
      function renderDocBody(target, node) {
        target.replaceChildren();
        target.classList.toggle('as-card', isSummary(node));
        const text = docText(node);
        if (!text) { target.textContent = '(empty document)'; return; }
        if (!isSummary(node)) { target.textContent = text; return; }
        target.appendChild(renderSummaryCard(node));
      }

      const docTime = (f) => (f.updatedAt ? Date.parse(f.updatedAt) : 0);
      const fmtDate = (iso) => (iso ? new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) : 'no date');

      function renderSummaryCard(node) {
        const p = parseSummary(node.summary);
        const groups = sectionGroups(node);
        const card = el('div', { class: 'policy' }, [
          el('h2', { class: 'policy-title', text: p.title || node.name }),
          p.subtitle ? el('div', { class: 'policy-sub', text: p.subtitle }) : null,
          p.effective ? el('div', { class: 'policy-effective', text: p.effective }) : null,
          el('div', { class: 'policy-hint', text: 'Click a section to see which documents it was taken from.' })
        ]);
        p.sections.forEach((sec) => {
          const docs = groups.get(sec.key) || [];
          const panel = el('div', { class: 'considered hidden' });
          const head = el('button', { class: 'policy-head', type: 'button', 'aria-expanded': 'false' }, [
            el('span', { class: 'policy-h' }, [sec.title, el('span', { class: 'policy-count', text: `${docs.length} document${docs.length === 1 ? '' : 's'} considered ▾` })]),
            el('span', { class: 'policy-val', text: sec.value }),
            ...sec.details.map((dt) => el('span', { class: 'policy-det', text: dt }))
          ]);
          head.addEventListener('click', () => {
            const open = panel.classList.contains('hidden');
            if (open && !panel.childNodes.length) panel.appendChild(buildConsidered(node, sec, docs));
            panel.classList.toggle('hidden', !open);
            head.setAttribute('aria-expanded', String(open));
            head.classList.toggle('open', open);
          });
          card.appendChild(el('div', { class: 'policy-section' }, [head, panel]));
        });
        if (p.extra.length) card.appendChild(el('p', { class: 'policy-det', text: p.extra.join(' ') }));
        const compiled = p.footer.find((f) => /compiled/i.test(f.label));
        card.appendChild(el('div', { class: 'policy-footer' }, p.footer.filter((f) => f !== compiled).map((f) => el('div', {}, [el('strong', { text: f.label + ': ' }), f.value]))));
        if (compiled) card.appendChild(el('div', { class: 'policy-compiled', text: 'Summary compiled: ' + compiled.value }));
        return card;
      }

      // The sentences of a document that talk about a section, e.g. the lines about overtime.
      function relevantLines(fileNode, re) {
        const out = [];
        fileNode.content.split(/\r?\n/).forEach((line) => {
          if (HEADER_LINE.test(line) || /^subject\s*:/i.test(line)) return;
          line.split(/(?<=[.!?])\s+/).forEach((sentence) => { if (re.test(sentence) && out.length < 2) out.push(sentence.trim()); });
        });
        return out;
      }

      // "Documents considered" for one section: the one(s) used first, then the others newest first, with the reason.
      function buildConsidered(summaryNode, sec, docs) {
        const def = SECTIONS.find((x) => x.key === sec.key);
        const isUsed = (f) => sec.sources.some((n) => n.toLowerCase() === f.name.toLowerCase());
        const newestUsed = docs.filter(isUsed).reduce((m, f) => Math.max(m, docTime(f)), 0);
        const sorted = [...docs].sort((a, b) => isUsed(b) - isUsed(a) || docTime(b) - docTime(a));
        const wrap = el('div', {}, [el('div', { class: 'considered-intro', text: docs.length
          ? `Documents about ${sec.title.toLowerCase()} in ${summaryNode.name}. When they disagree, the most recent approved information is used.`
          : 'No source document mentions this section.' })]);
        sorted.forEach((f) => {
          const used = isUsed(f);
          let tag, tone;
          if (used) { tag = '✓ Used'; tone = 'good'; }
          else if (f.status === 'outdated') { tag = 'Not used · superseded'; tone = 'muted'; }
          else if (f.proposal) { tag = 'Not used · draft proposal'; tone = 'muted'; }
          else if (docTime(f) > newestUsed) { tag = '⚠ Not used · newer than the one used'; tone = 'bad'; }
          else { tag = 'Not used · older'; tone = 'muted'; }
          const quotes = relevantLines(f, def ? def.re : /./);
          wrap.appendChild(el('div', { class: 'considered-doc' + (used ? ' used' : '') }, [
            el('div', { class: 'considered-top' }, [
              el('button', { class: 'link-btn', type: 'button', text: f.name, onclick: () => openViewer(f.id) }),
              el('span', { class: 'considered-tag ' + tone, text: tag })
            ]),
            el('div', { class: 'considered-meta', text: [fmtDate(f.updatedAt), f.status === 'verified' ? 'approved' : f.status === 'outdated' ? 'superseded' : f.proposal ? 'draft' : 'unverified', f.owner].filter(Boolean).join(' · ') }),
            ...quotes.map((q) => el('div', { class: 'considered-quote', text: '“' + q + '”' }))
          ]));
        });
        return wrap;
      }

      function openViewer(id) {
        const found = findById(id);
        if (!found || !isDoc(found.node)) return;
        const n = found.node;
        const a = analysis.get(n.id);
        const parent = found.path[found.path.length - 1];
        $('viewerTitle').textContent = isSummary(n) ? `📋 Summary · ${pathLabel(found.path.slice(1)) || n.name}` : docTitle(n);
        $('viewerScore').replaceChildren(scoreBadge(n));
        const info = $('viewerPath');
        info.replaceChildren('Applies to: ' + (pathLabel(found.path.slice(1)) || 'My Drive') + (n.owner ? ` · owner: ${n.owner}` : ''));
        if (isSummary(parent)) {
          info.append(' · ', el('button', { class: 'link-btn', type: 'button', text: `← back to the ${parent.name} summary`, onclick: () => openViewer(parent.id) }));
        }
        $('viewerTrust').replaceChildren(buildTrustBox(a, openViewer));
        renderDocBody($('viewerBody'), n);
        $('viewerBody').scrollTop = 0;
        const sourcesBtn = $('viewerSources');
        sourcesBtn.classList.toggle('hidden', !isSummary(n));
        if (isSummary(n)) {
          sourcesBtn.textContent = `📂 Open as folder (${n.children.length} source${n.children.length === 1 ? '' : 's'}, by section)`;
          sourcesBtn.onclick = () => { closeViewer(); openFolder(n.id); };
        }
        $('viewerEdit').onclick = () => {
          closeViewer();
          openFile(n.id);
          const ta = document.querySelector('#editor textarea');
          if (ta) { $('editor').scrollIntoView({ behavior: 'smooth', block: 'start' }); ta.focus({ preventScroll: true }); }
        };
        $('viewer').classList.remove('hidden');
        $('viewerClose').focus();
      }

      function closeViewer() { $('viewer').classList.add('hidden'); }

      $('viewerClose').addEventListener('click', closeViewer);
      $('viewer').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeViewer(); });

      $('viewToggle').addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-layout]');
        if (!btn) return;
        state.layout = btn.dataset.layout;
        state.view = 'folder';
        $('searchInput').value = '';
        state.query = '';
        saveUiPrefs();
        renderNav();
        renderMain();
      });

      function renderEditor() {
        updateLayoutClass();
        const ed = $('editor');
        const found = state.activeFileId && findById(state.activeFileId);
        ed.innerHTML = '';
        if (!found) {
          state.activeFileId = null;
          const files = allFiles();
          const docs = allDocs();
          const summaries = docs.length - files.length;
          const attention = docs.filter(({ node }) => analysis.get(node.id).level === 'bad').length;
          const conflicts = files.filter(({ node }) => analysis.get(node.id).conflicts.length).length;
          ed.appendChild(el('div', { class: 'editor-header' }, el('h3', { text: 'Overview' })));
          ed.appendChild(el('div', { class: 'stats' }, [
            stat(summaries, summaries === 1 ? 'summary' : 'summaries'),
            stat(files.length, 'source documents'),
            stat(attention, 'need attention', attention ? 'warn' : ''),
            stat(conflicts, 'sources in conflict', conflicts ? 'bad' : '')
          ]));
          ed.appendChild(el('div', { class: 'editor-placeholder' }, [
            el('strong', { text: 'How to use' }),
            el('ul', { class: 'howto' }, [
              el('li', { text: 'Click a folder to open it; click a 📋 summary to read it.' }),
              el('li', { text: 'In a summary, click a section to see every document it was based on, and which one was used.' }),
              el('li', { text: 'The + on a summary (or “Open as folder”) shows a folder per section with its source documents.' }),
              el('li', { text: 'Search ( / ) looks through every company and country at once; summaries come first.' }),
              el('li', { text: 'Sources that give different numbers for the same thing are flagged as conflicts.' })
            ])
          ]));
          return;
        }

        const f = found.node;
        const a = analysis.get(f.id);
        const summary = isSummary(f);

        ed.appendChild(el('div', { class: 'editor-header' }, [
          el('h3', { text: (summary ? '📋 ' : '') + docTitle(f) }),
          scoreBadge(f)
        ]));
        const parent = found.path[found.path.length - 1];
        const pathLine = el('div', { class: 'editor-path', text: 'Applies to: ' + (pathLabel(found.path.slice(1)) || 'My Drive (no company / country)') });
        if (isSummary(parent)) pathLine.append(' · ', el('button', { class: 'link-btn', type: 'button', text: `source of the ${parent.name} summary`, onclick: () => openFile(parent.id) }));
        ed.appendChild(pathLine);

        const trustSlot = el('div', {}, buildTrustBox(a, openFile));
        ed.appendChild(trustSlot);

        // Metadata
        const ownerInput = el('input', { type: 'text', value: f.owner || '', maxlength: '80', placeholder: 'e.g. Payroll team' });
        const statusLabels = { draft: 'Unverified / draft', verified: 'Verified', outdated: 'Outdated' };
        const statusSelect = el('select', {}, ['draft', 'verified', 'outdated'].map((st) => {
          const o = el('option', { value: st, text: statusLabels[st] });
          if (f.status === st) o.selected = true;
          return o;
        }));
        const fmt = (iso, none = 'never') => (iso ? new Date(iso).toLocaleDateString() : none);
        ed.appendChild(el('div', { class: 'meta-grid' }, [
          el('label', {}, ['Owner / expert', ownerInput]),
          el('label', {}, ['Status', statusSelect]),
          el('div', { class: 'meta-line', text: `Last updated: ${fmt(f.updatedAt, 'unknown')} · Last reviewed: ${fmt(f.reviewedAt)}` + (summary ? ` · ${f.children.length} sources` : '') })
        ]));

        const commitMeta = () => {
          f.owner = ownerInput.value.trim().slice(0, 80);
          f.status = statusSelect.value;
          if (f.status === 'verified') f.reviewedAt = now();
          saveState();
          render();
        };
        ownerInput.addEventListener('change', commitMeta);
        statusSelect.addEventListener('change', commitMeta);

        // Content
        const textarea = el('textarea', { 'aria-label': summary ? 'Summary editor' : 'Document editor' });
        textarea.value = docText(f);
        const status = el('span', { class: 'status-msg', text: '' });
        textarea.addEventListener('input', () => { state.dirty = true; status.textContent = 'Unsaved changes'; });
        ed.appendChild(textarea);

        const save = () => {
          if (docText(f) !== textarea.value) {
            if (summary) f.summary = textarea.value;
            else { f.content = textarea.value; f.changedAt = now(); }
            f.updatedAt = now();
          }
          state.dirty = false;
          status.textContent = saveState() ? 'Saved ✓' : 'Could not save (browser storage full?)';
          analysis = analyzeAll();
          trustSlot.replaceChildren(buildTrustBox(analysis.get(f.id), openFile));
          renderNav();
          renderMain();
        };
        state.saveActive = save;

        const leftButtons = [
          el('button', { class: 'secondary-btn small-btn', text: 'Mark reviewed', title: 'I checked this and it is still correct', onclick: () => { save(); f.reviewedAt = now(); if (f.status === 'draft') f.status = 'verified'; saveState(); render(); } }),
          el('button', { class: 'secondary-btn small-btn', text: 'Rename', onclick: () => renameItem(f.id) }),
          el('button', { class: 'danger-btn small-btn', text: 'Delete', onclick: () => deleteItem(f.id) })
        ];
        if (summary) leftButtons.unshift(el('button', { class: 'secondary-btn small-btn', text: `📂 Open as folder (${f.children.length})`, onclick: () => openFolder(f.id) }));
        ed.appendChild(el('div', { class: 'save-row' }, [
          el('div', { class: 'group' }, leftButtons),
          el('div', { class: 'group' }, [
            status,
            el('button', { class: 'secondary-btn small-btn', text: 'Save to computer', onclick: async () => { save(); await saveTextFileToComputer(summary ? 'SUMMARY.txt' : f.name, docText(f)); } }),
            el('button', { class: 'primary-btn small-btn', text: 'Save', onclick: save })
          ])
        ]));
      }

      /* ---------- Navigation ---------- */

      function confirmLeave() {
        if (!state.dirty) return true;
        return window.confirm('You have unsaved changes in this file. Discard them?');
      }

      function openFolder(id) {
        if (!confirmLeave()) return;
        state.dirty = false;
        state.view = 'folder';
        state.currentFolderId = id;
        state.activeFileId = null;
        if (state.layout === 'graph') {
          // In the graph, "opening" a folder means unfolding it (and everything above it).
          const found = findById(id);
          if (found) { found.path.forEach((p) => state.expanded.add(p.id)); state.expanded.add(id); graph.focusId = id; saveUiPrefs(); }
        }
        $('searchInput').value = '';
        state.query = '';
        render();
      }

      function openFile(id) {
        if (id !== state.activeFileId && !confirmLeave()) return;
        state.dirty = false;
        state.activeFileId = id;
        renderMain();
        renderEditor();
      }

      /* ---------- Search ---------- */

      function searchFiles(query) {
        const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
        if (!terms.length) return [];
        const out = [];
        allDocs().forEach(({ node, path }) => {
          const name = node.name.toLowerCase();
          const text = docText(node).toLowerCase();
          const where = path.map((p) => p.name).join(' ').toLowerCase();
          let score = 0;
          for (const t of terms) {
            const inName = name.includes(t), inWhere = where.includes(t);
            let count = 0, i = text.indexOf(t);
            while (i !== -1 && count < 50) { count++; i = text.indexOf(t, i + t.length); }
            if (!inName && !inWhere && !count) return; // every term must match somewhere
            score += (inName ? 5 : 0) + (inWhere ? 3 : 0) + count;
          }
          const level = analysis.get(node.id).level;
          score += level === 'good' ? 2 : level === 'warn' ? 0.5 : 0; // trusted documents float up
          if (isSummary(node)) score += 4;                            // the summary is usually the best answer
          if (node.status === 'outdated') score -= 3;                 // superseded documents sink
          out.push({ node, path, score, snippet: makeSnippet(docText(node), terms) });
        });
        return out.sort((a, b) => b.score - a.score);
      }

      function makeSnippet(content, terms) {
        const lower = content.toLowerCase();
        let pos = -1;
        for (const t of terms) { pos = lower.indexOf(t); if (pos !== -1) break; }
        const start = Math.max(0, pos - 60);
        const text = (start > 0 ? '…' : '') + content.slice(start, start + 200).replace(/\s+/g, ' ') + (content.length > start + 200 ? '…' : '');
        const div = el('div', { class: 'result-snippet' });
        const escaped = terms.map((t) => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
        const re = new RegExp('(' + escaped.join('|') + ')', 'gi');
        text.split(re).forEach((part, i) => div.appendChild(i % 2 ? el('mark', { text: part }) : document.createTextNode(part)));
        return div;
      }

      let searchTimer;
      $('searchInput').addEventListener('input', (e) => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          state.query = e.target.value.trim();
          state.view = state.query ? 'search' : 'folder';
          renderNav();
          renderMain();
        }, 120);
      });

      /* ---------- Create / rename / delete (modal) ---------- */

      function showModal({ title, text, input, confirmLabel, danger, validate, onConfirm, hideCancel }) {
        $('modalCancel').classList.toggle('hidden', !!hideCancel);
        const modal = $('modal');
        const inputEl = $('modalInput');
        const confirmBtn = $('modalConfirm');
        $('modalTitle').textContent = title;
        $('modalText').textContent = text || '';
        $('modalText').classList.toggle('hidden', !text);
        $('modalError').textContent = '';
        inputEl.classList.toggle('hidden', !input);
        inputEl.value = input ? input.value || '' : '';
        inputEl.placeholder = input ? input.placeholder || '' : '';
        confirmBtn.textContent = confirmLabel || 'OK';
        confirmBtn.className = danger ? 'danger-btn' : 'primary-btn';
        modal.classList.remove('hidden');
        (input ? inputEl : confirmBtn).focus();
        if (input) inputEl.select();

        const close = () => modal.classList.add('hidden');
        const finish = () => {
          const value = inputEl.value.trim();
          const err = validate ? validate(value) : '';
          if (err) { $('modalError').textContent = err; return; }
          close();
          onConfirm(value);
        };
        confirmBtn.onclick = finish;
        inputEl.onkeydown = (e) => { if (e.key === 'Enter') finish(); };
        $('modalCancel').onclick = close;
        modal.onclick = (e) => { if (e.target === modal) close(); };
      }

      function createItem(type) {
        if (state.view !== 'folder') openFolder(state.currentFolderId);
        const parent = currentFolder();
        showModal({
          title: type === 'folder' ? 'Create folder' : 'Create file',
          input: { placeholder: type === 'folder' ? 'Folder name' : 'File name (e.g. holiday-policy.txt)' },
          confirmLabel: 'Create',
          validate: (v) => {
            const name = type === 'file' && v && !/\.txt$/i.test(v) ? v + '.txt' : v;
            return validateName(v) || (nameTaken(parent, name) ? 'Something with that name already exists here.' : '');
          },
          onConfirm: (v) => {
            if (type === 'folder') parent.children.push(folder(v));
            else {
              const f = file(/\.txt$/i.test(v) ? v : v + '.txt', '', { changedAt: now() });
              parent.children.push(f);
              state.activeFileId = f.id;
            }
            saveState();
            render();
          }
        });
      }

      function renameItem(id) {
        const found = findById(id);
        if (!found || id === state.root.id) return;
        const parent = found.path[found.path.length - 1];
        showModal({
          title: 'Rename',
          input: { value: found.node.name },
          confirmLabel: 'Rename',
          validate: (v) => validateName(v) || (nameTaken(parent, v, id) ? 'Something with that name already exists here.' : ''),
          onConfirm: (v) => { found.node.name = v; saveState(); render(); }
        });
      }

      function deleteItem(id) {
        const found = findById(id);
        if (!found || id === state.root.id) return;
        const parent = found.path[found.path.length - 1];
        let n = 0; walk(found.node, (x) => { if (x !== found.node && isDoc(x)) n++; });
        const what = isSummary(found.node) ? `the summary and its ${n} source document${n === 1 ? '' : 's'}`
          : found.node.type === 'folder' ? `the folder and the ${n} document${n === 1 ? '' : 's'} inside it` : 'this document';
        showModal({
          title: `Delete “${found.node.name}”?`,
          text: `This removes ${what} from the knowledge base. Files on your computer are not touched.`,
          confirmLabel: 'Delete',
          danger: true,
          onConfirm: () => {
            parent.children = parent.children.filter((c) => c.id !== id);
            if (found.node.type === 'folder' && (state.currentFolderId === id || !findById(state.currentFolderId))) state.currentFolderId = parent.id;
            if (!findById(state.activeFileId)) { state.activeFileId = null; state.dirty = false; }
            saveState();
            render();
          }
        });
      }

      /* ---------- Import ---------- */

      async function importFiles(fileList, targetFolder, keepFolders) {
        let added = 0, skipped = 0, lastId = null;
        for (const f of Array.from(fileList)) {
          const isTxt = /\.txt$/i.test(f.name) && (!f.type || f.type.startsWith('text/'));
          if (!isTxt || f.size > MAX_IMPORT_BYTES) { skipped++; continue; }
          let parent = targetFolder;
          if (keepFolders && f.webkitRelativePath) {
            const parts = f.webkitRelativePath.split('/').slice(0, -1).filter((p) => p && !p.startsWith('.'));
            for (const part of parts) {
              let next = parent.children.find((c) => c.type === 'folder' && c.name.toLowerCase() === part.toLowerCase());
              if (!next) { next = folder(part); parent.children.push(next); }
              parent = next;
            }
          }
          const content = await f.text();
          const isSummaryFile = f.name.toLowerCase() === 'summary.txt' && parent !== state.root;
          if (isSummaryFile && parent.summary === content) { skipped++; continue; }
          const existing = parent.children.find((c) => c.type === 'file' && c.name.toLowerCase() === f.name.toLowerCase());
          if (!isSummaryFile && existing && existing.content === content) { skipped++; continue; } // already imported, unchanged
          const modified = f.lastModified ? new Date(f.lastModified).toISOString() : now();
          // Single files added by hand count as new material (a summary above them may now be out of date);
          // a whole imported folder is taken as it is on disk.
          const extra = { createdAt: modified, updatedAt: modified, ...(keepFolders ? {} : { changedAt: now() }) };
          const res = addTextFile(parent, f.name, content, { allowSummary: parent !== state.root, extra });
          lastId = res.node.id;
          added++;
        }
        saveState();
        if (added === 1 && !keepFolders) state.activeFileId = lastId;
        state.view = 'folder';
        render();
        showModal({
          title: 'Import finished',
          text: `${added} file${added === 1 ? '' : 's'} added.` + (skipped ? ` ${skipped} skipped (not .txt, too large, or already imported).` : ''),
          confirmLabel: 'OK',
          hideCancel: true,
          onConfirm: () => {}
        });
      }

      $('importFilesBtn').addEventListener('click', () => $('fileInput').click());
      $('importFolderBtn').addEventListener('click', () => $('folderInput').click());
      $('fileInput').addEventListener('change', (e) => { importFiles(e.target.files, currentFolder(), false); e.target.value = ''; });
      $('folderInput').addEventListener('change', (e) => {
        const picked = Array.from(e.target.files);
        e.target.value = '';
        if (!picked.length) return;
        // If the picked folder contains the same top-level folders as the drive (e.g. "Company A"),
        // it is a copy of the whole knowledge base: merge it into the top level.
        // Otherwise import it as a new sub-folder of the selected folder.
        const topNames = new Set(state.root.children.filter((c) => c.type === 'folder').map((c) => c.name.toLowerCase()));
        const isWholeDrive = picked.some((f) => {
          const parts = f.webkitRelativePath.split('/');
          return parts.length > 2 && topNames.has(parts[1].toLowerCase());
        });
        const files = picked.map((f) => {
          const rel = isWholeDrive ? f.webkitRelativePath.split('/').slice(1).join('/') : f.webkitRelativePath;
          Object.defineProperty(f, 'webkitRelativePath', { value: rel });
          return f;
        });
        importFiles(files, isWholeDrive ? state.root : currentFolder(), true);
      });

      const main = $('main');
      main.addEventListener('dragover', (e) => { if (state.view === 'folder') { e.preventDefault(); main.classList.add('dragging'); } });
      main.addEventListener('dragleave', (e) => { if (!main.contains(e.relatedTarget)) main.classList.remove('dragging'); });
      main.addEventListener('drop', (e) => {
        main.classList.remove('dragging');
        if (state.view !== 'folder' || !e.dataTransfer.files.length) return;
        e.preventDefault();
        importFiles(e.dataTransfer.files, currentFolder(), false);
      });

      function addFolderDropTarget(card, folderId) {
        card.addEventListener('dragover', (e) => { e.preventDefault(); e.stopPropagation(); card.classList.add('drop-target'); });
        card.addEventListener('dragleave', () => card.classList.remove('drop-target'));
        card.addEventListener('drop', (e) => {
          e.preventDefault(); e.stopPropagation();
          card.classList.remove('drop-target');
          main.classList.remove('dragging');
          const target = findById(folderId);
          if (target && e.dataTransfer.files.length) importFiles(e.dataTransfer.files, target.node, false);
        });
      }

      /* ---------- Export ---------- */

      async function saveTextFileToComputer(fileName, content) {
        const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
        if (typeof window.showSaveFilePicker === 'function') {
          try {
            const handle = await window.showSaveFilePicker({ suggestedName: fileName, types: [{ description: 'Text files', accept: { 'text/plain': ['.txt'] } }] });
