        if (state.layout === 'graph') box.appendChild(el('span', { class: 'status-msg', text: `Selected: ${cur.name}${isSummary(cur) ? ' (summary)' : ''}` }));
        if (isSummary(cur) && state.layout === 'grid') box.appendChild(el('button', { class: 'primary-btn small-btn', text: 'Read summary', onclick: () => openFile(cur.id) }));
        box.appendChild(el('button', { class: 'secondary-btn small-btn', text: `Rename ${kind}`, onclick: () => renameItem(state.currentFolderId) }));
        box.appendChild(el('button', { class: 'danger-btn small-btn', text: `Delete ${kind}`, onclick: () => deleteItem(state.currentFolderId) }));
      }

      // In the graph view the right-hand panel only appears while a document is open for editing,
      // so the graph gets the full width.
      function updateLayoutClass() {
        const wide = state.layout === 'graph' && state.view === 'folder' && !state.activeFileId;
        const content = $('content');
        if (content.classList.contains('graph-wide') === wide) return;
        content.classList.toggle('graph-wide', wide);
        if (graph.wrap && graph.wrap.isConnected && graph.autoFit) setZoom(fitZoom(graph.width));
      }

      function renderMain() {
        updateLayoutClass();
        renderBreadcrumbs();
        renderFolderActions();
        const body = $('mainBody');
        const keepScroll = graph.wrap && graph.wrap.isConnected ? [graph.wrap.scrollLeft, graph.wrap.scrollTop] : null;
        body.innerHTML = '';
        $('dropHint').classList.toggle('hidden', state.view !== 'folder' || state.layout === 'graph');
        $('viewToggle').querySelectorAll('button').forEach((b) => b.classList.toggle('on', state.view === 'folder' && b.dataset.layout === state.layout));

        if (state.view === 'search') return renderResults(body, searchFiles(state.query), 'No documents match your search.');
        if (state.view === 'attention') {
          // Only real problems: contradicted, superseded, or summaries whose sources changed since.
          const list = allDocs()
            .filter(({ node }) => analysis.get(node.id).level === 'bad')
            .sort((a, b) => (isSummary(b.node) - isSummary(a.node)) || pathLabel(a.path).localeCompare(pathLabel(b.path)))
            .map((f) => ({ ...f, snippet: null }));
          body.appendChild(el('p', { class: 'target-hint', text: 'Documents that contradict another document, are marked outdated, or summaries whose sources changed after they were written.' }));
          return renderResults(body, list, 'Nothing needs attention — no conflicts, outdated documents or stale summaries.');
        }

        if (state.layout === 'graph') return renderGraph(body, keepScroll);

        const folderNode = currentFolder();
        if (isSummary(folderNode)) {
          body.appendChild(el('div', { class: 'source-banner' }, [
            el('span', { text: folderNode.trustedPolicy ? `✓ These are the ${folderNode.children.length} original policy versions used to build the trusted “${folderNode.name}” view.` : `📋 These are the ${folderNode.children.length} source document${folderNode.children.length === 1 ? '' : 's'} behind the “${folderNode.name}” summary.` }),
            el('button', { class: 'link-btn', type: 'button', text: folderNode.trustedPolicy ? 'Open trusted version' : 'Read the summary', onclick: () => openFile(folderNode.id) })
          ]));
        }
        const grid = el('div', { class: 'grid' });
        if (!folderNode.children.length) {
          grid.appendChild(el('div', { class: 'empty-state', text: 'This folder is empty. Create a file, import .txt files, or drag them here.' }));
        }
        sortedChildren(folderNode).forEach((item) => {
          const summary = isSummary(item);
          const card = el('div', { class: `item-card ${summary ? 'summary' : item.type}` + (item.id === state.activeFileId ? ' selected' : ''), tabindex: '0' });
          if (isDoc(item)) {
            const a = analysis.get(item.id);
            card.appendChild(el('span', { class: `dot ${a.level}`, title: LEVEL_LABEL[a.level] }));
          }
          card.appendChild(el('div', { class: 'item-icon', text: summary ? '📋' : item.type === 'folder' ? '📁' : '📄' }));
          card.appendChild(el('div', { class: 'item-name', text: item.name }));
          if (summary) {
            const n = item.children.length;
            card.appendChild(el('div', { class: 'item-sub', text: item.trustedPolicy ? `trusted policy · ${n} version${n === 1 ? '' : 's'}` : `summary · ${n} source${n === 1 ? '' : 's'}` }));
          } else if (item.type === 'folder') {
            let n = 0; walk(item, (x) => { if (isDoc(x)) n++; });
            card.appendChild(el('div', { class: 'item-sub', text: `${n} document${n === 1 ? '' : 's'}` }));
          } else {
            card.appendChild(el('div', { class: 'item-sub', text: item.owner || 'no owner' }));
          }
          const open = () => (isDoc(item) ? openFile(item.id) : openFolder(item.id));
          card.addEventListener('click', open);
          card.addEventListener('keydown', (e) => { if (e.key === 'Enter') open(); });
          if (item.type === 'folder') addFolderDropTarget(card, item.id);
          grid.appendChild(card);
        });
        body.appendChild(grid);
      }

      function renderResults(body, list, emptyText) {
        if (!list.length) { body.appendChild(el('div', { class: 'empty-state', text: emptyText })); return; }
        const wrap = el('div', { class: 'result-list' });
        list.forEach(({ node, path, snippet }) => {
          const a = analysis.get(node.id);
          const card = el('div', { class: 'result', tabindex: '0', onclick: () => openFile(node.id) });
          card.appendChild(el('div', { class: 'result-top' }, [
            el('span', { class: 'result-name', text: (isSummary(node) ? '📋 ' : '📄 ') + docTitle(node) }),
            scoreBadge(node)
          ]));
          card.appendChild(el('div', { class: 'result-path', text: pathLabel(path) + (node.owner ? ` · owner: ${node.owner}` : '') }));
          if (snippet) card.appendChild(snippet);
          const issues = [...a.issues, ...a.conflicts.map((c) => `Says ${c.mineValue}, but ${fileLabel(c.otherId)} says ${c.theirValue}.`)];
          if (issues.length) card.appendChild(el('ul', { class: 'result-issues' }, issues.slice(0, 4).map((t) => el('li', { text: t }))));
          card.addEventListener('keydown', (e) => { if (e.key === 'Enter') openFile(node.id); });
          wrap.appendChild(card);
        });
        body.appendChild(wrap);
      }

      function fileLabel(id) {
        const f = findById(id);
        return f ? `${f.node.name} (${pathLabel(f.path.slice(1)) || 'My Drive'})` : 'another file';
      }

      function stat(value, label, tone = '') {
        return el('div', { class: 'stat' + (tone ? ' ' + tone : '') }, [
          el('div', { class: 'stat-value', text: String(value) }),
          el('div', { class: 'stat-label', text: label })
        ]);
      }

      function buildTrustBox(a, onOpenOther) {
        const items = a.issues.map((t) => el('li', { text: t }));
        a.conflicts.forEach((c) => {
          const other = findById(c.otherId);
          const o = other && other.node;
          const otherInfo = o ? [o.status === 'outdated' ? 'marked outdated' : o.status === 'verified' ? 'verified' : 'unverified',
            o.updatedAt ? 'dated ' + new Date(o.updatedAt).toLocaleDateString() : null].filter(Boolean).join(', ') : '';
          items.push(el('li', { class: 'conflict' }, [
            el('strong', { text: `Says ${c.mineValue}, ` }),
            'but ',
            el('button', { class: 'link-btn', type: 'button', text: fileLabel(c.otherId), onclick: () => onOpenOther(c.otherId) }),
            otherInfo ? ` (${otherInfo})` : '',
            el('strong', { text: ` says ${c.theirValue}.` }),
            el('span', { class: 'conflict-quote', text: 'Here: “' + c.mine + '”' }),
            el('span', { class: 'conflict-quote', text: 'There: “' + c.theirs + '”' })
          ]));
        });
        const trust = el('div', { class: 'trust-box' }, [el('strong', { text: items.length ? 'Things to check' : 'Verified, owned and recently reviewed.' })]);
        if (items.length) trust.appendChild(el('ul', {}, items));
        return trust;
      }

      /* ---------- Graph view & file pop-up ---------- */

      // Layout constants (px). Each visible leaf gets one horizontal slot; parents sit centred above their children.
      const G = { SLOT: 212, NODE_W: 184, NODE_H: 58, FILE_W: 196, FILE_H: 44, FILE_GAP: 52, INDENT: 12, LEVEL: 118, PAD: 28, DURATION: 420 };
      const SVG_NS = 'http://www.w3.org/2000/svg';

      const graph = {
        wrap: null, sizer: null, canvas: null, svg: null,
        nodes: new Map(),   // id -> { el, path, parentId, x, y, o, from*, to*, leaving }
        targets: new Map(),
        zoom: 1, autoFit: true, width: 0, height: 0, anim: 0, focusId: null
      };

      // Folders first, then summaries, then loose documents; alphabetical within each group.
      function sortedChildren(folderNode) {
        const rank = (n) => (n.type === 'file' ? 2 : isSummary(n) ? 1 : 0);
        return [...folderNode.children].sort((a, b) => rank(a) - rank(b) || a.name.localeCompare(b.name));
      }

      function initGraph() {
        if (graph.wrap) return;
        graph.svg = document.createElementNS(SVG_NS, 'svg');
        graph.svg.setAttribute('class', 'graph-lines');
        graph.svg.setAttribute('aria-hidden', 'true');
        graph.canvas = el('div', { class: 'graph-canvas' });
        graph.canvas.appendChild(graph.svg);
        graph.sizer = el('div', { class: 'graph-sizer' }, graph.canvas);
        graph.wrap = el('div', { class: 'graph-wrap', role: 'tree', 'aria-label': 'Folders and documents as a graph' }, graph.sizer);
      }

      // Folders and summaries spread out sideways; the documents inside an opened folder or summary
      // are stacked in one column under it, so the graph stays readable as it grows.
      function layoutGraph() {
        const items = [];
        const widthOf = new Map();
        const partsOf = (n) => {
          if (n.type !== 'folder' || !state.expanded.has(n.id)) return { branches: [], files: [] };
          const kids = sortedChildren(n);
          const branches = kids.filter((k) => k.type === 'folder');
          const files = kids.filter((k) => k.type === 'file');
          if (!kids.length) branches.push({ id: n.id + ':empty', type: 'ghost', name: 'empty' });
          return { branches, files };
        };
        const measure = (n) => {
          const { branches, files } = partsOf(n);
          const w = Math.max(1, branches.reduce((sum, c) => sum + measure(c), 0) + (files.length ? 1 : 0));
          widthOf.set(n.id, w);
          return w;
        };
        const column = (files, x, depth, parentId) => {
          const left = G.PAD + (x + 0.5) * G.SLOT - G.NODE_W / 2 + G.INDENT;
          files.forEach((f, i) => items.push({
            id: f.id, node: f, parentId, depth, stacked: true,
            tx: left, ty: G.PAD + depth * G.LEVEL + i * G.FILE_GAP, w: G.FILE_W, h: G.FILE_H
          }));
        };
        const place = (n, x0, depth, parentId) => {
          const w = widthOf.get(n.id);
          items.push({
            id: n.id, node: n, parentId, depth, stacked: false,
            tx: G.PAD + (x0 + w / 2) * G.SLOT - G.NODE_W / 2, ty: G.PAD + depth * G.LEVEL, w: G.NODE_W, h: G.NODE_H
          });
          const { branches, files } = partsOf(n);
          let x = x0;
          branches.forEach((c) => { place(c, x, depth + 1, n.id); x += widthOf.get(c.id); });
          if (files.length) column(files, x, depth + 1, n.id);
        };
        const top = sortedChildren(state.root);
        let x = 0;
        top.filter((n) => n.type === 'folder').forEach((n) => { measure(n); place(n, x, 0, null); x += widthOf.get(n.id); });
        const looseFiles = top.filter((n) => n.type === 'file');
        if (looseFiles.length) { column(looseFiles, x, 0, null); x += 1; }
        const bottom = items.reduce((m, it) => Math.max(m, it.ty + it.h), 0);
        return { items, width: 2 * G.PAD + Math.max(x, 1) * G.SLOT - (G.SLOT - G.NODE_W), height: bottom + G.PAD + 12 };
      }

      function createNodeEl() {
        const b = document.createElement('button');
        b.type = 'button';
        b.addEventListener('click', () => onGraphNodeClick(b.dataset.id));
        return b;
      }

      function fillNodeEl(b, n) {
        b.dataset.id = n.id;
        b.style.pointerEvents = '';
        b.removeAttribute('aria-hidden');
        b.replaceChildren();
        b.setAttribute('role', 'treeitem');
        if (n.type === 'ghost') {
          b.className = 'gnode ghost';
          b.disabled = true;
          b.tabIndex = -1;
          b.removeAttribute('aria-expanded');
          b.appendChild(el('span', { class: 'gnode-name', text: 'empty folder' }));
          return;
        }
        b.disabled = false;
        b.tabIndex = 0;
        if (isSummary(n)) {
          const open = state.expanded.has(n.id);
          const a = analysis.get(n.id);
          const count = n.children.length;
          b.className = 'gnode summary' + (open ? ' open' : '') + (state.activeFileId === n.id ? ' selected' : '');
          b.setAttribute('aria-expanded', String(open));
          b.title = `${n.name} summary — click to read it; use ${open ? '−' : '+'} to ${open ? 'hide' : 'show'} its ${count} source documents.`;
          const toggle = el('span', { class: 'gnode-toggle', title: `${open ? 'Hide' : 'Show'} the ${count} source documents`, text: open ? '−' : '+' });
          toggle.addEventListener('click', (e) => { e.stopPropagation(); toggleGraphNode(n.id); });
          b.append(
            el('span', { class: 'gnode-icon', text: '📋' }),
            el('span', { class: 'gnode-text' }, [
              el('span', { class: 'gnode-name', text: n.name }),
              el('span', { class: 'gnode-meta', text: `summary · ${count} source${count === 1 ? '' : 's'}` })
            ]),
            el('span', { class: `gnode-dot ${a.level}` }),
            toggle
          );
        } else if (n.type === 'folder') {
          const open = state.expanded.has(n.id);
          let files = 0; walk(n, (x) => { if (isDoc(x)) files++; });
          const items = n.children.length;
          b.className = 'gnode folder' + (open ? ' open' : '') + (state.currentFolderId === n.id ? ' selected' : '');
          b.setAttribute('aria-expanded', String(open));
          b.title = `${n.name} — click to ${open ? 'fold in' : 'open'}`;
          b.append(
            el('span', { class: 'gnode-icon', text: open ? '📂' : '📁' }),
            el('span', { class: 'gnode-text' }, [
              el('span', { class: 'gnode-name', text: n.name }),
              el('span', { class: 'gnode-meta', text: `${items} item${items === 1 ? '' : 's'} · ${files} document${files === 1 ? '' : 's'}` })
            ]),
            el('span', { class: 'gnode-toggle', text: open ? '−' : '+' })
          );
        } else {
          const a = analysis.get(n.id);
          b.className = 'gnode file' + (state.activeFileId === n.id ? ' selected' : '');
          b.removeAttribute('aria-expanded');
          b.title = `${n.name}${n.owner ? ' · ' + n.owner : ''} — ${LEVEL_LABEL[a.level]}. Click to read.`;
          b.append(
            el('span', { class: 'gnode-icon', text: '📄' }),
            el('span', { class: 'gnode-text' }, [
              el('span', { class: 'gnode-name', text: n.name.replace(/\.txt$/i, '') })
            ]),
            el('span', { class: `gnode-dot ${a.level}` })
          );
        }
      }

      function onGraphNodeClick(id) {
        const found = findById(id);
        if (!found) return;
        if (isDoc(found.node)) return openViewer(id);   // documents and summaries open in the pop-up
        toggleGraphNode(id);
      }

      // Opens or folds a folder / summary in the graph and makes it the target for new files.
      function toggleGraphNode(id) {
        const found = findById(id);
        if (!found || found.node.type !== 'folder') return;
        if (state.expanded.has(id)) {
          // Folding also folds everything inside it.
          walk(found.node, (x) => { if (x.type === 'folder') state.expanded.delete(x.id); });
        } else {
          state.expanded.add(id);
          graph.focusId = id;
        }
        state.currentFolderId = id;
        saveUiPrefs();
        renderNav();
        renderMain();
      }

      function setGraphSize(w, h) {
        graph.width = w;
        graph.height = h;
        graph.canvas.style.width = w + 'px';
        graph.canvas.style.height = h + 'px';
        graph.svg.setAttribute('width', w);
        graph.svg.setAttribute('height', h);
        applyZoom();
      }

      function applyZoom() {
        graph.canvas.style.transform = `scale(${graph.zoom})`;
        graph.sizer.style.width = graph.width * graph.zoom + 'px';
        graph.sizer.style.height = graph.height * graph.zoom + 'px';
        const label = document.getElementById('zoomLabel');
        if (label) label.textContent = Math.round(graph.zoom * 100) + '%';
      }

      function setZoom(z) {
        graph.zoom = Math.min(1.6, Math.max(0.3, Math.round(z * 100) / 100));
        applyZoom();
      }

      // Zoom that makes the whole graph fit the panel width (never above 100%, never below 65% so text stays readable).
      function fitZoom(width) {
        const avail = graph.wrap.clientWidth - 16;
        if (avail <= 0) return graph.zoom;
        return Math.min(1, Math.max(0.65, avail / Math.max(1, width)));
      }

      function drawGraphFrame() {
        graph.nodes.forEach((g) => {
          g.el.style.transform = `translate(${g.x}px, ${g.y}px)`;
          g.el.style.opacity = g.o;
        });
        graph.nodes.forEach((g) => {
          if (!g.path) return;
          const p = graph.nodes.get(g.parentId);
          if (!p) { g.path.setAttribute('d', ''); return; }
          const x1 = p.x + p.w / 2, y1 = p.y + p.h;
          if (g.stacked) {
            // Elbow: down from the parent, across to the column's spine, down, then into the document.
            const bus = y1 + (G.LEVEL - G.NODE_H) / 2;
            const spine = g.x - G.INDENT / 2 - 2;
            const cy = g.y + g.h / 2;
            g.path.setAttribute('d', `M${x1},${y1} V${bus} H${spine} V${cy} H${g.x}`);
          } else {
            const x2 = g.x + g.w / 2, y2 = g.y;
            const my = (y1 + y2) / 2;
            g.path.setAttribute('d', `M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`);
          }
          g.path.style.opacity = Math.min(g.o, p.o);
        });
      }

      function updateGraph() {
        const { items, width, height } = layoutGraph();
        const seen = new Set();
        graph.targets = new Map(items.map((it) => [it.id, it]));

        items.forEach((it) => {
          let g = graph.nodes.get(it.id);
          if (!g) {
            // New nodes spawn from their parent's current position.
            const parent = it.parentId && graph.nodes.get(it.parentId);
            g = { el: createNodeEl(), path: null, x: parent ? parent.x : it.tx, y: parent ? parent.y : it.ty, o: 0, w: it.w, h: it.h };
            graph.canvas.appendChild(g.el);
            graph.nodes.set(it.id, g);
          }
          g.leaving = false;
          g.parentId = it.parentId;
          g.stacked = it.stacked;
          g.w = it.w;
          g.h = it.h;
          if (g.parentId && !g.path) {
            g.path = document.createElementNS(SVG_NS, 'path');
            graph.svg.appendChild(g.path);
          } else if (!g.parentId && g.path) {
            g.path.remove();
            g.path = null;
          }
          Object.assign(g, { fromX: g.x, fromY: g.y, fromO: g.o, toX: it.tx, toY: it.ty, toO: 1 });
          fillNodeEl(g.el, it.node);
          seen.add(it.id);
        });

        // Nodes that disappear slide back into their nearest visible ancestor and fade out.
        graph.nodes.forEach((g, id) => {
          if (seen.has(id)) return;
          g.leaving = true;
          let anc = g.parentId;
          while (anc && !seen.has(anc)) { const a = graph.nodes.get(anc); anc = a ? a.parentId : null; }
          const t = anc ? graph.targets.get(anc) : null;
          Object.assign(g, { fromX: g.x, fromY: g.y, fromO: g.o, toX: t ? t.tx : g.x, toY: t ? t.ty : g.y, toO: 0 });
          g.el.tabIndex = -1;
          g.el.setAttribute('aria-hidden', 'true');
          g.el.style.pointerEvents = 'none';
        });

        setGraphSize(Math.max(width, graph.width), Math.max(height, graph.height));
        const fromZoom = graph.zoom;
        const toZoom = graph.autoFit ? fitZoom(width) : graph.zoom;
        graph.wrap.classList.add('animating');

        cancelAnimationFrame(graph.anim);
        const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const start = performance.now();
        const step = (now) => {
          const p = reduce ? 1 : Math.min(1, Math.max(0, now - start) / G.DURATION);
          const e = 1 - Math.pow(1 - p, 3);
          graph.nodes.forEach((g) => {
            g.x = g.fromX + (g.toX - g.fromX) * e;
            g.y = g.fromY + (g.toY - g.fromY) * e;
            g.o = g.fromO + (g.toO - g.fromO) * e;
          });
          graph.zoom = fromZoom + (toZoom - fromZoom) * e;
          applyZoom();
          drawGraphFrame();
          if (p < 1) { graph.anim = requestAnimationFrame(step); return; }
          graph.nodes.forEach((g, id) => {
            if (!g.leaving) return;
            g.el.remove();
            if (g.path) g.path.remove();
            graph.nodes.delete(id);
          });
          setGraphSize(width, height);
          graph.wrap.classList.remove('animating');
          ensureFocusVisible();
        };
        graph.anim = requestAnimationFrame(step);
      }

      // After opening a folder, scroll so the folder and its new children are in view.
      function ensureFocusVisible() {
        const id = graph.focusId;
        graph.focusId = null;
        if (!id || !graph.targets.has(id)) return;
        const group = [...graph.targets.values()].filter((t) => t.id === id || t.parentId === id);
        const z = graph.zoom;
        const left = Math.min(...group.map((t) => t.tx)) * z - 12;
        const right = Math.max(...group.map((t) => t.tx + t.w)) * z + 12;
        const bottom = Math.max(...group.map((t) => t.ty + t.h)) * z + 24;
        const w = graph.wrap;
        const offset = Math.max(0, (w.clientWidth - graph.width * z) / 2);
        let sl = w.scrollLeft, st = w.scrollTop;
        if (right + offset > sl + w.clientWidth) sl = right + offset - w.clientWidth;
        if (left + offset < sl) sl = left + offset;
        if (bottom > st + w.clientHeight) st = bottom - w.clientHeight;
        w.scrollTo({ left: sl, top: st, behavior: 'smooth' });
      }

      function renderGraph(body, keepScroll) {
        initGraph();
        const target = findById(state.currentFolderId);
        body.appendChild(el('div', { class: 'target-hint' }, [
          'New files & imports go to ',
          el('strong', { text: target && target.node.id !== state.root.id ? pathLabel([...target.path.slice(1), target.node]) : 'My Drive (top level)' }),
          ' — click a folder to open it and choose it.'
        ]));
        const files = allFiles();
        const docs = allDocs();
        const attention = docs.filter(({ node }) => analysis.get(node.id).level === 'bad').length;
        const conflicts = files.filter(({ node }) => analysis.get(node.id).conflicts.length).length;
        const chip = (n, label, tone) => el('span', { class: 'chip' + (tone ? ' ' + tone : '') }, [el('strong', { text: String(n) }), ' ' + label]);
        body.appendChild(el('div', { class: 'chips' }, [
          chip(docs.length - files.length, 'summaries'),
          chip(files.length, 'source documents'),
          chip(attention, 'need attention', attention ? 'warn' : ''),
          chip(conflicts, 'sources in conflict', conflicts ? 'bad' : '')
        ]));
        const zoomBtn = (text, title, fn) => el('button', { class: 'secondary-btn small-btn', type: 'button', title, text, onclick: fn });
        body.appendChild(el('div', { class: 'graph-toolbar' }, [
          el('div', { class: 'group' }, [
            zoomBtn('Open all', 'Open every folder', () => { walk(state.root, (x) => { if (x.type === 'folder' && x !== state.root) state.expanded.add(x.id); }); saveUiPrefs(); renderMain(); }),
            zoomBtn('Fold all', 'Fold every folder', () => { state.expanded.clear(); saveUiPrefs(); renderMain(); })
          ]),
          el('div', { class: 'group zoom' }, [
            zoomBtn('−', 'Zoom out', () => { graph.autoFit = false; setZoom(graph.zoom - 0.1); }),
            el('span', { class: 'zoom-label', id: 'zoomLabel', text: Math.round(graph.zoom * 100) + '%' }),
            zoomBtn('+', 'Zoom in', () => { graph.autoFit = false; setZoom(graph.zoom + 0.1); }),
            zoomBtn('Fit', 'Zoom to fit the whole graph (and keep fitting as it grows)', () => { graph.autoFit = true; setZoom(fitZoom(graph.width)); })
          ])
        ]));
        body.appendChild(graph.wrap);
        if (keepScroll) { graph.wrap.scrollLeft = keepScroll[0]; graph.wrap.scrollTop = keepScroll[1]; }
        updateGraph();
      }

      let activePolicyView = 'full';

      function trustPill(score) {
        return el('span', { class: 'trust-pill' + (score < 92 ? ' mid' : ''), text: `${score}% trust`, title: 'Confidence in this resolved value' });
      }

      function appendResolved(container, value, score) {
        container.appendChild(el('span', { class: 'trusted-inline', text: value }));
        container.appendChild(trustPill(score));
      }

      function renderTrustedPolicy(target, node, mode = 'full') {
        target.replaceChildren();
        const policy = node.trustedPolicy;
        const f = policy.fields;
        const paper = el('article', { class: 'doc-paper' });
        target.appendChild(paper);
        paper.appendChild(el('h1', { class: 'doc-title', text: policy.title }));
        paper.appendChild(el('div', { class: 'doc-subtitle', text: mode === 'full' ? `${policy.company} · ${policy.scope} · resolved policy view` : `${policy.company} · ${policy.scope} · trusted summary` }));
        paper.appendChild(el('div', { class: 'resolved-note' }, [
          el('span', { text: '✓' }),
          el('span', { text: 'Values shown here are resolved from all available policy versions. Source documents remain unchanged.' })
        ]));

        if (mode === 'summary') {
          paper.appendChild(el('h2', { class: 'doc-section', text: 'Key Employment Information' }));
          const grid = el('div', { class: 'policy-summary-grid' });
          Object.values(f).forEach((x) => {
            const card = el('div', { class: 'policy-summary-card' });
            card.appendChild(el('div', { class: 'policy-summary-label', text: x.label }));
            const val = el('div', { class: 'policy-summary-value' });
            val.append(document.createTextNode(x.value + ' '), trustPill(x.score));
            card.appendChild(val);
            card.appendChild(el('div', { class: 'policy-summary-detail', text: x.detail }));
            grid.appendChild(card);
          });
          paper.appendChild(grid);
          return;
        }

        const sections = [
          ['1. Purpose and Scope', (p) => p.append('This policy establishes the general working conditions applicable to permanent employees of Company A in America, unless otherwise stated in an individual employment agreement or formally approved amendment. Where a binding agreement provides different conditions, that agreement takes precedence.')],
          ['2. Working Hours', (p) => { p.append('The standard full-time working schedule consists of '); appendResolved(p, f.workingHours.value, f.workingHours.score); p.append(', normally distributed across five working days from Monday to Friday. Alternative schedules may be agreed with the employee’s manager, subject to internal procedures. Any working time beyond the agreed schedule must receive prior approval. Approved overtime shall be compensated at '); appendResolved(p, f.overtime.value, f.overtime.score); p.append(' or, where agreed, through equivalent compensatory time off.'); }],
          ['3. Annual Leave', (p) => { p.append('Full-time employees are entitled to '); appendResolved(p, f.vacation.value, f.vacation.score); p.append('. After each completed year of continuous employment, employees receive '); appendResolved(p, 'one additional paid vacation day', f.vacation.score); p.append(', up to a maximum of '); appendResolved(p, '26 paid vacation days per calendar year', f.vacation.score); p.append('. Vacation requests must be submitted through the HR platform and are subject to manager approval. Unused leave may only be transferred where permitted by applicable rules and internal procedures.'); }],
          ['4. Remote Work', (p) => { p.append('Employees whose role is suitable for remote work may work remotely for '); appendResolved(p, f.remote.value, f.remote.score); p.append('. Remote-working days must be coordinated with the employee’s manager and may be restricted where physical presence is required for operational, customer, security, or team-related reasons. Remote work does not alter contractual working hours, confidentiality obligations, availability requirements, or performance expectations.'); }],
          ['5. Sick Leave', (p) => { p.append('Employees unable to work due to illness must notify their manager and Human Resources as soon as reasonably possible. A '); appendResolved(p, f.sick.value.toLowerCase(), f.sick.score); p.append(', unless stricter requirements apply. Employees must follow the company’s absence-reporting procedure and provide required documentation within the applicable deadlines.'); }],
          ['6. Meal Vouchers', (p) => { p.append('Eligible employees receive meal vouchers with a total value of '); appendResolved(p, f.meal.value, f.meal.score); p.append('. Meal vouchers are provided only for eligible working days, subject to company procedures.'); }],
          ['7. Parental and Special Leave', (p) => { p.append('Employees may request parental leave, bereavement leave, and other forms of special leave '); appendResolved(p, f.special.value.toLowerCase(), f.special.score); p.append('. Requests must be submitted through the HR platform and may require supporting documentation.'); }],
          ['8. Policy Administration', (p) => p.append('Human Resources is responsible for the interpretation, implementation, and maintenance of this policy. The company may amend this policy where required by changes in legislation, operational requirements, or company practices. Any amendment must be formally approved and communicated before becoming effective. The trusted view above resolves conflicts between available source versions but does not modify those source documents.')]
        ];
        sections.forEach(([title, build]) => {
          paper.appendChild(el('h2', { class: 'doc-section', text: title }));
          const p = el('p', { class: 'doc-paragraph' }); build(p); paper.appendChild(p);
        });
      }

      // Render a source or summary as a document-like page instead of raw monospaced text.
      // Summary citations such as [1] stay clickable.
      function renderDocBody(target, node) {
        target.replaceChildren();
        const text = docText(node);
        if (!text) { target.textContent = '(empty document)'; return; }

        const paper = el('article', { class: 'doc-paper' });
        target.appendChild(paper);

        const lines = text.split(/\r?\n/);
        const nonEmpty = lines.map((x) => x.trim()).filter(Boolean);
        const firstLine = nonEmpty[0] || docTitle(node);
        const title = firstLine.replace(/\s+-\s+/g, ' — ');
        paper.appendChild(el('h1', { class: 'doc-title', text: title }));
        paper.appendChild(el('div', { class: 'doc-subtitle', text: isSummary(node) ? 'Trusted knowledge summary' : 'Source document' }));

        const byNumber = new Map();
        if (isSummary(node)) {
          lines.forEach((line) => {
            const m = line.match(/^\s*\[(\d+)\]\s+(.+?)\s*$/);
            if (!m) return;
            const src = node.children.find((c) => c.type === 'file' && c.name.toLowerCase() === m[2].toLowerCase());
            if (src) byNumber.set(m[1], src);
          });
        }

        function appendInline(container, value) {
          if (!isSummary(node)) { container.appendChild(document.createTextNode(value)); return; }
          value.split(/(\[\d+\])/).forEach((part) => {
            const m = part.match(/^\[(\d+)\]$/);
            const src = m && byNumber.get(m[1]);
            if (src) container.appendChild(el('button', { class: 'cite', type: 'button', title: 'Open source: ' + src.name, text: part, onclick: () => openViewer(src.id) }));
            else container.appendChild(document.createTextNode(part));
          });
        }

        const meta = [];
        let inSources = false;
        let skipFirst = true;
        const contentLines = [];
        for (const raw of lines) {
          const line = raw.trim();
          if (!line) { contentLines.push(''); continue; }
          if (skipFirst && line === firstLine) { skipFirst = false; continue; }
          skipFirst = false;
          const mm = line.match(/^([^:]{2,30}):\s*(.+)$/);
          if (!inSources && mm && /^(document owner|owner|status|last updated|last reviewed|date|from|to|cc|applies to|version|approved by|approval date|effective date|policy id)$/i.test(mm[1])) {
            meta.push([mm[1], mm[2]]); continue;
          }
          if (/^sources\s*$/i.test(line)) inSources = true;
          contentLines.push(raw);
        }

        if (meta.length) {
          const box = el('div', { class: 'doc-meta' });
          meta.forEach(([k,v]) => {
            box.appendChild(el('div', { class: 'doc-meta-key', text: k }));
            box.appendChild(el('div', { class: 'doc-meta-value', text: v }));
          });
          paper.appendChild(box);
        }

        let callout = null;
        contentLines.forEach((raw) => {
          const line = raw.trim();
          if (!line) { callout = null; return; }
          if (isSummary(node) && /^\[\d+\]\s+/.test(line)) return; // source list is represented by clickable citations above

          if (/^[⚠ⓘ]/.test(line)) {
            callout = el('div', { class: 'doc-callout' });
            appendInline(callout, line);
            paper.appendChild(callout);
            return;
          }
          if (callout && /^\s{2,}/.test(raw)) {
            callout.appendChild(document.createElement('br'));
            appendInline(callout, line);
            return;
          }
          callout = null;

          if (/^sources\s*$/i.test(line)) {
            paper.appendChild(el('div', { class: 'doc-sources-title', text: 'Sources' }));
            return;
          }
          if (/^\d+\.\s+/.test(line)) {
            paper.appendChild(el('h2', { class: 'doc-section', text: line }));
            return;
          }
          if (/^[A-ZÀ-ÖØ-Þ0-9][A-ZÀ-ÖØ-Þ0-9 &'()\-/]{5,}$/.test(line) && line.length < 90) {
            paper.appendChild(el('h2', { class: 'doc-section', text: line }));
            return;
          }
          if (/^[-•]\s+/.test(line)) {
            const p = el('div', { class: 'doc-bullet' });
            p.append('• '); appendInline(p, line.replace(/^[-•]\s+/, ''));
            paper.appendChild(p);
            return;
          }
          const p = el('p', { class: 'doc-paragraph' });
          appendInline(p, line);
          paper.appendChild(p);
        });
      }

      function openViewer(id) {
        const found = findById(id);
        if (!found || !isDoc(found.node)) return;
        const n = found.node;
        state.activeFileId = n.id;
        const a = analysis.get(n.id);
        const parent = found.path[found.path.length - 1];
        $('viewerTitle').textContent = (isSummary(n) ? '📋 ' : '') + docTitle(n);
        $('viewerScore').replaceChildren();
        if (!n.trustedPolicy) $('viewerScore').appendChild(scoreBadge(n));
        const info = $('viewerPath');
        info.replaceChildren('Applies to: ' + (pathLabel(found.path.slice(1)) || 'My Drive') + (n.owner ? ` · owner: ${n.owner}` : ''));
        if (isSummary(parent)) {
          info.append(' · ', el('button', { class: 'link-btn', type: 'button', text: `← back to the ${parent.name} summary`, onclick: () => openViewer(parent.id) }));
        }
        const trustPanel = $('viewerTrust');
        trustPanel.replaceChildren();
        if (!n.trustedPolicy) trustPanel.appendChild(buildTrustBox(a, openViewer));
        const policyToggle = $('policyViewToggle');
        policyToggle.classList.toggle('hidden', !n.trustedPolicy);

        policyToggle.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.policyView === activePolicyView));
        if (n.trustedPolicy) renderTrustedPolicy($('viewerBody'), n, activePolicyView);
        else renderDocBody($('viewerBody'), n);
        $('viewerBody').scrollTop = 0;
        const sourcesBtn = $('viewerSources');
        sourcesBtn.classList.toggle('hidden', !isSummary(n));
        if (isSummary(n)) {
          sourcesBtn.textContent = n.trustedPolicy ? `📂 View original versions (${n.children.length})` : `📂 Open as folder (${n.children.length} source${n.children.length === 1 ? '' : 's'})`;
          sourcesBtn.onclick = () => { closeViewer(); openFolder(n.id); };

        $('viewerEdit').onclick = () => {
          closeViewer();

        };

      }

      $('policyViewToggle').addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-policy-view]');
        if (!btn) return;
        const found = findById(state.activeFileId);

        activePolicyView = btn.dataset.policyView;
        $('policyViewToggle').querySelectorAll('button').forEach((b) => b.classList.toggle('on', b === btn));
        renderTrustedPolicy($('viewerBody'), node, activePolicyView);
        $('viewerBody').scrollTop = 0;
      });

      function closeViewer() { $('viewer').classList.add('hidden'); }

      $('viewerClose').addEventListener('click', closeViewer);
      $('viewer').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeViewer(); });

      $('viewToggle').addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-layout]');
        if (!btn) return;
        state.layout = btn.dataset.layout;
        state.view = 'folder';
        $('searchInput').value = '';
        state.query = '';
        saveUiPrefs();
        renderNav();
        renderMain();
      });

      function renderEditor() {
        updateLayoutClass();
        const ed = $('editor');
        const found = state.activeFileId && findById(state.activeFileId);
        ed.innerHTML = '';
        if (!found) {
          state.activeFileId = null;
          const files = allFiles();
          const docs = allDocs();
          const summaries = docs.length - files.length;
          const attention = docs.filter(({ node }) => analysis.get(node.id).level === 'bad').length;
          const conflicts = files.filter(({ node }) => analysis.get(node.id).conflicts.length).length;
          ed.appendChild(el('div', { class: 'editor-header' }, el('h3', { text: 'Overview' })));
          ed.appendChild(el('div', { class: 'stats' }, [
            stat(summaries, summaries === 1 ? 'summary' : 'summaries'),
            stat(files.length, 'source documents'),
            stat(attention, 'need attention', attention ? 'warn' : ''),
            stat(conflicts, 'sources in conflict', conflicts ? 'bad' : '')
          ]));
          ed.appendChild(el('div', { class: 'editor-placeholder' }, [
            el('strong', { text: 'How to use' }),
            el('ul', { class: 'howto' }, [
              el('li', { text: 'Click a folder to open it; click a 📋 summary to read it.' }),
              el('li', { text: 'In a summary, click a [number] to open the source it comes from, or “Open as folder” to see all its sources.' }),
              el('li', { text: 'The + on a summary shows its source documents in the graph.' }),
              el('li', { text: 'Search ( / ) looks through every company and country at once; summaries come first.' }),
              el('li', { text: 'Sources that give different numbers for the same thing are flagged as conflicts.' })
            ])
          ]));
          return;
        }

        const f = found.node;
        const a = analysis.get(f.id);
        const summary = isSummary(f);

        ed.appendChild(el('div', { class: 'editor-header' }, [
          el('h3', { text: (summary ? '📋 ' : '') + docTitle(f) }),
          scoreBadge(f)
        ]));
        const parent = found.path[found.path.length - 1];
        const pathLine = el('div', { class: 'editor-path', text: 'Applies to: ' + (pathLabel(found.path.slice(1)) || 'My Drive (no company / country)') });
        if (isSummary(parent)) pathLine.append(' · ', el('button', { class: 'link-btn', type: 'button', text: `source of the ${parent.name} summary`, onclick: () => openFile(parent.id) }));
        ed.appendChild(pathLine);

        const trustSlot = el('div', {}, buildTrustBox(a, openFile));
        ed.appendChild(trustSlot);

        // Metadata
        const ownerInput = el('input', { type: 'text', value: f.owner || '', maxlength: '80', placeholder: 'e.g. Payroll team' });
        const statusLabels = { draft: 'Unverified / draft', verified: 'Verified', outdated: 'Outdated' };
        const statusSelect = el('select', {}, ['draft', 'verified', 'outdated'].map((st) => {
          const o = el('option', { value: st, text: statusLabels[st] });
          if (f.status === st) o.selected = true;
          return o;
        }));
        const fmt = (iso, none = 'never') => (iso ? new Date(iso).toLocaleDateString() : none);
        ed.appendChild(el('div', { class: 'meta-grid' }, [
          el('label', {}, ['Owner / expert', ownerInput]),
          el('label', {}, ['Status', statusSelect]),
          el('div', { class: 'meta-line', text: `Last updated: ${fmt(f.updatedAt, 'unknown')} · Last reviewed: ${fmt(f.reviewedAt)}` + (summary ? ` · ${f.children.length} sources` : '') })
        ]));

        const commitMeta = () => {
          f.owner = ownerInput.value.trim().slice(0, 80);
          f.status = statusSelect.value;
          if (f.status === 'verified') f.reviewedAt = now();
          saveState();
          render();
        };
        ownerInput.addEventListener('change', commitMeta);
        statusSelect.addEventListener('change', commitMeta);

        // Content
        const textarea = el('textarea', { 'aria-label': summary ? 'Summary editor' : 'Document editor' });
        textarea.value = docText(f);
        const status = el('span', { class: 'status-msg', text: '' });
        textarea.addEventListener('input', () => { state.dirty = true; status.textContent = 'Unsaved changes'; });
        ed.appendChild(textarea);

        const save = () => {
          if (docText(f) !== textarea.value) {
            if (summary) f.summary = textarea.value;
            else { f.content = textarea.value; f.changedAt = now(); }
            f.updatedAt = now();
          }
          state.dirty = false;
          status.textContent = saveState() ? 'Saved ✓' : 'Could not save (browser storage full?)';
          analysis = analyzeAll();
          trustSlot.replaceChildren(buildTrustBox(analysis.get(f.id), openFile));
          renderNav();
          renderMain();
        };
        state.saveActive = save;

        const leftButtons = [
          el('button', { class: 'secondary-btn small-btn', text: 'Mark reviewed', title: 'I checked this and it is still correct', onclick: () => { save(); f.reviewedAt = now(); if (f.status === 'draft') f.status = 'verified'; saveState(); render(); } }),
          el('button', { class: 'secondary-btn small-btn', text: 'Rename', onclick: () => renameItem(f.id) }),
          el('button', { class: 'danger-btn small-btn', text: 'Delete', onclick: () => deleteItem(f.id) })
        ];
        if (summary) leftButtons.unshift(el('button', { class: 'secondary-btn small-btn', text: `📂 Open as folder (${f.children.length})`, onclick: () => openFolder(f.id) }));
        ed.appendChild(el('div', { class: 'save-row' }, [
          el('div', { class: 'group' }, leftButtons),
          el('div', { class: 'group' }, [
            status,
            el('button', { class: 'secondary-btn small-btn', text: 'Save to computer', onclick: async () => { save(); await saveTextFileToComputer(summary ? 'SUMMARY.txt' : f.name, docText(f)); } }),
            el('button', { class: 'primary-btn small-btn', text: 'Save', onclick: save })
          ])
        ]));
      }

      /* ---------- Navigation ---------- */

      function confirmLeave() {
        if (!state.dirty) return true;
        return window.confirm('You have unsaved changes in this file. Discard them?');
      }

      function openFolder(id) {
        if (!confirmLeave()) return;
        state.dirty = false;
        state.view = 'folder';
        state.currentFolderId = id;
        state.activeFileId = null;
        if (state.layout === 'graph') {
          // In the graph, "opening" a folder means unfolding it (and everything above it).
          const found = findById(id);
          if (found) { found.path.forEach((p) => state.expanded.add(p.id)); state.expanded.add(id); graph.focusId = id; saveUiPrefs(); }
        }
        $('searchInput').value = '';
        state.query = '';
        render();
      }

      function openFile(id) {
        if (id !== state.activeFileId && !confirmLeave()) return;
        state.dirty = false;
        state.activeFileId = id;
        renderMain();
        renderEditor();
      }

      /* ---------- Search ---------- */

      function searchFiles(query) {
        const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
        if (!terms.length) return [];
        const out = [];
        allDocs().forEach(({ node, path }) => {
          const name = node.name.toLowerCase();
          const text = docText(node).toLowerCase();
          const where = path.map((p) => p.name).join(' ').toLowerCase();
          let score = 0;
          for (const t of terms) {
            const inName = name.includes(t), inWhere = where.includes(t);
            let count = 0, i = text.indexOf(t);
            while (i !== -1 && count < 50) { count++; i = text.indexOf(t, i + t.length); }
            if (!inName && !inWhere && !count) return; // every term must match somewhere
            score += (inName ? 5 : 0) + (inWhere ? 3 : 0) + count;
          }
          const level = analysis.get(node.id).level;
          score += level === 'good' ? 2 : level === 'warn' ? 0.5 : 0; // trusted documents float up
          if (isSummary(node)) score += 4;                            // the summary is usually the best answer
          if (node.status === 'outdated') score -= 3;                 // superseded documents sink
          out.push({ node, path, score, snippet: makeSnippet(docText(node), terms) });
        });
        return out.sort((a, b) => b.score - a.score);
      }

      function makeSnippet(content, terms) {
        const lower = content.toLowerCase();
        let pos = -1;
        for (const t of terms) { pos = lower.indexOf(t); if (pos !== -1) break; }
        const start = Math.max(0, pos - 60);
        const text = (start > 0 ? '…' : '') + content.slice(start, start + 200).replace(/\s+/g, ' ') + (content.length > start + 200 ? '…' : '');
        const div = el('div', { class: 'result-snippet' });
        const escaped = terms.map((t) => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
        const re = new RegExp('(' + escaped.join('|') + ')', 'gi');
        text.split(re).forEach((part, i) => div.appendChild(i % 2 ? el('mark', { text: part }) : document.createTextNode(part)));
        return div;
      }

      let searchTimer;
      $('searchInput').addEventListener('input', (e) => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          state.query = e.target.value.trim();
          state.view = state.query ? 'search' : 'folder';
          renderNav();
          renderMain();
        }, 120);
      });

      /* ---------- Create / rename / delete (modal) ---------- */

      function showModal({ title, text, input, confirmLabel, danger, validate, onConfirm, hideCancel }) {
        $('modalCancel').classList.toggle('hidden', !!hideCancel);
        const modal = $('modal');
        const inputEl = $('modalInput');
        const confirmBtn = $('modalConfirm');
        $('modalTitle').textContent = title;
        $('modalText').textContent = text || '';
        $('modalText').classList.toggle('hidden', !text);
        $('modalError').textContent = '';
        inputEl.classList.toggle('hidden', !input);
        inputEl.value = input ? input.value || '' : '';
        inputEl.placeholder = input ? input.placeholder || '' : '';
        confirmBtn.textContent = confirmLabel || 'OK';
        confirmBtn.className = danger ? 'danger-btn' : 'primary-btn';
        modal.classList.remove('hidden');
        (input ? inputEl : confirmBtn).focus();
        if (input) inputEl.select();

        const close = () => modal.classList.add('hidden');
        const finish = () => {
          const value = inputEl.value.trim();
          const err = validate ? validate(value) : '';
          if (err) { $('modalError').textContent = err; return; }
          close();
          onConfirm(value);
        };
        confirmBtn.onclick = finish;
        inputEl.onkeydown = (e) => { if (e.key === 'Enter') finish(); };
        $('modalCancel').onclick = close;
        modal.onclick = (e) => { if (e.target === modal) close(); };
      }

      function createItem(type) {
        if (state.view !== 'folder') openFolder(state.currentFolderId);
        const parent = currentFolder();
        showModal({
          title: type === 'folder' ? 'Create folder' : 'Create file',
          input: { placeholder: type === 'folder' ? 'Folder name' : 'File name (e.g. holiday-policy.txt)' },
          confirmLabel: 'Create',
          validate: (v) => {
            const name = type === 'file' && v && !/\.txt$/i.test(v) ? v + '.txt' : v;
            return validateName(v) || (nameTaken(parent, name) ? 'Something with that name already exists here.' : '');
          },
          onConfirm: (v) => {
            if (type === 'folder') parent.children.push(folder(v));
            else {
              const f = file(/\.txt$/i.test(v) ? v : v + '.txt', '', { changedAt: now() });
              parent.children.push(f);
              state.activeFileId = f.id;
            }
            saveState();
            render();
          }
        });
      }

      function renameItem(id) {
        const found = findById(id);
        if (!found || id === state.root.id) return;
        const parent = found.path[found.path.length - 1];
        showModal({
          title: 'Rename',
          input: { value: found.node.name },
          confirmLabel: 'Rename',
          validate: (v) => validateName(v) || (nameTaken(parent, v, id) ? 'Something with that name already exists here.' : ''),
          onConfirm: (v) => { found.node.name = v; saveState(); render(); }
        });
      }

      function deleteItem(id) {
        const found = findById(id);
        if (!found || id === state.root.id) return;
        const parent = found.path[found.path.length - 1];
        let n = 0; walk(found.node, (x) => { if (x !== found.node && isDoc(x)) n++; });
        const what = isSummary(found.node) ? `the summary and its ${n} source document${n === 1 ? '' : 's'}`
          : found.node.type === 'folder' ? `the folder and the ${n} document${n === 1 ? '' : 's'} inside it` : 'this document';
        showModal({
          title: `Delete “${found.node.name}”?`,
          text: `This removes ${what} from the knowledge base. Files on your computer are not touched.`,
          confirmLabel: 'Delete',
          danger: true,
          onConfirm: () => {
            parent.children = parent.children.filter((c) => c.id !== id);
            if (found.node.type === 'folder' && (state.currentFolderId === id || !findById(state.currentFolderId))) state.currentFolderId = parent.id;
            if (!findById(state.activeFileId)) { state.activeFileId = null; state.dirty = false; }
            saveState();
            render();
          }
        });
      }

      /* ---------- Import ---------- */

      async function importFiles(fileList, targetFolder, keepFolders) {
        let added = 0, skipped = 0, lastId = null;
        for (const f of Array.from(fileList)) {
          const isTxt = /\.txt$/i.test(f.name) && (!f.type || f.type.startsWith('text/'));
          if (!isTxt || f.size > MAX_IMPORT_BYTES) { skipped++; continue; }
          let parent = targetFolder;
          if (keepFolders && f.webkitRelativePath) {
            const parts = f.webkitRelativePath.split('/').slice(0, -1).filter((p) => p && !p.startsWith('.'));
            for (const part of parts) {
              let next = parent.children.find((c) => c.type === 'folder' && c.name.toLowerCase() === part.toLowerCase());
              if (!next) { next = folder(part); parent.children.push(next); }
              parent = next;
            }
          }
          const content = await f.text();
          const isSummaryFile = f.name.toLowerCase() === 'summary.txt' && parent !== state.root;
          if (isSummaryFile && parent.summary === content) { skipped++; continue; }
          const existing = parent.children.find((c) => c.type === 'file' && c.name.toLowerCase() === f.name.toLowerCase());
          if (!isSummaryFile && existing && existing.content === content) { skipped++; continue; } // already imported, unchanged
          const modified = f.lastModified ? new Date(f.lastModified).toISOString() : now();
          // Single files added by hand count as new material (a summary above them may now be out of date);
          // a whole imported folder is taken as it is on disk.
          const extra = { createdAt: modified, updatedAt: modified, ...(keepFolders ? {} : { changedAt: now() }) };
          const res = addTextFile(parent, f.name, content, { allowSummary: parent !== state.root, extra });
          lastId = res.node.id;
          added++;
        }
        saveState();
        if (added === 1 && !keepFolders) state.activeFileId = lastId;
        state.view = 'folder';
        render();
        showModal({
          title: 'Import finished',
          text: `${added} file${added === 1 ? '' : 's'} added.` + (skipped ? ` ${skipped} skipped (not .txt, too large, or already imported).` : ''),
          confirmLabel: 'OK',
          hideCancel: true,
          onConfirm: () => {}
        });
      }

      $('importFilesBtn').addEventListener('click', () => $('fileInput').click());
      $('importFolderBtn').addEventListener('click', () => $('folderInput').click());
      $('fileInput').addEventListener('change', (e) => { importFiles(e.target.files, currentFolder(), false); e.target.value = ''; });
      $('folderInput').addEventListener('change', (e) => {
        const picked = Array.from(e.target.files);
        e.target.value = '';
        if (!picked.length) return;
        // If the picked folder contains the same top-level folders as the drive (e.g. "Company A"),
        // it is a copy of the whole knowledge base: merge it into the top level.
        // Otherwise import it as a new sub-folder of the selected folder.
        const topNames = new Set(state.root.children.filter((c) => c.type === 'folder').map((c) => c.name.toLowerCase()));
        const isWholeDrive = picked.some((f) => {
          const parts = f.webkitRelativePath.split('/');
          return parts.length > 2 && topNames.has(parts[1].toLowerCase());
        });
        const files = picked.map((f) => {
          const rel = isWholeDrive ? f.webkitRelativePath.split('/').slice(1).join('/') : f.webkitRelativePath;
          Object.defineProperty(f, 'webkitRelativePath', { value: rel });
          return f;
        });
        importFiles(files, isWholeDrive ? state.root : currentFolder(), true);
      });

      const main = $('main');
      main.addEventListener('dragover', (e) => { if (state.view === 'folder') { e.preventDefault(); main.classList.add('dragging'); } });
      main.addEventListener('dragleave', (e) => { if (!main.contains(e.relatedTarget)) main.classList.remove('dragging'); });
      main.addEventListener('drop', (e) => {
        main.classList.remove('dragging');
        if (state.view !== 'folder' || !e.dataTransfer.files.length) return;
        e.preventDefault();
        importFiles(e.dataTransfer.files, currentFolder(), false);
      });

      function addFolderDropTarget(card, folderId) {
        card.addEventListener('dragover', (e) => { e.preventDefault(); e.stopPropagation(); card.classList.add('drop-target'); });
        card.addEventListener('dragleave', () => card.classList.remove('drop-target'));
        card.addEventListener('drop', (e) => {
          e.preventDefault(); e.stopPropagation();
          card.classList.remove('drop-target');
          main.classList.remove('dragging');
          const target = findById(folderId);
          if (target && e.dataTransfer.files.length) importFiles(e.dataTransfer.files, target.node, false);
        });
      }

      /* ---------- Export ---------- */

      async function saveTextFileToComputer(fileName, content) {
        const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
        if (typeof window.showSaveFilePicker === 'function') {
          try {
            const handle = await window.showSaveFilePicker({ suggestedName: fileName, types: [{ description: 'Text files', accept: { 'text/plain': ['.txt'] } }] });
            const writable = await handle.createWritable();
            await writable.write(blob);
            await writable.close();
            return;
          } catch (error) {
            if (error && error.name === 'AbortError') return;
            console.warn('Save dialog unavailable, falling back to download.', error);
          }
        }
        downloadBlob(blob, fileName);
      }

      function downloadBlob(blob, fileName) {
        const url = URL.createObjectURL(blob);
        const link = el('a', { href: url, download: fileName });
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      async function downloadAllFiles() {
        // Pick the destination folder once and recreate the Company / Location structure inside it.
        if (typeof window.showDirectoryPicker === 'function') {
          try {
            const dir = await window.showDirectoryPicker({ mode: 'readwrite' });
            let count = 0;
            for (const { dirs, name, text } of exportEntries()) {
              let d = dir;
              for (const part of dirs) d = await d.getDirectoryHandle(part, { create: true });
              const fh = await d.getFileHandle(name, { create: true });
              const w = await fh.createWritable();
              await w.write(text);
              await w.close();
              count++;
            }
            showModal({ title: 'Saved', text: `${count} file${count === 1 ? '' : 's'} written, in their company / location folders.`, confirmLabel: 'OK', hideCancel: true, onConfirm: () => {} });
            return;
          } catch (error) {
            if (error && error.name === 'AbortError') return;
            console.warn('Folder picker unavailable, falling back to downloads.', error);
          }
        }
        for (const { dirs, name, text } of exportEntries()) {
          const prefix = dirs.join('_');
          downloadBlob(new Blob([text], { type: 'text/plain;charset=utf-8' }), (prefix ? prefix + '_' : '') + name);
          await new Promise((r) => setTimeout(r, 150));
        }
      }

      // Every document with the folders it lives in; a summary is saved as SUMMARY.txt inside its folder.
      function exportEntries() {
        return allDocs().map(({ node, path }) => (isSummary(node)
          ? { dirs: [...path.slice(1), node].map((p) => p.name), name: 'SUMMARY.txt', text: node.summary }
          : { dirs: path.slice(1).map((p) => p.name), name: node.name, text: node.content }));
      }

      /* ---------- Wiring ---------- */

      $('newFolderBtn').addEventListener('click', () => createItem('folder'));
      $('newFileBtn').addEventListener('click', () => createItem('file'));
      $('downloadAllBtn').addEventListener('click', downloadAllFiles);
      $('resetNav').addEventListener('click', () => {
        showModal({
          title: 'Reset demo data?',
          text: 'This replaces everything in the knowledge base with the built-in example documents and summaries. Files on your computer are not touched.',
          confirmLabel: 'Reset',
          danger: true,
          onConfirm: () => {
            state.root = buildInitialData();
            state.currentFolderId = state.root.id;
            state.activeFileId = null;
            state.dirty = false;
            state.view = 'folder';
            state.expanded.clear();
            saveState();
            saveUiPrefs();
            render();
          }
        });
      });

      $('attentionNav').addEventListener('click', () => {
        if (!confirmLeave()) return;
        state.dirty = false;
        state.view = 'attention';
        state.activeFileId = null;
        render();
      });

      document.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') {
          if (state.activeFileId && state.saveActive) { e.preventDefault(); state.saveActive(); }
        } else if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) {
          e.preventDefault();
          $('searchInput').focus();
        } else if (e.key === 'Escape') {
          $('modal').classList.add('hidden');
          closeViewer();
        }
      });

      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          if (graph.wrap && graph.wrap.isConnected && graph.autoFit) setZoom(fitZoom(graph.width));
        }, 120);
      });

      window.addEventListener('beforeunload', (e) => { if (state.dirty) { e.preventDefault(); e.returnValue = ''; } });

      saveState();
      render();
    </script>
  </body>
</html>
