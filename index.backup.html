<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>knowledge management</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --panel: #ffffff;
        --panel-alt: #eef3ff;
        --line: #dfe7f5;
        --primary: #4f7cff;
        --primary-dark: #315de8;
        --text: #1e2430;
        --muted: #667085;
        --folder: #ffd98a;
        --file: #dfe8ff;
        --shadow: 0 12px 28px rgba(30, 36, 48, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      body {
        display: flex;
        justify-content: center;
        padding: 24px;
      }

      .app {
        width: min(1200px, 100%);
        min-height: 760px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 22px;
        background: linear-gradient(135deg, #eef4ff 0%, #f9fbff 100%);
        border-bottom: 1px solid var(--line);
      }

      .brand {
        font-weight: 700;
        font-size: 1.7rem;
        letter-spacing: -0.04em;
      }

      .actions {
        display: flex;
        gap: 12px;
      }

      button {
        border: none;
        border-radius: 10px;
        font-size: 0.95rem;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      .primary-btn {
        background: var(--primary);
        color: white;
        padding: 10px 16px;
        font-weight: 700;
      }

      .secondary-btn {
        background: #edf2ff;
        color: var(--text);
        padding: 10px 16px;
        font-weight: 600;
      }

      .content {
        display: grid;
        grid-template-columns: 260px 1fr 360px;
        min-height: 700px;
      }

      .sidebar {
        background: #f9fbff;
        border-right: 1px solid var(--line);
        padding: 18px 16px;
      }

      .sidebar h3 {
        margin: 0 0 14px;
        font-size: 0.82rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }

      .nav-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .nav-item {
        padding: 10px 12px;
        border-radius: 10px;
        background: transparent;
        text-align: left;
        font-weight: 600;
        color: var(--text);
      }

      .nav-item.active {
        background: var(--panel-alt);
        color: var(--primary-dark);
      }

      .main {
        padding: 20px;
      }

      .breadcrumbs {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 18px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .crumb {
        background: transparent;
        border: none;
        color: var(--muted);
        padding: 0;
        font-size: 0.9rem;
        cursor: pointer;
      }

      .crumb.current {
        color: var(--text);
        font-weight: 700;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 14px;
      }

      .item-card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px 12px 12px;
        text-align: center;
        cursor: pointer;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      .item-card:hover {
        border-color: #bfd0ff;
        box-shadow: 0 8px 18px rgba(79, 124, 255, 0.08);
      }

      .item-icon {
        width: 52px;
        height: 52px;
        margin: 0 auto 10px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        font-size: 1.4rem;
      }

      .folder .item-icon {
        background: rgba(255, 217, 138, 0.35);
      }

      .file .item-icon {
        background: rgba(223, 232, 255, 0.9);
      }

      .item-name {
        font-size: 0.92rem;
        font-weight: 600;
        word-break: break-word;
      }

      .empty-state {
        border: 1px dashed var(--line);
        border-radius: 16px;
        padding: 40px 20px;
        text-align: center;
        color: var(--muted);
      }

      .editor {
        border-left: 1px solid var(--line);
        background: #fbfcff;
        padding: 20px;
      }

      .editor-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .editor-header h3 {
        margin: 0;
        font-size: 1.1rem;
      }

      .editor-placeholder {
        border: 1px dashed var(--line);
        background: white;
        border-radius: 14px;
        padding: 26px 18px;
        color: var(--muted);
        line-height: 1.5;
      }

      textarea {
        width: 100%;
        min-height: 500px;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px 16px;
        font: 14px/1.5 "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        background: white;
        color: var(--text);
      }

      .save-row {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 12px;
      }

      .modal {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(18, 26, 37, 0.42);
        z-index: 20;
      }

      .modal-card {
        width: min(420px, calc(100vw - 32px));
        background: white;
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 22px;
        box-shadow: var(--shadow);
      }

      .modal-card h3 {
        margin: 0 0 12px;
      }

      .modal-card input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 14px;
        font-size: 1rem;
        margin-bottom: 16px;
      }

      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <div class="brand">knowledge management</div>
        <div class="actions">
          <button class="secondary-btn" id="downloadAllBtn">Download all</button>
          <button class="secondary-btn" id="newFolderBtn">+ Folder</button>
          <button class="primary-btn" id="newFileBtn">+ File</button>
        </div>
      </div>

      <div class="content">
        <aside class="sidebar">
          <h3>Workspace</h3>
          <div class="nav-list">
            <button class="nav-item active" id="rootNav">My Drive</button>
          </div>
        </aside>

        <main class="main">
          <div class="breadcrumbs" id="breadcrumbs"></div>
          <div class="grid" id="itemsGrid"></div>
        </main>

        <aside class="editor">
          <div class="editor-header">
            <h3 id="editorTitle">File preview</h3>
          </div>
          <div id="editorContent">
            <div class="editor-placeholder">
              Select a file to view and edit its text. Create folders and files from the top bar.
            </div>
          </div>
        </aside>
      </div>
    </div>

    <div id="nameModal" class="modal hidden" aria-modal="true" role="dialog">
      <div class="modal-card">
        <h3 id="modalTitle">Create item</h3>
        <input id="modalInput" type="text" placeholder="Name" />
        <div class="modal-actions">
          <button class="secondary-btn" id="cancelModalBtn" type="button">Cancel</button>
          <button class="primary-btn" id="confirmModalBtn" type="button">Create</button>
        </div>
      </div>
    </div>

    <script>
      const STORAGE_KEY = 'knowledge-management-drive';

      const sampleData = {
        type: 'folder',
        name: 'My Drive',
        children: [
          {
            type: 'folder',
            name: 'Projects',
            children: [
              {
                type: 'file',
                name: 'notes.txt',
                content: 'Project ideas\n\n- Launch onboarding docs\n- Review team feedback\n- Schedule planning session'
              }
            ]
          },
          {
            type: 'file',
            name: 'todo.txt',
            content: 'Things to do\n\n- Write project summary\n- Organize research\n- Review meeting notes'
          },
          {
            type: 'file',
            name: 'payrollemail.txt',
            content: 'Subject: Payroll Update\n\nHi Team,\n\nThis is a reminder to review the payroll schedule and confirm any changes before Friday.\n\nThanks,\nPayroll Team'
          }
        ]
      };

      function ensureRequiredFiles(root) {
        if (!root || root.type !== 'folder' || !Array.isArray(root.children)) {
          return root;
        }

        const required = [
          {
            type: 'file',
            name: 'todo.txt',
            content: 'Things to do\n\n- Write project summary\n- Organize research\n- Review meeting notes'
          },
          {
            type: 'file',
            name: 'payrollemail.txt',
            content: 'Subject: Payroll Update\n\nHi Team,\n\nThis is a reminder to review the payroll schedule and confirm any changes before Friday.\n\nThanks,\nPayroll Team'
          }
        ];

        const existingNames = new Set(root.children.map((item) => item && item.name).filter(Boolean));
        required.forEach((item) => {
          if (!existingNames.has(item.name)) {
            root.children.push(item);
            existingNames.add(item.name);
          }
        });

        return root;
      }

      const state = {
        root: ensureRequiredFiles(loadState()),
        currentPath: [],
        activeFile: null
      };

      const itemsGrid = document.getElementById('itemsGrid');
      const breadcrumbs = document.getElementById('breadcrumbs');
      const editorContent = document.getElementById('editorContent');
      const editorTitle = document.getElementById('editorTitle');

      function loadState() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) {
          return JSON.parse(JSON.stringify(sampleData));
        }

        try {
          const parsed = JSON.parse(saved);
          if (parsed && parsed.type === 'folder' && Array.isArray(parsed.children)) {
            return parsed;
          }
        } catch (error) {
          console.warn('Could not parse saved data. Falling back to sample data.', error);
        }

        return JSON.parse(JSON.stringify(sampleData));
      }

      function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.root));
      }

      function getCurrentFolder() {
        let current = state.root;

        for (const segment of state.currentPath) {
          if (!current || current.type !== 'folder') return state.root;
          current = current.children.find((child) => child.name === segment && child.type === 'folder');
          if (!current) return state.root;
        }

        return current;
      }

      function getFolderPathNames() {
        const names = ['My Drive'];
        for (const segment of state.currentPath) {
          names.push(segment);
        }
        return names;
      }

      function renderBreadcrumbs() {
        breadcrumbs.innerHTML = '';
        const pathNames = getFolderPathNames();

        pathNames.forEach((name, index) => {
          const isCurrent = index === pathNames.length - 1;
          const crumb = document.createElement('button');
          crumb.className = isCurrent ? 'crumb current' : 'crumb';
          crumb.textContent = name;
          crumb.type = 'button';

          if (!isCurrent) {
            crumb.addEventListener('click', () => {
              state.currentPath = state.currentPath.slice(0, index);
              state.activeFile = null;
              render();
            });
          }

          breadcrumbs.appendChild(crumb);

          if (!isCurrent && index < pathNames.length - 1) {
            const separator = document.createTextNode(' / ');
            breadcrumbs.appendChild(separator);
          }
        });
      }

      function updateRootNavState() {
        const rootNav = document.getElementById('rootNav');
        rootNav.classList.toggle('active', state.currentPath.length === 0);
      }

      function renderItems() {
        const folder = getCurrentFolder();
        const children = folder.children || [];
        itemsGrid.innerHTML = '';

        if (!children.length) {
          const empty = document.createElement('div');
          empty.className = 'empty-state';
          empty.textContent = 'This folder is empty. Create a file or folder to get started.';
          itemsGrid.appendChild(empty);
          return;
        }

        children.forEach((item) => {
          const card = document.createElement('div');
          card.className = `item-card ${item.type}`;

          const icon = document.createElement('div');
          icon.className = 'item-icon';
          icon.textContent = item.type === 'folder' ? '📁' : '📄';

          const name = document.createElement('div');
          name.className = 'item-name';
          name.textContent = item.name;

          card.appendChild(icon);
          card.appendChild(name);

          card.addEventListener('click', () => {
            if (item.type === 'folder') {
              state.currentPath = [...state.currentPath, item.name];
              state.activeFile = null;
              render();
              return;
            }

            openFile(item);
          });

          itemsGrid.appendChild(card);
        });
      }

      async function saveTextFileToComputer(fileName, content) {
        const fileBlob = new Blob([content], { type: 'text/plain;charset=utf-8' });

        if ('showSaveFilePicker' in window) {
          try {
            const handle = await window.showSaveFilePicker({
              suggestedName: fileName,
              types: [{
                description: 'Text files',
                accept: { 'text/plain': ['.txt'] }
              }]
            });
            const writable = await handle.createWritable();
            await writable.write(fileBlob);
            await writable.close();
            return;
          } catch (error) {
            if (error && error.name !== 'AbortError') {
              console.warn('Save dialog cancelled or unavailable:', error);
            }
          }
        }

        const url = URL.createObjectURL(fileBlob);
        const link = document.createElement('a');
        link.href = url;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function flattenFiles(node, results = []) {
        if (!node || !Array.isArray(node.children)) {
          return results;
        }

        node.children.forEach((child) => {
          if (child.type === 'file') {
            results.push(child);
          }

          if (child.type === 'folder') {
            flattenFiles(child, results);
          }
        });

        return results;
      }

      async function downloadAllFiles() {
        const files = flattenFiles(state.root);

        for (const file of files) {
          await saveTextFileToComputer(file.name, file.content || '');
        }
      }

      function openFile(file) {
        state.activeFile = file;

        editorTitle.textContent = file.name;
        editorContent.innerHTML = `
          <textarea id="fileEditor" aria-label="File editor">${escapeHtml(file.content || '')}</textarea>
          <div class="save-row">
            <button class="secondary-btn" id="downloadFileBtn">Save to computer</button>
            <button class="primary-btn" id="saveFileBtn">Save</button>
          </div>
        `;

        const textarea = document.getElementById('fileEditor');
        const saveButton = document.getElementById('saveFileBtn');
        const downloadButton = document.getElementById('downloadFileBtn');

        saveButton.addEventListener('click', () => {
          file.content = textarea.value;
          saveState();
          alert('File saved.');
        });

        downloadButton.addEventListener('click', async () => {
          file.content = textarea.value;
          saveState();
          await saveTextFileToComputer(file.name, file.content);
        });
      }

      function escapeHtml(value) {
        return value
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function openNameModal(type) {
        const modal = document.getElementById('nameModal');
        const title = document.getElementById('modalTitle');
        const input = document.getElementById('modalInput');
        const confirm = document.getElementById('confirmModalBtn');

        title.textContent = type === 'folder' ? 'Create folder' : 'Create file';
        input.value = '';
        input.placeholder = type === 'folder' ? 'Folder name' : 'File name';
        modal.classList.remove('hidden');
        input.focus();

        const finish = () => {
          const name = input.value.trim();
          if (!name) {
            modal.classList.add('hidden');
            return;
          }

          const currentFolder = getCurrentFolder();
          const item = type === 'folder'
            ? { type: 'folder', name, children: [] }
            : { type: 'file', name, content: '' };

          currentFolder.children.push(item);
          saveState();
          modal.classList.add('hidden');
          render();

          if (type === 'file') {
            openFile(item);
          }
        };

        confirm.onclick = finish;
        input.onkeydown = (event) => {
          if (event.key === 'Enter') {
            finish();
          }
        };
      }

      function createFolder() {
        openNameModal('folder');
      }

      function createFile() {
        openNameModal('file');
      }

      function render() {
        renderBreadcrumbs();
        renderItems();
        updateRootNavState();

        if (!state.activeFile) {
          editorTitle.textContent = 'File preview';
          editorContent.innerHTML = `
            <div class="editor-placeholder">
              Select a file to view and edit its text. Create folders and files from the top bar.
            </div>
          `;
        }
      }

      document.getElementById('newFolderBtn').addEventListener('click', createFolder);
      document.getElementById('newFileBtn').addEventListener('click', createFile);
      document.getElementById('downloadAllBtn').addEventListener('click', downloadAllFiles);
      document.getElementById('rootNav').addEventListener('click', () => {
        state.currentPath = [];
        state.activeFile = null;
        render();
      });
      document.getElementById('cancelModalBtn').addEventListener('click', () => {
        document.getElementById('nameModal').classList.add('hidden');
      });
      document.getElementById('nameModal').addEventListener('click', (event) => {
        if (event.target === event.currentTarget) {
          event.currentTarget.classList.add('hidden');
        }
      });

      render();
    </script>
  </body>
</html>
